<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.8; }
        }
        .deco-item {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 5;
            animation: fall linear infinite;
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden">

    <div id="custom-bg-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>
    <div id="theme-decorations" class="fixed inset-0 z-5 pointer-events-none overflow-hidden"></div>
    <audio id="theme-audio" loop class="hidden"></audio>

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse de Documents -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modale Procédure Installation App Mobile -->
    <div id="app-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-md dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4 relative">
            <button onclick="toggleModal('app-modal', false)" class="absolute top-4 right-4 text-amber-200 hover:text-white text-lg font-bold"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-black text-base text-amber-400 flex items-center gap-2"><i class="fa-solid fa-mobile-screen"></i> Télécharger l'App & Procédure</h3>
            <div id="app-procedure-content" class="text-xs text-amber-100 bg-stone-900 p-4 rounded-2xl border space-y-2 max-h-60 overflow-y-auto">
                Chargement de la procédure...
            </div>
            <a id="app-download-link" href="#" download class="w-full py-3 dyn-btn text-white text-center font-bold rounded-xl block"><i class="fa-solid fa-download mr-1"></i> Télécharger le fichier de l'application</a>
        </div>
    </div>

    <!-- Modale Centre de Notifications -->
    <div id="notifications-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-lg dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4 max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-amber-400 flex items-center gap-2"><i class="fa-solid fa-bell"></i> Centre de Notifications</h3>
                <div class="flex gap-2">
                    <button onclick="clearAllNotifications()" class="px-3 py-1 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold">Tout effacer</button>
                    <button onclick="toggleModal('notifications-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="notifications-list-container" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch(e) { console.error(e); }

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26' }
            ],
            messages: [],
            ideas_board: [],
            quizzes: [],
            quiz_submissions: {},
            appreciations: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            tickets: [],
            polls: [],
            calendar_events: [],
            custom_pages: [],
            hidden_tabs: [],
            flashcard_decks: [],
            app_notifications: [],
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' },
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)', bgMedia: '', bgAudio: '', mode: 'dark' },
            home_qr_image: '',
            app_download_file: '',
            app_install_procedure: '1. Téléchargez le fichier de l’application ci-dessus.\n2. Ouvrez les paramètres de votre téléphone (Android/iOS) et autorisez l’installation de sources inconnues si nécessaire.\n3. Installez l’application et profitez de LE QG directement sur votre écran d’accueil !'
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                if (db) {
                    try { await db.collection("leqg_data").doc(k).set({ value: val }); } catch(err) { console.error(err); }
                }
                applyTheme();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeQuizId: null,
            activeDeckId: null,
            cardIndex: 0,
            showAnswerCard: false,
            creatingDeck: false,
            formationSearch: '',
            formationTypeFilter: 'all',
            formationCityFilter: 'all',
            editingDocIndex: null,
            pomodoroTimer: null,
            pomodoroSeconds: 25 * 60,
            pomodoroRunning: false,
            pomodoroMode: 'work'
        };

        async function init() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
            if (db) {
                try {
                    let userDoc = await db.collection("leqg_data").doc("users").get();
                    if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                        const keys = Object.keys(cloudData);
                        for (let k of keys) {
                            await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                        }
                    } else {
                        const keys = Object.keys(cloudData);
                        for (let k of keys) {
                            let doc = await db.collection("leqg_data").doc(k).get();
                            if (doc.exists) cloudData[k] = doc.data().value;
                        }
                    }
                } catch(e) { console.error(e); }
            }
            applyTheme();
            render();

            setInterval(async () => {
                if (db && getCurrentUser()) {
                    try {
                        const keys = Object.keys(cloudData);
                        let updated = false;
                        for (let k of keys) {
                            let doc = await db.collection("leqg_data").doc(k).get();
                            if (doc.exists && JSON.stringify(doc.data().value) !== JSON.stringify(cloudData[k])) {
                                cloudData[k] = doc.data().value;
                                updated = true;
                            }
                        }
                        if (updated) {
                            updateNotificationsModalContent(getCurrentUser());
                        }
                    } catch(e){}
                }
            }, 6000);
        }

        async function pushNotification(title, message, targetRole = 'all') {
            let notifs = DB.get('app_notifications') || [];
            notifs.unshift({
                id: Date.now(),
                title,
                message,
                targetRole,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString(),
                read: false
            });
            if (notifs.length > 50) notifs = notifs.slice(0, 50);
            await DB.set('app_notifications', notifs);
            showToast(title, message);

            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, { body: message, icon: "https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&q=80&w=120" });
                } catch(err) { console.error(err); }
            }
        }

        async function clearAllNotifications() {
            await DB.set('app_notifications', []);
            showToast("Notifications", "Le centre de notifications a été vidé.");
        }

        function triggerAppModal() {
            let fileUrl = DB.get('app_download_file') || '#';
            let proc = DB.get('app_install_procedure') || 'Aucune procédure renseignée.';
            document.getElementById('app-download-link').href = fileUrl;
            document.getElementById('app-procedure-content').innerHTML = proc.replace(/\n/g, '<br>');
            toggleModal('app-modal', true);
        }

        function applyTheme() {
            let t = DB.get('site_theme') || {};
            if (t.btnColor) document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            if (t.cardBg) document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            if (t.borderColor) document.documentElement.style.setProperty('--custom-border-color', t.borderColor);
            
            let body = document.getElementById('body-theme');
            body.className = t.mode === 'light' ? "bg-stone-100 text-stone-900 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden" : "bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden";

            let bgC = document.getElementById('custom-bg-container');
            if (bgC) {
                if (t.bgMedia) {
                    bgC.innerHTML = t.bgMedia.match(/\.(mp4|webm|ogg)$/i) || t.bgMedia.startsWith('data:video') ? `<video autoplay muted loop class="w-full h-full object-cover opacity-40"><source src="${t.bgMedia}"></video>` : `<div class="w-full h-full bg-cover bg-center opacity-40" style="background-image: url('${t.bgMedia}')"></div>`;
                } else { bgC.innerHTML = ''; }
            }

            let audioEl = document.getElementById('theme-audio');
            if (audioEl) {
                if (t.bgAudio) {
                    if (audioEl.src !== t.bgAudio) { audioEl.src = t.bgAudio; audioEl.play().catch(e => console.log(e)); }
                } else { audioEl.pause(); audioEl.src = ''; }
            }

            let decoContainer = document.getElementById('theme-decorations');
            if (!decoContainer) return;
            decoContainer.innerHTML = '';
            
            let symbol = '';
            if (t.preset === 'noel') symbol = '🎁';
            else if (t.preset === 'halloween') symbol = '🎃';
            else if (t.preset === 'paques') symbol = '🥚';
            else if (t.preset === 'automne') symbol = '🍂';
            else if (t.preset === 'hiver') symbol = '❄️';
            else if (t.preset === 'printemps') symbol = '🌸';
            else if (t.preset === 'ete') symbol = '☀️';

            if (symbol) {
                let count = t.preset === 'ete' ? 30 : 18;
                for (let i = 0; i < count; i++) {
                    let item = document.createElement('div');
                    item.className = 'deco-item text-xl';
                    item.textContent = symbol;
                    item.style.left = Math.random() * 100 + 'vw';
                    item.style.animationDuration = (Math.random() * 4 + 4) + 's';
                    item.style.animationDelay = (Math.random() * 5) + 's';
                    decoContainer.appendChild(item);
                }
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 5000);
        }
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            c.innerHTML = type && type.includes('pdf') ? `<embed src="${url}" type="application/pdf" width="100%" height="100%" />` : `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5', acc = user.avatarAccessory || '👤', hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}"><span>${acc}</span><span class="absolute -top-1 right-0 text-[10px]">${hair}</span></div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
            updateNotificationsModalContent(user);
        }

        function updateNotificationsModalContent(user) {
            let notifs = DB.get('app_notifications') || [];
            let filtered = notifs.filter(n => n.targetRole === 'all' || (n.targetRole === 'admin' && (user.role === 'admin' || user.role === 'delegate')));
            let container = document.getElementById('notifications-list-container');
            let badge = document.getElementById('notif-badge-count');
            if (badge) {
                badge.textContent = filtered.length;
                badge.style.display = filtered.length > 0 ? 'inline-block' : 'none';
            }
            if (!container) return;
            if (filtered.length === 0) { container.innerHTML = `<p class="text-center text-amber-200/50 py-6 text-xs">Aucune notification.</p>`; return; }
            container.innerHTML = filtered.map(n => `<div class="p-3 bg-stone-900 border border-amber-900/40 rounded-2xl flex items-start gap-3"><div class="text-amber-400 text-lg mt-0.5"><i class="fa-solid fa-bell"></i></div><div class="flex-1 space-y-0.5"><div class="flex justify-between items-center"><h4 class="font-bold text-amber-300 text-xs">${n.title}</h4><span class="text-[9px] text-amber-200/50">${n.time} - ${n.date}</span></div><p class="text-amber-100 text-[11px]">${n.message}</p></div></div>`).join('');
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center"><div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div><h1 class="text-2xl font-black text-white">LE QG - Connexion</h1><form onsubmit="handleLogin(event)" class="space-y-3 text-left"><input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100"><input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100"><button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button></form></div></div>`;
        }

        function renderSetup(user) {
            let isAdmin = user.role === 'admin';
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs"><h1 class="text-base font-bold text-amber-400">Configuration obligatoire</h1><form onsubmit="saveSetup(event)" class="space-y-3">${isAdmin ? `<div><label class="block font-bold text-amber-300">Nouvel Identifiant Admin *</label><input type="text" id="s-username" value="${user.username}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>` : ''}<div><label class="block font-bold text-amber-300">Nom & Prénom réels *</label><input type="text" id="s-lastname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div><div><label class="block font-bold text-amber-300">Date de naissance *</label><input type="date" id="s-birth" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div><div><label class="block font-bold text-amber-300">Nouveau Mot de passe *</label><input type="password" id="s-pass" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div><div><label class="block font-bold text-amber-300">Pseudo de messagerie</label><input type="text" id="s-pseudo" value="${user.pseudo || ''}" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div><button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Valider</button></form></div></div>`;
        }

        function renderDashboard(user) {
            let canAccessAdmin = user.role === 'admin' || user.role === 'delegate';
            let hidden = DB.get('hidden_tabs') || [];
            let customPages = (DB.get('custom_pages') || []).filter(p => !p.title.toLowerCase().includes('qr') && !p.title.toLowerCase().includes('badge') && !p.title.toLowerCase().includes('toutou'));
            function isVisible(tabId) { return !hidden.includes(tabId); }

            return `<header class="bg-stone-950/80 border-b border-amber-900/40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                <div class="flex items-center gap-3"><button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button><div class="flex items-center gap-2">${renderAvatarBadge(user)}<div><div class="font-black text-amber-400 text-xs">${user.pseudo || user.username}</div><div class="text-[9px] text-amber-200/60">${user.realName || user.username}</div></div></div></div>
                <div class="flex items-center gap-2"><button onclick="toggleModal('notifications-modal', true)" class="relative px-3 py-1.5 bg-stone-900 border border-amber-500/40 text-amber-300 text-xs rounded-xl font-bold flex items-center gap-1.5"><i class="fa-solid fa-bell"></i> Notifications<span id="notif-badge-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold" style="display:none">0</span></button><button onclick="triggerAppModal()" class="px-3 py-1.5 dyn-btn text-white text-xs rounded-xl font-bold flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen"></i> App Mobile</button><button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border">Déconnexion</button></div>
            </header>
            <div class="flex-1 flex overflow-hidden relative">
                <aside class="fixed inset-y-0 left-0 z-30 w-64 bg-stone-950/95 border-r transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-4 pt-16 space-y-1 text-xs overflow-y-auto">
                    ${isVisible('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                    ${isVisible('profile') ? sbBtn('profile', 'Mon Profil & Avatar', 'user-astronaut') : ''}
                    ${isVisible('formations') ? sbBtn('formations', 'Formations Post-Bac', 'graduation-cap') : ''}
                    ${isVisible('calendar') ? sbBtn('calendar', 'Planning & Agenda', 'calendar-days') : ''}
                    ${isVisible('tickets') ? sbBtn('tickets', 'Mails & Support Tickets', 'envelope') : ''}
                    ${isVisible('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'award') : ''}
                    ${isVisible('chat') ? sbBtn('chat', 'Messagerie & Canal', 'comments') : ''}
                    ${isVisible('quizzes') ? sbBtn('quizzes', 'Quiz & Ma Progression', 'brain') : ''}
                    ${isVisible('polls') ? sbBtn('polls', 'Sondages Éclairs', 'square-poll-vertical') : ''}
                    ${isVisible('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                    ${isVisible('exams') ? sbBtn('exams', 'Sujets & Exercices', 'file-pdf') : ''}
                    ${isVisible('documents') ? sbBtn('documents', 'Mon Traitement de Texte', 'folder-open') : ''}
                    ${isVisible('flashcards') ? sbBtn('flashcards', 'Créateur Flashcards', 'clone') : ''}
                    ${isVisible('orientation') ? sbBtn('orientation', 'CV & Lettres Type', 'file-lines') : ''}
                    ${isVisible('simulator') ? sbBtn('simulator', 'Simulateur de Moyenne', 'calculator') : ''}
                    ${isVisible('mood') ? sbBtn('mood', 'Mur des Humeurs', 'face-smile') : ''}
                    ${isVisible('pomodoro') ? sbBtn('pomodoro', 'Mode Focus / Pomodoro', 'stopwatch') : ''}
                    ${isVisible('goldbook') ? sbBtn('goldbook', 'Livre d\'Or', 'book-bookmark') : ''}
                    ${isVisible('ideas') ? sbBtn('ideas', 'Boîte à Idées', 'lightbulb') : ''}
                    ${customPages.map(cp => isVisible('cp_' + cp.id) ? sbBtn('cp_' + cp.id, cp.title, 'star') : '').join('')}
                    ${canAccessAdmin ? sbBtn('admin', 'Espace Délégué / Admin', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                </aside>
                <main class="flex-1 overflow-y-auto p-4 md:p-6">${renderContent(user)}</main>
            </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon} w-4"></i> ${label}</button>`;
        }

        function renderContent(user) {
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'profile') return renderProfileTab(user);
            if (state.tab === 'formations') return renderFormationsTab();
            if (state.tab === 'calendar') return renderCalendarTab();
            if (state.tab === 'tickets') return renderTicketsTab(user);
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'quizzes') return renderQuizzesTab(user);
            if (state.tab === 'polls') return renderPollsTab(user);
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', DB.get('revision_sheets') || []);
            if (state.tab === 'exams') return renderExamsTab();
            if (state.tab === 'documents') return renderDocumentsTab(user);
            if (state.tab === 'flashcards') return renderFlashcardsTab(user);
            if (state.tab === 'orientation') return renderOrientationTab();
            if (state.tab === 'simulator') return renderSimulatorTab(user);
            if (state.tab === 'mood') return renderMoodTab(user);
            if (state.tab === 'pomodoro') return renderPomodoroTab();
            if (state.tab === 'goldbook') return renderGoldBookTab(user);
            if (state.tab === 'ideas') return renderIdeasPage(user);
            if (state.tab.startsWith('cp_')) return renderCustomPage(state.tab.replace('cp_', ''));
            if (state.tab === 'admin' && (user.role === 'admin' || user.role === 'delegate')) return renderAdmin();
            return '';
        }

        function renderHome() {
            let qr = DB.get('home_qr_image') || '';
            let countdown = DB.get('countdown') || { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' };
            let diffDays = Math.ceil((new Date(countdown.date) - new Date()) / (1000 * 60 * 60 * 24));
            return `<div class="max-w-3xl mx-auto space-y-6 text-center"><div class="dyn-card border p-8 space-y-3 rounded-3xl shadow-2xl"><h2 class="text-3xl font-black text-amber-400">⏳ ${countdown.title}</h2><div class="text-4xl font-extrabold text-white mt-2">${diffDays >= 0 ? diffDays + ' jours restants !' : 'Événement passé'}</div></div><div class="dyn-card border p-8 space-y-3 rounded-3xl"><h2 class="text-2xl font-black text-white">Bienvenue sur LE QG</h2><p class="text-xs text-amber-200/75">Plateforme collaborative de classe 100% synchronisée.</p></div><div class="dyn-card border p-6 rounded-3xl space-y-3"><h3 class="font-bold text-amber-400 text-sm"><i class="fa-solid fa-qrcode mr-2"></i>QR Code d'accès mobile</h3>${qr ? `<div class="bg-white p-3 inline-block rounded-2xl shadow-xl"><img src="${qr}" width="160" height="160"/></div>` : `<p class="text-xs text-amber-200/50">Aucun QR code configuré.</p>`}</div></div>`;
        }

        function renderProfileTab(user) {
            return `<div class="max-w-2xl mx-auto dyn-card border p-6 rounded-3xl space-y-6 text-xs"><h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-user-astronaut mr-2"></i>Mon Profil & Studio Avatar</h2><div class="flex items-center gap-6 p-4 bg-stone-900 rounded-2xl border"><div class="relative w-20 h-20 rounded-full border-2 border-amber-400 flex items-center justify-center text-3xl overflow-hidden" style="background-color: ${user.avatarSkin || '#fca5a5'}"><span>${user.avatarAccessory || '👤'}</span><span class="absolute top-1 right-2 text-xl">${user.avatarHair || '🧢'}</span></div><div class="space-y-1"><div class="font-bold text-lg text-amber-300">${user.pseudo || user.username}</div><div class="text-amber-200/70">${user.realName || 'Nom non configuré'}</div><div class="text-[10px] text-amber-400/80">Rôle : ${user.role}</div></div></div><form onsubmit="saveProfileAvatar(event, '${user.username}')" class="space-y-4"><h3 class="font-bold text-amber-300 border-b pb-1">Personnaliser l'Avatar & Infos</h3><div class="space-y-2"><label class="block font-bold">Pseudo de messagerie :</label><input type="text" id="av-pseudo" value="${user.pseudo || ''}" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div><div class="space-y-2"><label class="block font-bold">Nom et Prénom réels :</label><input type="text" id="av-realname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div><div class="grid grid-cols-3 gap-3"><div><label class="block font-bold mb-1">Teint :</label><input type="color" id="av-skin" value="${user.avatarSkin || '#fca5a5'}" class="w-full h-10 p-1 bg-stone-900 border rounded-xl"></div><div><label class="block font-bold mb-1">Accessoire :</label><select id="av-acc" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"><option value="👑" ${user.avatarAccessory==='👑'?'selected':''}>👑</option><option value="🕶️" ${user.avatarAccessory==='🕶️'?'selected':''}>🕶️</option><option value="🎧" ${user.avatarAccessory==='🎧'?'selected':''}>🎧</option><option value="👤" ${user.avatarAccessory==='👤'?'selected':''}>👤</option></select></div><div><label class="block font-bold mb-1">Coiffure :</label><select id="av-hair" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"><option value="🧢" ${user.avatarHair==='🧢'?'selected':''}>🧢</option><option value="🎩" ${user.avatarHair==='🎩'?'selected':''}>🎩</option><option value="🎓" ${user.avatarHair==='🎓'?'selected':''}>🎓</option></select></div></div><button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl">Enregistrer mon profil</button></form></div>`;
        }

        async function saveProfileAvatar(event, username) {
            event.preventDefault();
            let users = DB.get('users') || [], idx = users.findIndex(u => u.username === username);
            if (idx !== -1) {
                users[idx].pseudo = document.getElementById('av-pseudo').value;
                users[idx].realName = document.getElementById('av-realname').value;
                users[idx].avatarSkin = document.getElementById('av-skin').value;
                users[idx].avatarAccessory = document.getElementById('av-acc').value;
                users[idx].avatarHair = document.getElementById('av-hair').value;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                showToast("Profil mis à jour !", "");
            }
        }

        function renderCalendarTab() {
            let events = DB.get('calendar_events') || [];
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400">Agenda & Planning</h2></div><div class="space-y-2">${events.length === 0 ? '<div class="dyn-card border p-6 text-center text-amber-200/50 rounded-2xl">Aucun événement.</div>' : ''}${events.map(ev => `<div class="dyn-card border p-4 rounded-2xl"><div><h4 class="font-bold text-amber-200 text-sm">${ev.title}</h4><p class="text-[10px] text-amber-200/60">${ev.date} - ${ev.desc}</p></div></div>`).join('')}</div></div>`;
        }

        function renderFormationsTab() {
            let list = DB.get('formations') || [];
            let cities = [...new Set(list.map(f => f.city).filter(Boolean))];
            let filtered = list.filter(f => (f.title + ' ' + f.desc + ' ' + f.establishment).toLowerCase().includes(state.formationSearch.toLowerCase()) && (state.formationTypeFilter === 'all' || f.type === state.formationTypeFilter) && (state.formationCityFilter === 'all' || f.city === state.formationCityFilter));
            return `<div class="max-w-4xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl space-y-3"><h2 class="text-xl font-black text-amber-400">Formations Post-Bac</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-2"><input type="text" placeholder="Rechercher..." value="${state.formationSearch}" oninput="state.formationSearch=this.value;render()" class="p-2.5 bg-stone-900 border rounded-xl text-white"><select onchange="state.formationTypeFilter=this.value;render()" class="p-2.5 bg-stone-900 border rounded-xl text-white"><option value="all">Tous les rythmes</option><option value="Initial">Initial</option><option value="Alternance">Alternance</option><option value="Apprentissage">Apprentissage</option></select><select onchange="state.formationCityFilter=this.value;render()" class="p-2.5 bg-stone-900 border rounded-xl text-white"><option value="all">Toutes les villes</option>${cities.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div></div><div class="space-y-3">${filtered.length === 0 ? '<div class="dyn-card border p-6 text-center text-amber-200/50 rounded-2xl">Aucune formation.</div>' : ''}${filtered.map(f => `<div class="dyn-card border p-5 rounded-2xl space-y-2"><div class="flex justify-between items-start"><div><h3 class="font-bold text-amber-300 text-sm">${f.title}</h3><p class="text-[10px] text-amber-200/70">${f.establishment} - ${f.city}</p></div><span class="px-2.5 py-1 bg-amber-500/15 text-amber-400 rounded-lg text-[10px] font-bold">${f.type}</span></div><p class="text-amber-100 text-xs">${f.desc}</p>${f.link ? `<a href="${f.link}" target="_blank" class="inline-block mt-2 px-3 py-1.5 dyn-btn text-white font-bold rounded-xl text-[10px]">Plus d'infos</a>` : ''}</div>`).join('')}</div></div>`;
        }

        function renderTicketsTab(user) {
            let users = DB.get('users') || [], tickets = DB.get('tickets') || [];
            let myTickets = tickets.filter(t => t.sender === user.username || t.recipient === user.username || user.role === 'admin' || user.role === 'delegate');
            return `<div class="max-w-4xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl space-y-4"><h2 class="text-xl font-black text-amber-400">Mails & Support Tickets</h2><form onsubmit="sendNewTicket(event)" class="p-4 bg-stone-900/60 rounded-2xl border space-y-3"><select id="tk-recipient" required class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><option value="">Destinataire...</option>${users.filter(u => u.username !== user.username).map(u => `<option value="${u.username}">${u.pseudo || u.username} (${u.role})</option>`).join('')}</select><input type="text" id="tk-subject-extra" required placeholder="Sujet précis..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><textarea id="tk-body" required placeholder="Message..." class="w-full p-2.5 bg-stone-950 border rounded-xl h-20 resize-none text-white"></textarea><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Envoyer</button></form></div><div class="space-y-3">${myTickets.map(t => `<div class="dyn-card border p-5 rounded-2xl space-y-3"><div class="flex justify-between items-center border-b pb-2"><div><span class="font-mono text-amber-400">${t.ticketId}</span> - <span class="font-bold text-white">${t.subject}</span></div><span class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 font-bold">${t.status}</span></div><div class="space-y-1 max-h-32 overflow-y-auto">${t.replies.map(r => `<div class="p-2 bg-stone-950 rounded"><div class="text-[10px] text-amber-400 font-bold">${r.author} (${r.date})</div><p class="text-amber-100">${r.text}</p></div>`).join('')}</div><form onsubmit="replyTicket(event, '${t.ticketId}')" class="flex gap-2"><input type="text" id="reply_${t.ticketId}" required placeholder="Répondre..." class="flex-1 p-2 bg-stone-900 border rounded-xl text-white"><button type="submit" class="px-3 py-1 dyn-btn text-white rounded-xl">Envoyer</button></form></div>`).join('')}</div></div>`;
        }

        async function sendNewTicket(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let tickets = DB.get('tickets') || [];
            tickets.push({ ticketId: '#TKT-' + Math.floor(10000 + Math.random() * 90000), sender: user.username, recipient: document.getElementById('tk-recipient').value, subject: document.getElementById('tk-subject-extra').value, status: 'Ouvert', date: new Date().toLocaleString(), replies: [{ author: user.pseudo || user.username, text: document.getElementById('tk-body').value, date: new Date().toLocaleString() }] });
            await DB.set('tickets', tickets);
            showToast("Mail envoyé", "");
        }

        async function replyTicket(e, ticketId) {
            e.preventDefault();
            let user = getCurrentUser(), tickets = DB.get('tickets') || [], idx = tickets.findIndex(t => t.ticketId === ticketId);
            if (idx !== -1) {
                tickets[idx].replies.push({ author: user.pseudo || user.username, text: document.getElementById(`reply_${ticketId}`).value, date: new Date().toLocaleString() });
                await DB.set('tickets', tickets);
                render();
            }
        }

        function renderUserAppreciations(user) {
            let all = DB.get('appreciations') || {}, myApp = all[user.username] || { t1: '', t2: '', t3: '', published: false };
            if (!myApp.published) return `<div class="max-w-2xl mx-auto dyn-card border p-8 text-center rounded-3xl"><i class="fa-solid fa-lock text-4xl text-amber-400"></i><h2 class="text-xl font-bold text-white">Appréciations</h2><p class="text-xs text-amber-200/70 mt-2">Non publiées.</p></div>`;
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400">Mes Appréciations</h2></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T1</h4><p class="mt-2 text-amber-100">${myApp.t1||'Aucune'}</p></div><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T2</h4><p class="mt-2 text-amber-100">${myApp.t2||'Aucune'}</p></div><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T3</h4><p class="mt-2 text-amber-100">${myApp.t3||'Aucune'}</p></div></div></div>`;
        }

        function renderQuizzesTab(user) {
            let quizzes = DB.get('quizzes') || [], subs = DB.get('quiz_submissions') || {}, mySubs = subs[user.username] || [];
            if (state.activeQuizId) {
                let q = quizzes.find(x => x.id === state.activeQuizId);
                return q ? `<div class="max-w-2xl mx-auto dyn-card border p-6 rounded-3xl space-y-4 text-xs"><h2 class="text-lg font-black text-amber-400">${q.title}</h2><form onsubmit="submitQuiz(event, ${q.id})" class="space-y-4">${q.questions.map((item, qIdx)=>`<div class="p-3 bg-stone-900 border rounded-xl"><p class="font-bold text-amber-100">${item.question}</p>${item.options.map((opt, oIdx)=>`<label class="block p-1 text-white"><input type="radio" name="q_${qIdx}" value="${oIdx}" required> ${opt}</label>`).join('')}</div>`).join('')}<button type="submit" class="w-full py-2 dyn-btn text-white rounded-xl font-bold">Valider</button></form></div>` : '';
            }
            let bestScores = {};
            mySubs.forEach(s => { if (!bestScores[s.quizId] || s.score > bestScores[s.quizId].score) bestScores[s.quizId] = s; });
            let bestList = Object.values(bestScores);
            let avgGeneral = bestList.length > 0 ? (bestList.reduce((acc, curr) => acc + (curr.score / curr.total) * 20, 0) / bestList.length).toFixed(1) : '-';

            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl flex justify-between items-center"><h2 class="text-xl font-black text-amber-400">Quiz & Progression</h2><div class="text-right"><span class="text-xs text-amber-200">Moyenne (Meilleures Notes) :</span><div class="text-xl font-extrabold text-amber-400">${avgGeneral} / 20</div></div></div><div class="space-y-2">${quizzes.map(q=>`<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center"><span>${q.title}</span><button onclick="state.activeQuizId=${q.id};render()" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Lancer</button></div>`).join('')}</div><div class="dyn-card border p-6 rounded-3xl space-y-2"><h3 class="font-bold text-amber-300">Historique complet</h3>${mySubs.length === 0 ? '<p class="text-amber-200/50">Aucun quiz.</p>' : mySubs.map(s => `<div class="p-2 bg-stone-900 rounded flex justify-between"><span>${s.quizTitle} (${s.date})</span><span class="font-bold text-amber-400">${s.score} / ${s.total}</span></div>`).join('')}</div></div>`;
        }

        async function submitQuiz(e, quizId) {
            e.preventDefault();
            let quiz = (DB.get('quizzes') || []).find(x => x.id === quizId), score = 0;
            quiz.questions.forEach((q, idx) => { let sel = document.querySelector(`input[name="q_${idx}"]:checked`); if (sel && parseInt(sel.value) === parseInt(q.correct)) score++; });
            let user = getCurrentUser(), subs = DB.get('quiz_submissions') || {};
            if (!subs[user.username]) subs[user.username] = [];
            subs[user.username].push({ quizId, quizTitle: quiz.title, score, total: quiz.questions.length, date: new Date().toLocaleDateString() });
            await DB.set('quiz_submissions', subs);
            showToast("Quiz validé", `Score : ${score}/${quiz.questions.length}`);
            state.activeQuizId = null; render();
        }

        function renderPollsTab(user) {
            let polls = DB.get('polls') || [];
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400">Sondages Éclairs</h2></div><div class="space-y-3">${polls.map((p, pIdx) => { let hasVoted = p.voters && p.voters.includes(user.username); return `<div class="dyn-card border p-5 rounded-2xl space-y-3"><h3 class="font-bold text-amber-200 text-sm">${p.question}</h3><div class="space-y-2">${p.options.map((opt, oIdx) => `<div class="p-2.5 bg-stone-900 border rounded-xl flex justify-between items-center text-white"><span>${opt}</span>${hasVoted ? `<span class="font-bold text-amber-400">${p.results[oIdx] || 0} vote(s)</span>` : `<button onclick="votePoll(${pIdx}, ${oIdx})" class="px-3 py-1 dyn-btn text-white rounded-lg">Voter</button>`}</div>`).join('')}</div></div>`).join('')}</div></div>`;
        }

        async function votePoll(pIdx, oIdx) {
            let user = getCurrentUser(), polls = DB.get('polls') || [];
            if (!polls[pIdx].voters) polls[pIdx].voters = [];
            if (polls[pIdx].voters.includes(user.username)) return;
            polls[pIdx].voters.push(user.username);
            if (!polls[pIdx].results) polls[pIdx].results = {};
            polls[pIdx].results[oIdx] = (polls[pIdx].results[oIdx] || 0) + 1;
            await DB.set('polls', polls);
            showToast("Vote enregistré !", "");
            render();
        }

        // --- 1. BOÎTE À IDÉES (AVEC VOTES ET 2 JOURS D'EXPIRATION) ---
        function renderIdeasPage(user) {
            let ideas = DB.get('ideas_board') || [];
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl space-y-3">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-lightbulb mr-2"></i>Boîte à Idées & Votes</h2>
                    <form onsubmit="submitIdea(event)" class="space-y-3">
                        <textarea id="idea-text" required placeholder="Proposez une idée pour la classe..." class="w-full p-3 bg-stone-900 border rounded-xl text-white h-20 resize-none"></textarea>
                        <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier l'idée</button>
                    </form>
                </div>
                <div class="space-y-3">
                    ${ideas.length === 0 ? '<div class="dyn-card border p-6 text-center text-amber-200/50 rounded-2xl">Aucune idée publiée.</div>' : ''}
                    ${ideas.map(item => {
                        let isExpired = (Date.now() - item.id) > (2 * 24 * 60 * 60 * 1000);
                        let hasVoted = item.voters && item.voters.includes(user.username);
                        let totalVotes = (item.votes || 0);
                        return `
                            <div class="dyn-card border p-5 rounded-2xl space-y-3">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <span class="font-bold text-amber-300">${item.author}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isExpired ? 'bg-red-500/20 text-red-300' : 'bg-green-500/20 text-green-300'}">${isExpired ? 'Vote Clôturé' : 'Vote en cours (2 jours)'}</span>
                                </div>
                                <p class="text-amber-100 text-sm">${item.text}</p>
                                <div class="flex justify-between items-center pt-2">
                                    <span class="font-bold text-amber-400">👍 ${totalVotes} vote(s) pour ce projet</span>
                                    ${!isExpired && !hasVoted ? `<button onclick="voteIdea(${item.id})" class="px-4 py-1.5 dyn-btn text-white font-bold rounded-xl">J'aime ce projet</button>` : ''}
                                    ${hasVoted ? `<span class="text-amber-200/60 italic">Vous avez voté</span>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>`;
        }

        async function submitIdea(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let text = document.getElementById('idea-text').value;
            let ideas = DB.get('ideas_board') || [];
            ideas.unshift({ id: Date.now(), author: user.pseudo || user.username, text, votes: 0, voters: [] });
            await DB.set('ideas_board', ideas);
            showToast("Idée publiée !", "Le vote de 2 jours est ouvert.");
            render();
        }

        async function voteIdea(id) {
            let user = getCurrentUser();
            let ideas = DB.get('ideas_board') || [];
            let item = ideas.find(i => i.id === id);
            if (item && (!item.voters || !item.voters.includes(user.username))) {
                if (!item.voters) item.voters = [];
                item.voters.push(user.username);
                item.votes = (item.votes || 0) + 1;
                await DB.set('ideas_board', ideas);
                showToast("Vote pris en compte !", "");
                render();
            }
        }

        // --- 2. MODE FOCUS / POMODORO ---
        function renderPomodoroTab() {
            let mins = Math.floor(state.pomodoroSeconds / 60);
            let secs = state.pomodoroSeconds % 60;
            let timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            return `<div class="max-w-md mx-auto dyn-card border p-8 rounded-3xl text-center space-y-6">
                <h2 class="text-2xl font-black text-amber-400"><i class="fa-solid fa-stopwatch mr-2"></i>Mode Focus / Pomodoro</h2>
                <div class="text-6xl font-black font-mono text-white tracking-widest my-4">${timeStr}</div>
                <div class="flex justify-center gap-3">
                    <button onclick="startPomodoro()" class="px-5 py-2.5 dyn-btn text-white font-bold rounded-xl"><i class="fa-solid fa-play mr-1"></i> Démarrer</button>
                    <button onclick="pausePomodoro()" class="px-5 py-2.5 bg-stone-800 text-amber-200 font-bold rounded-xl border"><i class="fa-solid fa-pause mr-1"></i> Pause</button>
                    <button onclick="resetPomodoro()" class="px-5 py-2.5 bg-stone-900 text-amber-200 font-bold rounded-xl border"><i class="fa-solid fa-rotate-right mr-1"></i> Reset</button>
                </div>
            </div>`;
        }

        function startPomodoro() {
            if (state.pomodoroRunning) return;
            state.pomodoroRunning = true;
            state.pomodoroTimer = setInterval(() => {
                if (state.pomodoroSeconds > 0) {
                    state.pomodoroSeconds--;
                    render();
                } else {
                    pausePomodoro();
                    showToast("Pomodoro terminé !", "Prenez une pause bien méritée.");
                }
            }, 1000);
        }

        function pausePomodoro() {
            state.pomodoroRunning = false;
            clearInterval(state.pomodoroTimer);
            render();
        }

        function resetPomodoro() {
            pausePomodoro();
            state.pomodoroSeconds = 25 * 60;
            render();
        }

        // --- 3. CRÉATEUR DE FLASHCARDS ---
        function renderFlashcardsTab(user) {
            let decks = DB.get('flashcard_decks') || [];

            if (state.creatingDeck) {
                return `<div class="max-w-2xl mx-auto dyn-card border p-6 rounded-3xl space-y-4 text-xs">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="text-lg font-black text-amber-400">Créer un nouveau jeu de Flashcards</h2>
                        <button onclick="state.creatingDeck=false;render()" class="px-3 py-1 bg-stone-900 border rounded-xl text-amber-200 font-bold">Retour</button>
                    </div>
                    <form onsubmit="saveNewFlashcardDeck(event)" class="space-y-3">
                        <input type="text" id="fc-title" required placeholder="Titre du jeu de flashcards..." class="w-full p-3 bg-stone-950 border rounded-xl text-white font-bold">
                        <label class="flex items-center gap-2 cursor-pointer pt-1 text-white">
                            <input type="checkbox" id="fc-public" class="w-4 h-4 accent-amber-600">
                            <span class="font-bold">Rendre ce jeu public (accessible à toute la classe)</span>
                        </label>
                        <div id="fc-cards-container" class="space-y-3 pt-2 max-h-72 overflow-y-auto pr-1">
                            <div class="p-3 bg-stone-950 rounded-xl border space-y-2">
                                <input type="text" placeholder="Question 1" class="fc-q w-full p-2 bg-stone-900 border rounded-xl text-white" required>
                                <input type="text" placeholder="Réponse 1" class="fc-a w-full p-2 bg-stone-900 border rounded-xl text-white" required>
                            </div>
                        </div>
                        <button type="button" onclick="addFlashcardRow()" class="px-3 py-1.5 bg-stone-800 text-amber-300 rounded-xl font-bold">+ Ajouter une carte (max 100)</button>
                        <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Enregistrer le jeu</button>
                    </form>
                </div>`;
            }

            if (state.activeDeckId) {
                let deck = decks.find(d => d.id === state.activeDeckId);
                if (!deck) return '';
                let card = deck.cards[state.cardIndex] || { q: '', a: '' };
                return `<div class="max-w-xl mx-auto dyn-card border p-8 rounded-3xl text-center space-y-6 text-xs">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="text-lg font-black text-amber-400">${deck.title} (Carte ${state.cardIndex + 1}/${deck.cards.length})</h2>
                        <button onclick="state.activeDeckId=null;state.cardIndex=0;render()" class="px-3 py-1 bg-stone-900 border rounded-xl text-amber-200">Quitter</button>
                    </div>
                    <div class="p-8 bg-stone-900 border rounded-2xl min-h-[160px] flex flex-col items-center justify-center space-y-4">
                        <div class="text-sm font-bold text-amber-300">QUESTION :</div>
                        <div class="text-base text-white font-medium">${card.q}</div>
                        ${state.showAnswerCard ? `<div class="pt-4 border-t border-amber-900/40 w-full"><div class="text-sm font-bold text-green-400">RÉPONSE :</div><div class="text-base text-white font-medium mt-1">${card.a}</div></div>` : ''}
                    </div>
                    <div class="flex justify-between items-center">
                        <button onclick="prevCard()" class="px-4 py-2 bg-stone-900 border rounded-xl text-amber-200"><i class="fa-solid fa-arrow-left mr-1"></i> Précédent</button>
                        <button onclick="state.showAnswerCard=!state.showAnswerCard;render()" class="px-5 py-2 dyn-btn text-white font-bold rounded-xl">Voir la réponse</button>
                        <button onclick="nextCard(${deck.cards.length})" class="px-4 py-2 bg-stone-900 border rounded-xl text-amber-200">Suivant <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>`;
            }

            let visibleDecks = decks.filter(d => d.isPublic || d.creator === user.username);
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl space-y-3">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-clone mr-2"></i>Jeux de Flashcards</h2>
                    <button onclick="state.creatingDeck=true;render()" class="px-4 py-2.5 dyn-btn text-white font-bold rounded-xl">+ Créer un nouveau jeu de flashcard</button>
                </div>
                <div class="space-y-3">
                    ${visibleDecks.length === 0 ? '<div class="dyn-card border p-6 text-center text-amber-200/50 rounded-2xl">Aucun jeu de flashcards disponible.</div>' : ''}
                    ${visibleDecks.map(d => `
                        <div class="dyn-card border p-4 rounded-2xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-amber-300 text-sm cursor-pointer" onclick="state.activeDeckId=${d.id};state.cardIndex=0;state.showAnswerCard=false;render()">${d.title}</h4>
                                <p class="text-[10px] text-amber-200/60">Créé par ${d.creator} • ${d.cards.length} cartes • ${d.isPublic ? 'Public' : 'Privé'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="state.activeDeckId=${d.id};state.cardIndex=0;state.showAnswerCard=false;render()" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Jouer</button>
                                ${d.creator === user.username ? `<button onclick="deleteFlashcardDeck(${d.id})" class="px-2.5 py-1.5 bg-red-600/30 text-red-300 rounded-xl"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        function addFlashcardRow() {
            let container = document.getElementById('fc-cards-container');
            if (container.children.length >= 100) { alert("Maximum 100 cartes par jeu."); return; }
            let div = document.createElement('div');
            div.className = 'p-3 bg-stone-950 rounded-xl border space-y-2';
            div.innerHTML = `<input type="text" placeholder="Question ${container.children.length + 1}" class="fc-q w-full p-2 bg-stone-900 border rounded-xl text-white" required><input type="text" placeholder="Réponse ${container.children.length + 1}" class="fc-a w-full p-2 bg-stone-900 border rounded-xl text-white" required>`;
            container.appendChild(div);
        }

        async function saveNewFlashcardDeck(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let title = document.getElementById('fc-title').value;
            let isPublic = document.getElementById('fc-public').checked;
            let qFields = document.querySelectorAll('.fc-q');
            let aFields = document.querySelectorAll('.fc-a');
            let cards = [];
            for (let i = 0; i < qFields.length; i++) {
                if (qFields[i].value && aFields[i].value) cards.push({ q: qFields[i].value, a: aFields[i].value });
            }
            if (cards.length === 0) { alert("Ajoutez au moins une carte."); return; }
            let decks = DB.get('flashcard_decks') || [];
            decks.unshift({ id: Date.now(), title, creator: user.username, isPublic, cards });
            await DB.set('flashcard_decks', decks);
            showToast("Jeu enregistré !", "");
            state.creatingDeck = false;
            render();
        }

        async function deleteFlashcardDeck(id) {
            if (!confirm("Supprimer ce jeu de flashcards ?")) return;
            let decks = DB.get('flashcard_decks') || [];
            decks = decks.filter(d => d.id !== id);
            await DB.set('flashcard_decks', decks);
            render();
        }

        function nextCard(total) {
            if (state.cardIndex < total - 1) { state.cardIndex++; state.showAnswerCard = false; render(); }
        }

        function prevCard() {
            if (state.cardIndex > 0) { state.cardIndex--; state.showAnswerCard = false; render(); }
        }

        // --- 4. SIMULATEUR DE MOYENNE À L'EXAMEN ---
        function renderSimulatorTab(user) {
            return `<div class="max-w-3xl mx-auto space-y-6 text-xs">
                <div class="dyn-card border p-6 rounded-3xl space-y-4">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-calculator mr-2"></i>Simulateur de Moyenne au Bac</h2>
                    
                    <div class="space-y-3 border-b pb-6">
                        <h3 class="font-bold text-amber-300 text-sm">1. Simulation par Trimestres Généraux</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div><label class="block font-bold">Trimestre 1 :</label><input type="number" step="0.1" id="sim-t1" placeholder="Ex: 14" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>
                            <div><label class="block font-bold">Trimestre 2 :</label><input type="number" step="0.1" id="sim-t2" placeholder="Ex: 15" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>
                            <div><label class="block font-bold">Trimestre 3 :</label><input type="number" step="0.1" id="sim-t3" placeholder="Ex: 14.5" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>
                        </div>
                        <button onclick="calculateGeneralBac()" class="px-4 py-2 dyn-btn text-white font-bold rounded-xl">Calculer la moyenne générale visée</button>
                        <div id="sim-general-result" class="text-sm font-bold text-amber-300 pt-1"></div>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-bold text-amber-300 text-sm">2. Simulation Matière par Matière</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div><label class="block font-bold">Moyenne actuelle dans la matière :</label><input type="number" step="0.1" id="sim-mat-cur" placeholder="Ex: 12" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>
                            <div><label class="block font-bold">Coefficient de l'épreuve :</label><input type="number" id="sim-mat-coeff" placeholder="Ex: 4" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1"></div>
                        </div>
                        <button onclick="calculateSubjectBac()" class="px-4 py-2 dyn-btn text-white font-bold rounded-xl">Calculer l'objectif matière</button>
                        <div id="sim-subject-result" class="text-sm font-bold text-amber-300 pt-1"></div>
                    </div>
                </div>
            </div>`;
        }

        function calculateGeneralBac() {
            let t1 = parseFloat(document.getElementById('sim-t1').value) || 0;
            let t2 = parseFloat(document.getElementById('sim-t2').value) || 0;
            let t3 = parseFloat(document.getElementById('sim-t3').value) || 0;
            let avg = ((t1 + t2 + t3) / 3).toFixed(2);
            let mention = avg >= 16 ? 'Très Bien 🏆' : avg >= 14 ? 'Bien 🌟' : avg >= 12 ? 'Assez Bien 👍' : avg >= 10 ? 'Admis' : 'Non Admis';
            document.getElementById('sim-general-result').innerHTML = `Moyenne estimée : <span class="text-white text-base">${avg} / 20</span> (Mention visée : ${mention})`;
        }

        function calculateSubjectBac() {
            let cur = parseFloat(document.getElementById('sim-mat-cur').value) || 0;
            let coeff = parseFloat(document.getElementById('sim-mat-coeff').value) || 1;
            let target = (cur * 1.05).toFixed(2); // Objectif +5% d'amélioration estimée
            document.getElementById('sim-subject-result').innerHTML = `Pour viser l'excellence avec un coeff ${coeff}, visez une note d'environ <span class="text-white text-base">${target > 20 ? 20 : target} / 20</span> à l'examen.`;
        }

        function renderDocPage(title, items) {
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400">${title}</h2></div><div class="space-y-2">${items.length === 0 ? '<p class="text-amber-200/50">Aucun document.</p>' : ''}${items.map(d=>`<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center text-white"><div><span class="font-bold">${d.title}</span> ${d.category ? `<span class="ml-2 px-2 py-0.5 bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded-lg">${d.category}</span>` : ''}</div><div class="flex gap-2">${d.fileType === 'url' ? `<a href="${d.fileData}" target="_blank" class="px-3 py-1.5 bg-stone-900 border text-amber-200 rounded-xl font-bold">Ouvrir</a>` : `<button onclick="openFileViewer('${d.title}', '${d.fileData}', '${d.fileType}')" class="px-3 py-1.5 bg-sky-600 text-white rounded-xl font-bold">Aperçu</button><a href="${d.fileData}" download class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Télécharger</a>`}</div></div>`).join('')}</div></div>`;
        }

        function renderExamsTab() {
            let exams = DB.get('revision_sheets') || [];
            return renderDocPage('Sujets & Corrigés Types Bac', exams.filter(e => e.category && e.category.includes('Bac')));
        }

        function renderDocumentsTab(user) {
            let docs = JSON.parse(localStorage.getItem('leqg_txt_docs_' + user.username) || '[]');
            if (state.editingDocIndex !== null) {
                let doc = docs[state.editingDocIndex] || { title: '', content: '' };
                return `<div class="max-w-3xl mx-auto dyn-card border p-6 rounded-3xl space-y-4 text-xs"><div class="flex justify-between items-center border-b pb-2"><h2 class="text-lg font-black text-amber-400">Édition</h2><button onclick="state.editingDocIndex=null;render()" class="px-3 py-1 bg-stone-900 border rounded-xl text-amber-200 font-bold">Retour</button></div><form onsubmit="saveDocContent(event, '${user.username}', ${state.editingDocIndex})" class="space-y-4"><input type="text" id="doc-title-inp" value="${doc.title}" required class="w-full p-3 bg-stone-900 border rounded-xl text-white font-bold"><textarea id="doc-content-inp" required class="w-full p-4 bg-stone-900 border rounded-xl h-64 text-white">${doc.content}</textarea><button type="submit" class="px-5 py-2.5 dyn-btn text-white font-bold rounded-xl">Enregistrer</button></form></div>`;
            }
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl space-y-3"><h2 class="text-xl font-black text-amber-400">Traitement de Texte</h2><button onclick="openNewDocModal('${user.username}')" class="px-4 py-2.5 dyn-btn text-white font-bold rounded-xl">+ Nouveau Document</button></div><div class="space-y-2">${docs.map((d, idx) => `<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center text-white"><span class="cursor-pointer font-bold" onclick="state.editingDocIndex=${idx};render()">${d.title}</span><button onclick="deleteTextDoc('${user.username}', ${idx})" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div></div>`;
        }

        function openNewDocModal(username) {
            let docs = JSON.parse(localStorage.getItem('leqg_txt_docs_' + username) || '[]');
            docs.push({ title: 'Nouveau Document', content: '' });
            localStorage.setItem('leqg_txt_docs_' + username, JSON.stringify(docs));
            state.editingDocIndex = docs.length - 1;
            render();
        }

        function saveDocContent(e, username, idx) {
            e.preventDefault();
            let docs = JSON.parse(localStorage.getItem('leqg_txt_docs_' + username) || '[]');
            if (docs[idx]) {
                docs[idx].title = document.getElementById('doc-title-inp').value;
                docs[idx].content = document.getElementById('doc-content-inp').value;
                localStorage.setItem('leqg_txt_docs_' + username, JSON.stringify(docs));
                showToast("Enregistré !", "");
                state.editingDocIndex = null;
                render();
            }
        }

        function deleteTextDoc(username, idx) {
            if (!confirm("Supprimer ?")) return;
            let docs = JSON.parse(localStorage.getItem('leqg_txt_docs_' + username) || '[]');
            docs.splice(idx, 1);
            localStorage.setItem('leqg_txt_docs_' + username, JSON.stringify(docs));
            render();
        }

        function renderChat(user) {
            let users = DB.get('users') || [], msgs = DB.get('messages') || [];
            let active = state.chatMode === 'general' ? msgs.filter(m => m.type === 'general') : msgs.filter(m => m.type === 'private' && ((m.sender === user.username && m.recipient === state.targetUser) || (m.sender === state.targetUser && m.recipient === user.username)));
            return `<div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 h-[500px] text-xs"><div class="dyn-card border p-3 flex flex-col space-y-2 rounded-3xl"><button onclick="state.chatMode='general';render()" class="p-2.5 rounded-xl ${state.chatMode==='general'?'dyn-btn text-white font-bold':'bg-stone-900 text-amber-200'}">📢 Général</button><div class="text-[10px] text-amber-400 font-bold pt-2">Privés :</div><div class="flex-1 overflow-y-auto space-y-1">${users.filter(u => u.username !== user.username).map(u => `<button onclick="state.chatMode='private';state.targetUser='${u.username}';render()" class="w-full text-left p-2 rounded-xl flex items-center gap-2 ${state.chatMode==='private' && state.targetUser===u.username?'dyn-btn text-white font-bold':'bg-stone-900 text-amber-200'}">${renderAvatarBadge(u)}<div class="font-bold">${u.pseudo || u.username}</div></button>`).join('')}</div></div><div class="md:col-span-3 dyn-card border p-4 flex flex-col justify-between rounded-3xl"><div class="border-b pb-2 font-bold text-amber-400">${state.chatMode === 'general' ? 'Canal Général' : 'Discussion privée'}</div><div class="flex-1 overflow-y-auto space-y-2 bg-stone-900/40 p-3 rounded-2xl my-2">${active.map(m => `<div class="p-2.5 bg-stone-950 rounded-xl space-y-1 border border-amber-900/20"><div class="flex justify-between text-[10px] text-amber-400 font-bold"><span>${m.sender}</span><span>${m.time}</span></div><p class="text-amber-100">${m.text}</p></div>`).join('')}</div><form onsubmit="sendChat(event)" class="flex gap-2"><input type="text" id="c-inp" required placeholder="Message..." class="flex-1 p-2.5 bg-stone-900 border rounded-xl text-white"><button type="submit" class="dyn-btn px-4 text-white rounded-xl font-bold">Envoyer</button></form></div></div>`;
        }

        async function sendChat(e) {
            e.preventDefault();
            let user = getCurrentUser(), text = document.getElementById('c-inp').value, msgs = DB.get('messages') || [];
            msgs.push({ type: state.chatMode, sender: `${user.pseudo || user.username}`, recipient: state.chatMode === 'private' ? state.targetUser : null, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            await DB.set('messages', msgs);
            document.getElementById('c-inp').value = '';
            render();
        }

        // --- ESPACE ADMIN COMPLET (AVEC UPLOAD APP & PROCÉDURE) ---
        function renderAdmin() {
            return `<div class="max-w-4xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-4 rounded-3xl flex gap-2 flex-wrap"><button onclick="state.adminSub='users';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='users'?'dyn-btn text-white':'bg-stone-900'}">Comptes & Exports</button><button onclick="state.adminSub='quizzes';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='quizzes'?'dyn-btn text-white':'bg-stone-900'}">Quiz</button><button onclick="state.adminSub='docs';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='docs'?'dyn-btn text-white':'bg-stone-900'}">Fiches & Corrigés</button><button onclick="state.adminSub='polls';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='polls'?'dyn-btn text-white':'bg-stone-900'}">Sondages</button><button onclick="state.adminSub='formations';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='formations'?'dyn-btn text-white':'bg-stone-900'}">Formations</button><button onclick="state.adminSub='appreciations';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='appreciations'?'dyn-btn text-white':'bg-stone-900'}">Appréciations</button><button onclick="state.adminSub='theme';render()" class="px-3 py-1.5 rounded-xl font-bold ${state.adminSub==='theme'?'dyn-btn text-white':'bg-stone-900'}">Thèmes & App Mobile</button></div>${state.adminSub==='users'?renderAdminUsersWithExport():''}${state.adminSub==='quizzes'?renderAdminQuizzes():''}${state.adminSub==='docs'?renderAdminDocsCategorized():''}${state.adminSub==='polls'?renderAdminPolls():''}${state.adminSub==='formations'?renderAdminFormations():''}${state.adminSub==='appreciations'?renderAdminAppreciations():''}${state.adminSub==='theme'?renderAdminThemeFull():''}</div>`;
