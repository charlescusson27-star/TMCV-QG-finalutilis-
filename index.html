<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.6; }
        }
        .deco-item {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 5;
            animation: fall linear infinite;
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden">

    <div id="custom-bg-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>
    <div id="theme-decorations" class="fixed inset-0 z-5 pointer-events-none overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal Procédure Installation Application -->
    <div id="app-install-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-xl dyn-card border rounded-3xl p-6 shadow-2xl space-y-4 relative">
            <button onclick="toggleModal('app-install-modal', false)" class="absolute top-4 right-4 text-amber-400 hover:text-white text-2xl font-bold">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
            <div class="flex items-center gap-3 border-b border-amber-900/40 pb-3">
                <div class="p-2.5 bg-amber-500/20 text-amber-400 rounded-xl text-xl"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <h3 class="font-black text-lg text-amber-400">Procédure d'installation de l'App & Notifications</h3>
            </div>
            <div id="app-install-instructions" class="text-xs text-amber-100 leading-relaxed space-y-2 max-h-[60vh] overflow-y-auto p-3 bg-stone-900/60 rounded-2xl border border-amber-900/20">
                <!-- Chargé dynamiquement -->
            </div>
            <button onclick="requestNotificationPermission()" class="w-full py-2.5 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl text-xs shadow">Activer les Notifications Push</button>
            <button onclick="toggleModal('app-install-modal', false)" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">J'ai compris (Fermer)</button>
        </div>
    </div>

    <!-- Modal Créateur de Flashcards -->
    <div id="flashcard-creator-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-2xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-2">
                <h3 class="font-black text-lg text-amber-400"><i class="fa-solid fa-layer-group mr-2"></i>Nouveau Jeu de Flashcards</h3>
                <button onclick="toggleModal('flashcard-creator-modal', false)" class="text-amber-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveNewFlashcardDeck(event)" class="flex-1 flex flex-col space-y-4 overflow-hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="block font-bold text-amber-300 mb-1">Nom du jeu :</label>
                        <input type="text" id="fc-deck-title" required placeholder="Ex: Vocabulaire Anglais Bac" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                    </div>
                    <div class="flex items-center gap-2 pt-5">
                        <input type="checkbox" id="fc-deck-public" class="w-4 h-4 accent-amber-500">
                        <label for="fc-deck-public" class="font-bold text-amber-200">Rendre ce jeu public pour toute la classe</label>
                    </div>
                </div>

                <div id="fc-cards-container" class="flex-1 overflow-y-auto space-y-3 p-2 bg-stone-900/50 rounded-2xl border border-amber-900/20">
                    <!-- Cartes ajoutées dynamiquement -->
                </div>

                <div class="flex justify-between items-center pt-2 border-t border-amber-900/40 text-xs">
                    <button type="button" onclick="addCardInputRow()" class="px-3 py-2 bg-stone-900 border text-amber-300 font-bold rounded-xl flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Ajouter une carte (<span id="fc-card-count">1</span>/100)</button>
                    <div class="flex gap-2">
                        <button type="button" onclick="toggleModal('flashcard-creator-modal', false)" class="px-4 py-2 bg-stone-900 text-amber-200 rounded-xl border">Annuler</button>
                        <button type="submit" class="px-5 py-2 dyn-btn text-white font-bold rounded-xl shadow-lg">Enregistrer le Jeu</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26' }
            ],
            messages: [],
            ideas_board: [],
            quizzes: [],
            quiz_submissions: {},
            appreciations: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            tickets: [],
            polls: [],
            calendar_events: [],
            custom_pages: [],
            hidden_tabs: [],
            orientation_models: [],
            flashcards_decks: [],
            app_file_data: '',
            app_file_name: 'LE_QG_App.apk',
            app_install_guide: "1. Téléchargez le fichier d'installation en cliquant sur le bouton d'action.\n2. Ouvrez le fichier téléchargé sur votre appareil mobile.\n3. Autorisez les 'Sources inconnues' si demandé par votre système.\n4. Activez les notifications push pour recevoir les alertes de cours et la cantine !",
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' },
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)', bgMedia: '', mode: 'dark' },
            home_qr_image: ''
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                await db.collection("leqg_data").doc(k).set({ value: val });
                applyTheme();
                render();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeQuizId: null,
            activeFcDeckId: null,
            fcCardIndex: 0,
            fcShowAnswer: false,
            simMode: 'trimestres',
            formationSearch: '',
            formationTypeFilter: 'all',
            formationCityFilter: 'all',
            editingDocIndex: null
        };

        let pomodoroTimer = null;
        let pomodoroTimeLeft = 25 * 60;
        let pomodoroIsRunning = false;

        async function init() {
            try {
                let userDoc = await db.collection("leqg_data").doc("users").get();
                if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                    const keys = Object.keys(cloudData);
                    for (let k of keys) {
                        await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                    }
                } else {
                    const keys = Object.keys(cloudData);
                    for (let k of keys) {
                        let doc = await db.collection("leqg_data").doc(k).get();
                        if (doc.exists) cloudData[k] = doc.data().value;
                    }
                }
            } catch(e) {
                console.error("Erreur de synchronisation Firebase :", e);
            }

            applyTheme();
            render();
            setupDailyCantineNotification();
        }

        // --- GESTION DES NOTIFICATIONS PUSH & CANTINE ---
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Ce navigateur ne supporte pas les notifications desktop/mobile.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    showToast("Notifications Activées", "Vous recevrez désormais les alertes de l'application !");
                    new Notification("LE QG", { body: "Notifications activées avec succès !" });
                } else {
                    alert("Permissions de notification refusées.");
                }
            });
        }

        function sendPushNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png' });
                    }).catch(() => {
                        new Notification(title, { body });
                    });
                } catch(e) {
                    new Notification(title, { body });
                }
            }
        }

        function setupDailyCantineNotification() {
            // Vérification toutes les minutes pour déclencher à 9h00 du lundi au vendredi
            setInterval(() => {
                let now = new Date();
                let day = now.getDay(); // 1 = Lundi, ..., 5 = Vendredi
                let hours = now.getHours();
                let minutes = now.getMinutes();

                if (day >= 1 && day <= 5 && hours === 9 && minutes === 0) {
                    let lastSentKey = 'cantine_notif_' + now.toDateString();
                    if (!localStorage.getItem(lastSentKey)) {
                        sendPushNotification("LE QG - Rappel Cantine", "Réserve la cantine !");
                        localStorage.setItem(lastSentKey, 'true');
                    }
                }
            }, 60000);
        }

        function triggerAppDownload() {
            let fileData = DB.get('app_file_data');
            let fileName = DB.get('app_file_name') || 'LE_QG_App.apk';
            let guide = DB.get('app_install_guide') || 'Aucune instruction renseignée.';

            document.getElementById('app-install-instructions').innerHTML = guide.replace(/\n/g, '<br>');
            toggleModal('app-install-modal', true);

            if (fileData) {
                let a = document.createElement('a');
                a.href = fileData;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("Téléchargement", "Le fichier d'installation est en cours de téléchargement...");
            } else {
                showToast("Note", "Aucun fichier d'application n'est configuré par l'administrateur.");
            }
        }

        function applyTheme() {
            let t = DB.get('site_theme') || {};
            if (t.btnColor) document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            if (t.cardBg) document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            if (t.borderColor) document.documentElement.style.setProperty('--custom-border-color', t.borderColor);
            
            let body = document.getElementById('body-theme');
            if (t.mode === 'light') {
                body.className = "bg-stone-100 text-stone-900 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden";
            } else {
                body.className = "bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden";
            }

            let bgC = document.getElementById('custom-bg-container');
            if (bgC) {
                if (t.preset === 'noel') {
                    bgC.innerHTML = `<div class="w-full h-full bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&q=80&w=1200')"></div>`;
                } else if (t.bgMedia) {
                    if (t.bgMedia.match(/\.(mp4|webm|ogg)$/i) || t.bgMedia.startsWith('data:video')) {
                        bgC.innerHTML = `<video autoplay muted loop class="w-full h-full object-cover opacity-40"><source src="${t.bgMedia}"></video>`;
                    } else {
                        bgC.innerHTML = `<div class="w-full h-full bg-cover bg-center opacity-40" style="background-image: url('${t.bgMedia}')"></div>`;
                    }
                } else {
                    bgC.innerHTML = '';
                }
            }

            let decoContainer = document.getElementById('theme-decorations');
            if (!decoContainer) return;
            decoContainer.innerHTML = '';
            
            let symbol = '';
            if (t.preset === 'noel') symbol = '🎄';
            else if (t.preset === 'halloween') symbol = '🎃';
            else if (t.preset === 'paques') symbol = '🥚';
            else if (t.preset === 'automne') symbol = '🍂';
            else if (t.preset === 'hiver') symbol = '❄️';
            else if (t.preset === 'printemps') symbol = '🌸';
            else if (t.preset === 'ete') symbol = '🟡';

            if (symbol) {
                let count = t.preset === 'ete' ? 30 : 15;
                for (let i = 0; i < count; i++) {
                    let item = document.createElement('div');
                    item.className = 'deco-item ' + (t.preset === 'ete' ? 'text-xs text-amber-400/40' : 'text-xl');
                    item.textContent = t.preset === 'noel' ? (Math.random() > 0.5 ? '🎄' : '🔴') : symbol;
                    item.style.left = Math.random() * 100 + 'vw';
                    item.style.animationDuration = (Math.random() * 4 + 4) + 's';
                    item.style.animationDelay = (Math.random() * 5) + 's';
                    decoContainer.appendChild(item);
                }
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 5000);
        }
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>
                    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                        <input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button>
                    </form>
                </div>
            </div>`;
        }

        function renderSetup(user) {
            let isAdmin = user.role === 'admin';
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs">
                    <h1 class="text-base font-bold text-amber-400">Première connexion - Configuration obligatoire</h1>
                    <p class="text-amber-200/70 text-[11px]">Veuillez compléter les informations obligatoires ci-dessous pour accéder à votre espace.</p>
                    <form onsubmit="saveSetup(event)" class="space-y-3">
                        ${isAdmin ? `
                            <div>
                                <label class="block font-bold text-amber-300">Nouvel Identifiant Administrateur *</label>
                                <input type="text" id="s-username" value="${user.username}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block font-bold text-amber-300">Nom & Prénom réels *</label>
                            <input type="text" id="s-lastname" value="${user.realName || ''}" required placeholder="Ex: Jean Dupont" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Date de naissance *</label>
                            <input type="date" id="s-birth" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Nouveau Mot de passe *</label>
                            <input type="password" id="s-pass" required placeholder="Nouveau mot de passe" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Pseudo de messagerie (Facultatif)</label>
                            <input type="text" id="s-pseudo" value="${user.pseudo || ''}" placeholder="Ex: 🚀 SuperÉlève" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Adresse E-mail (Facultatif)</label>
                            <input type="email" id="s-email" value="${user.email || ''}" placeholder="nom@exemple.com" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Valider et Entrer sur LE QG</button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboard(user) {
            let canAccessAdmin = user.role === 'admin' || user.role === 'delegate';
            let hidden = DB.get('hidden_tabs') || [];
            let customPages = DB.get('custom_pages') || [];

            function isVisible(tabId) { return !hidden.includes(tabId); }

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2">
                            ${renderAvatarBadge(user)}
                            <div>
                                <div class="font-black text-amber-400 text-xs">${user.pseudo || user.username}</div>
                                <div class="text-[9px] text-amber-200/60">${user.realName || user.username}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="triggerAppDownload()" class="px-3 py-1.5 dyn-btn text-white text-xs rounded-xl font-bold flex items-center gap-1.5 shadow-lg"><i class="fa-solid fa-mobile-screen-button"></i> App Mobile</button>

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon} w-4"></i> ${label}</button>`;
        }

        function renderContent(user) {
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'profile') return renderProfileTab(user);
            if (state.tab === 'formations') return renderFormationsTab();
            if (state.tab === 'calendar') return renderCalendarTab();
            if (state.tab === 'tickets') return renderTicketsTab(user);
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'quizzes') return renderQuizzesTab(user);
            if (state.tab === 'polls') return renderPollsTab(user);
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', DB.get('revision_sheets') || []);
            if (state.tab === 'exams') return renderExamsTab();
            if (state.tab === 'documents') return renderDocumentsTab(user);
            if (state.tab === 'flashcards') return renderFlashcardsTab(user);
            if (state.tab === 'orientation') return renderOrientationTab();
            if (state.tab === 'simulator') return renderSimulatorTab(user);
            if (state.tab === 'mood') return renderMoodTab(user);
            if (state.tab === 'pomodoro') return renderPomodoroTab();
            if (state.tab === 'goldbook') return renderGoldBookTab(user);
            if (state.tab === 'ideas') return renderIdeasPage(user);
            if (state.tab.startsWith('cp_')) return renderCustomPage(state.tab.replace('cp_', ''));
            if (state.tab === 'admin' && (user.role === 'admin' || user.role === 'delegate')) return renderAdmin();
            return '';
        }

        function renderHome() {

                <div class="dyn-card border p-8 space-y-3 rounded-3xl">
                    <h2 class="text-2xl font-black text-white">Bienvenue sur LE QG</h2>

                    <div class="relative w-20 h-20 rounded-full border-2 border-amber-400 flex items-center justify-center text-3xl overflow-hidden" style="background-color: ${user.avatarSkin || '#fca5a5'}">
                        <span>${user.avatarAccessory || '👤'}</span>
                        <span class="absolute top-1 right-2 text-xl">${user.avatarHair || '🧢'}</span>
                    </div>
                    <div class="space-y-1">
                        <div class="font-bold text-lg text-amber-300">${user.pseudo || user.username}</div>

                <form onsubmit="saveProfileAvatar(event, '${user.username}')" class="space-y-4">

                    <div class="space-y-2">
                        <label class="block font-bold">Nom et Prénom réels :</label>
                        <input type="text" id="av-realname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block font-bold mb-1">Teint de peau :</label>
                            <input type="color" id="av-skin" value="${user.avatarSkin || '#fca5a5'}" class="w-full h-10 p-1 bg-stone-900 border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Accessoire :</label>
                            <select id="av-acc" class="w-full p-2.5 bg-stone-900 border rounded-xl">
                                <option value="👑" ${user.avatarAccessory==='👑'?'selected':''}>👑 Couronne</option>
                                <option value="🕶️" ${user.avatarAccessory==='🕶️'?'selected':''}>🕶️ Lunettes</option>
                                <option value="🎧" ${user.avatarAccessory==='🎧'?'selected':''}>🎧 Casque</option>
                                <option value="🥸" ${user.avatarAccessory==='🥸'?'selected':''}>🥸 Moustache</option>

                                <option value="🎩" ${user.avatarHair==='🎩'?'selected':''}>🎩 Chapeau</option>
                                <option value="🎓" ${user.avatarHair==='🎓'?'selected':''}>🎓 Diplôme</option>
                                <option value="🔥" ${user.avatarHair==='🔥'?'selected':''}>🔥 Feu</option>

            </div>`;
        }

        async function saveProfileAvatar(event, username) {
            event.preventDefault();
            let users = DB.get('users') || [];
            let idx = users.findIndex(u => u.username === username);
            if (idx !== -1) {
                users[idx].pseudo = document.getElementById('av-pseudo').value;
                users[idx].realName = document.getElementById('av-realname').value;
                users[idx].avatarSkin = document.getElementById('av-skin').value;
                users[idx].avatarAccessory = document.getElementById('av-acc').value;
                users[idx].avatarHair = document.getElementById('av-hair').value;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                showToast("Profil mis à jour !", "Vos modifications ont été enregistrées sur Firebase.");
            }
        }

        // --- FLASHCARDS (JEUX DE CARTES) ---
        function renderFlashcardsTab(user) {
            let decks = DB.get('flashcards_decks') || [];
            let visibleDecks = decks.filter(d => d.author === user.username || d.isPublic);

            if (state.activeFcDeckId) {
                let deck = decks.find(d => d.id === state.activeFcDeckId);
                if (!deck || !deck.cards || deck.cards.length === 0) return `<div class="p-6 text-center text-amber-200">Ce jeu est vide. <button onclick="state.activeFcDeckId=null;render()" class="underline">Retour</button></div>`;
                
                let currentCard = deck.cards[state.fcCardIndex];
                
                return `<div class="max-w-2xl mx-auto dyn-card border p-6 rounded-3xl space-y-6 text-xs shadow-2xl">
                    <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                        <h2 class="text-base font-black text-amber-400"><i class="fa-solid fa-gamepad mr-2"></i>${deck.title}</h2>
                        <span class="px-3 py-1 bg-stone-900 border rounded-xl text-amber-200 font-bold">Carte ${state.fcCardIndex + 1} / ${deck.cards.length}</span>
                    </div>

                    <div class="min-h-[220px] p-8 bg-stone-900 rounded-3xl border border-amber-500/30 flex flex-col justify-center items-center text-center space-y-4 shadow-inner relative">
                        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">${state.fcShowAnswer ? 'Réponse' : 'Question / Notion'}</span>
                        <p class="text-base font-extrabold text-white leading-relaxed">${state.fcShowAnswer ? currentCard.a : currentCard.q}</p>
                    </div>

                    <div class="flex justify-between items-center gap-3">
                        <button onclick="navFcCard(-1)" ${state.fcCardIndex === 0 ? 'disabled class="opacity-40 px-4 py-2 bg-stone-900 rounded-xl cursor-not-allowed"' : 'class="px-4 py-2 bg-stone-900 hover:bg-stone-800 border text-amber-200 font-bold rounded-xl flex items-center gap-2"'}>
                            <i class="fa-solid fa-arrow-left"></i> Précédent
                        </button>

                        <button onclick="state.fcShowAnswer=!state.fcShowAnswer;render()" class="px-5 py-2.5 dyn-btn text-white font-bold rounded-xl shadow-lg flex items-center gap-2">
                            <i class="fa-solid fa-rotate"></i> ${state.fcShowAnswer ? 'Masquer la Réponse' : 'Voir la Réponse'}
                        </button>

                        <button onclick="navFcCard(1)" ${state.fcCardIndex === deck.cards.length - 1 ? 'disabled class="opacity-40 px-4 py-2 bg-stone-900 rounded-xl cursor-not-allowed"' : 'class="px-4 py-2 bg-stone-900 hover:bg-stone-800 border text-amber-200 font-bold rounded-xl flex items-center gap-2"'}>
                            Suivant <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <button onclick="state.activeFcDeckId=null;state.fcCardIndex=0;state.fcShowAnswer=false;render()" class="px-4 py-1.5 bg-stone-900 border rounded-xl text-amber-200 text-[11px]">Quitter la partie</button>
                    </div>
                </div>`;
            }

            return `<div class="max-w-3xl mx-auto space-y-6 text-xs">
                <div class="dyn-card border p-6 rounded-3xl flex justify-between items-center flex-wrap gap-3">
                    <div>
                        <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-layer-group mr-2"></i>Jeux de Flashcards</h2>
                        <p class="text-amber-200/70 text-[11px] mt-1">Réviser facilement vos cours à l'aide de jeux de cartes révisables.</p>
                    </div>
                    <button onclick="openFlashcardCreator()" class="px-4 py-2.5 dyn-btn text-white font-bold rounded-xl shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Créer un nouveau jeu de flashcards
                    </button>
                </div>

                <div class="space-y-3">
                    <h3 class="font-bold text-amber-300 text-sm">Jeux disponibles (${visibleDecks.length})</h3>
                    ${visibleDecks.length === 0 ? '<div class="dyn-card border p-8 text-center text-amber-200/50 rounded-2xl">Aucun jeu de flashcards disponible. Cliquez sur le bouton ci-dessus pour en créer un !</div>' : ''}
                    ${visibleDecks.map(d => {
                        let isOwner = d.author === user.username;
                        return `
                            <div class="dyn-card border p-5 rounded-2xl flex justify-between items-center flex-wrap gap-3">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-black text-amber-300 text-sm">${d.title}</h4>
                                        ${d.isPublic ? '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded text-[9px] font-bold">Public</span>' : '<span class="px-2 py-0.5 bg-stone-800 text-stone-400 rounded text-[9px]">Privé</span>'}
                                    </div>
                                    <p class="text-[10px] text-amber-200/60">${d.cards ? d.cards.length : 0} carte(s) • Créé par ${d.authorName || d.author}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="state.activeFcDeckId='${d.id}';state.fcCardIndex=0;state.fcShowAnswer=false;render()" class="px-4 py-2 dyn-btn text-white font-bold rounded-xl shadow flex items-center gap-1.5"><i class="fa-solid fa-play"></i> Lancer le jeu</button>
                                    ${isOwner ? `<button onclick="deleteFlashcardDeck('${d.id}')" class="px-2.5 py-2 bg-red-600/20 text-red-300 border border-red-500/30 rounded-xl hover:bg-red-600/40"><i class="fa-solid fa-trash"></i></button>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>`;
        }

        function navFcCard(dir) {
            let decks = DB.get('flashcards_decks') || [];
            let deck = decks.find(d => d.id === state.activeFcDeckId);
            if (!deck) return;
            let newIndex = state.fcCardIndex + dir;
            if (newIndex >= 0 && newIndex < deck.cards.length) {
                state.fcCardIndex = newIndex;
                state.fcShowAnswer = false;
                render();
            }
        }

        function openFlashcardCreator() {
            let container = document.getElementById('fc-cards-container');
            container.innerHTML = '';
            document.getElementById('fc-deck-title').value = '';
            document.getElementById('fc-deck-public').checked = false;
            addCardInputRow();
            toggleModal('flashcard-creator-modal', true);
        }

        function addCardInputRow() {
            let container = document.getElementById('fc-cards-container');
            let count = container.querySelectorAll('.fc-card-row').length;
            if (count >= 100) { alert("Limite atteinte : 100 cartes maximum par jeu."); return; }
            
            let row = document.createElement('div');
            row.className = "fc-card-row p-3 bg-stone-950 border border-amber-900/30 rounded-xl space-y-2 relative";
            row.innerHTML = `
                <div class="flex justify-between items-center text-[10px] text-amber-400 font-bold">
                    <span>Carte #${count + 1}</span>
                    ${count > 0 ? `<button type="button" onclick="this.parentElement.parentElement.remove();updateFcCardCount();" class="text-red-400"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
                <input type="text" placeholder="Question / Notion..." required class="fc-q-input w-full p-2 bg-stone-900 border rounded-lg text-xs text-amber-100">
                <input type="text" placeholder="Réponse exacte..." required class="fc-a-input w-full p-2 bg-stone-900 border rounded-lg text-xs text-amber-100">
            `;
            container.appendChild(row);
            updateFcCardCount();
        }

        function updateFcCardCount() {
            let count = document.querySelectorAll('.fc-card-row').length;
            document.getElementById('fc-card-count').textContent = count;
        }

        async function saveNewFlashcardDeck(e) {
            e.preventDefault();
            let title = document.getElementById('fc-deck-title').value.trim();
            let isPublic = document.getElementById('fc-deck-public').checked;
            let rows = document.querySelectorAll('.fc-card-row');
            
            let cards = [];
            rows.forEach(r => {
                let q = r.querySelector('.fc-q-input').value.trim();
                let a = r.querySelector('.fc-a-input').value.trim();
                if (q && a) cards.push({ q, a });
            });

            if (cards.length === 0) { alert("Ajoutez au moins une carte."); return; }

            let user = getCurrentUser();
            let decks = DB.get('flashcards_decks') || [];
            decks.push({
                id: 'fc_' + Date.now(),
                title,
                isPublic,
                author: user.username,
                authorName: user.pseudo || user.username,
                cards
            });

            await DB.set('flashcards_decks', decks);
            toggleModal('flashcard-creator-modal', false);
            showToast("Succès", "Votre jeu de flashcards a été enregistré sur Firebase !");
        }

        async function deleteFlashcardDeck(id) {
            if (!confirm("Voulez-vous vraiment supprimer ce jeu de cartes ?")) return;
            let decks = DB.get('flashcards_decks') || [];
            decks = decks.filter(d => d.id !== id);
            await DB.set('flashcards_decks', decks);
            showToast("Supprimé", "Le jeu a été retiré.");
        }

                                <label class="block font-bold mb-1">Note T2 (/20) :</label>
                                <input type="number" step="0.1" min="0" max="20" id="sim-t2" placeholder="14.5" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">

                                <label class="block font-bold mb-1">Note T3 (/20) :</label>

                    <div class="dyn-card border p-6 rounded-3xl space-y-4">

                        <div class="space-y-3">
                            <div class="grid grid-cols-2 gap-2 items-center p-2 bg-stone-900/60 rounded-xl border">

                                <input type="number" step="0.1" id="sm-pro" placeholder="Note /20" class="p-2 bg-stone-950 border rounded-lg text-amber-100">
                            </div>
                            <div class="grid grid-cols-2 gap-2 items-center p-2 bg-stone-900/60 rounded-xl border">
                                <div><span class="font-bold text-white">Français / Hist-Géo</span> <span class="text-[10px] text-amber-400 font-bold">(Coef 5)</span></div>
                                <input type="number" step="0.1" id="sm-fr" placeholder="Note /20" class="p-2 bg-stone-950 border rounded-lg text-amber-100">
                            </div>
                            <div class="grid grid-cols-2 gap-2 items-center p-2 bg-stone-900/60 rounded-xl border">
                                <div><span class="font-bold text-white">Mathématiques / Sciences</span> <span class="text-[10px] text-amber-400 font-bold">(Coef 2)</span></div>

        function calcSimTrimestres() {
            let t1 = parseFloat(document.getElementById('sim-t1').value) || 0;
            let t2 = parseFloat(document.getElementById('sim-t2').value) || 0;
            let t3 = parseFloat(document.getElementById('sim-t3').value) || 0;
            let avg = ((t1 + t2 + t3) / 3).toFixed(2);
            
            let mention = "Passable";
            if (avg >= 16) mention = "Très Bien 🌟";
            else if (avg >= 14) mention = "Bien 🎉";
            else if (avg >= 12) mention = "Assez Bien 👍";

            let res = document.getElementById('sim-res-trim');
            res.classList.remove('hidden');
            res.innerHTML = `Moyenne prévisionnelle : <span class="text-lg font-black text-amber-400">${avg} / 20</span><br><span class="text-xs text-amber-200">Mention estimée : ${mention}</span>`;
        }

        function calcSimMatieres() {
            let pro = parseFloat(document.getElementById('sm-pro').value) || 0;
            let fr = parseFloat(document.getElementById('sm-fr').value) || 0;
            let math = parseFloat(document.getElementById('sm-math').value) || 0;
            let lv1 = parseFloat(document.getElementById('sm-lv1').value) || 0;
            let art = parseFloat(document.getElementById('sm-art').value) || 0;

            let totalPoints = (pro * 9) + (fr * 5) + (math * 2) + (lv1 * 2) + (art * 2);
            let totalCoef = 9 + 5 + 2 + 2 + 2;
            let avg = (totalPoints / totalCoef).toFixed(2);

            let res = document.getElementById('sim-res-mat');
            res.classList.remove('hidden');
            res.innerHTML = `Moyenne globale visée au Bac : <span class="text-lg font-black text-amber-400">${avg} / 20</span>`;
        }

        function renderPomodoroTab() {
            let minutes = Math.floor(pomodoroTimeLeft / 60);

            return `<div class="max-w-md mx-auto dyn-card border p-8 rounded-3xl space-y-6 text-xs text-center shadow-2xl">

                </div>

                <div class="py-8 bg-stone-900/80 rounded-3xl border border-amber-500/30">
                    <div id="pomodoro-timer" class="text-5xl font-black text-amber-400 tracking-wider">${displayTime}</div>
                </div>

                <div class="flex justify-center gap-3">
                    ${!pomodoroIsRunning ? `
                        <button onclick="startPomodoro()" class="px-6 py-3 dyn-btn text-white rounded-xl font-bold text-xs shadow-lg flex items-center gap-2"><i class="fa-solid fa-play"></i> Démarrer</button>

                    <button onclick="resetPomodoro()" class="px-5 py-3 bg-stone-900 border text-amber-200 rounded-xl font-bold text-xs flex items-center gap-2"><i class="fa-solid fa-rotate-left"></i> Réinitialiser</button>
                </div>
            </div>`;
        }

        function startPomodoro() {
            if (pomodoroIsRunning) return;
            pomodoroIsRunning = true;
            render();
            pomodoroTimer = setInterval(() => {
                if (pomodoroTimeLeft > 0) {
                    pomodoroTimeLeft--;
                    let minutes = Math.floor(pomodoroTimeLeft / 60);
                    let seconds = pomodoroTimeLeft % 60;
                    let displayTime = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    let el = document.getElementById('pomodoro-timer');
                    if (el) el.textContent = displayTime;
                } else {
                    clearInterval(pomodoroTimer);
                    pomodoroIsRunning = false;
                    showToast("Pomodoro Terminé !", "Session de travail achevée ! Prenez 5 minutes de pause.");
                    pomodoroTimeLeft = 25 * 60;
                    render();
                }
            }, 1000);
        }

        function pausePomodoro() {
            clearInterval(pomodoroTimer);
            pomodoroIsRunning = false;
            render();
        }

        function resetPomodoro() {
            clearInterval(pomodoroTimer);
            pomodoroIsRunning = false;
            pomodoroTimeLeft = 25 * 60;
            render();
        }

        async function submitIdea(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let ideas = DB.get('ideas_board') || [];
            let expiresAt = new Date(new Date().getTime() + 48 * 3600 * 1000).toISOString();
            
            ideas.push({
                title: document.getElementById('i-title').value.trim(),
                desc: document.getElementById('i-desc').value.trim(),
                author: user.pseudo || user.username,
                expiresAt,
                forVotes: 0,
                againstVotes: 0,
                voters: []
            });

            await DB.set('ideas_board', ideas);
            sendPushNotification("Nouvelle Idée sur LE QG", "Une nouvelle idée vient d'être publiée. Venez voter !");
            showToast("Idée publiée !", "Le vote de 48h est ouvert pour tous les élèves.");
        }

        async function voteIdea(idx, isFor) {
            let user = getCurrentUser();
            let ideas = DB.get('ideas_board') || [];
            if (!ideas[idx].voters) ideas[idx].voters = [];
            if (ideas[idx].voters.includes(user.username)) return;

            ideas[idx].voters.push(user.username);
            if (isFor) ideas[idx].forVotes = (ideas[idx].forVotes || 0) + 1;
            else ideas[idx].againstVotes = (ideas[idx].againstVotes || 0) + 1;

            await DB.set('ideas_board', ideas);
            showToast("Vote pris en compte", "Votre vote a été enregistré !");
        }

            let bestList = Object.values(bestScores);

        async function submitQuiz(e, quizId) {
            e.preventDefault();
            let quiz = (DB.get('quizzes') || []).find(x => x.id === quizId), score = 0;
            quiz.questions.forEach((q, idx) => {
                let sel = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (sel && parseInt(sel.value) === parseInt(q.correct)) score++;
            });
            let user = getCurrentUser(), subs = DB.get('quiz_submissions') || {};
            if (!subs[user.username]) subs[user.username] = [];
            subs[user.username].push({ quizId, quizTitle: quiz.title, score, total: quiz.questions.length, date: new Date().toLocaleDateString() });
            await DB.set('quiz_submissions', subs);
            showToast("Quiz validé", `Score : ${score}/${quiz.questions.length}`);
            state.activeQuizId = null; render();
        }

        async function votePoll(pIdx, oIdx) {
            let user = getCurrentUser();
            let polls = DB.get('polls') || [];
            if (!polls[pIdx].voters) polls[pIdx].voters = [];
            if (polls[pIdx].voters.includes(user.username)) return;
            polls[pIdx].voters.push(user.username);
            if (!polls[pIdx].results) polls[pIdx].results = {};
            polls[pIdx].results[oIdx] = (polls[pIdx].results[oIdx] || 0) + 1;
            await DB.set('polls', polls);
            showToast("Vote enregistré", "Merci pour votre participation !");

        function exportClassDataCSV() {
            let users = DB.get('users') || [], subs = DB.get('quiz_submissions') || {};
            let csv = "Identifiant,Nom_Reel,Date_Naissance,Pseudo,Role,Moyenne_Quiz_20\n";
            
            users.forEach(u => {
                let mySubs = subs[u.username] || [];
                let bestScores = {};
                mySubs.forEach(s => { if (!bestScores[s.quizId] || s.score > bestScores[s.quizId].score) bestScores[s.quizId] = s; });
                let bestList = Object.values(bestScores);
                let avg = bestList.length > 0 ? (bestList.reduce((acc, curr) => acc + (curr.score / curr.total) * 20, 0) / bestList.length).toFixed(1) : 'N/A';
                
                csv += `"${u.username}","${u.realName || ''}","${u.birthDate || ''}","${u.pseudo || ''}","${u.role}","${avg}"\n`;
            });

            downloadCSV("bilan_classe_leqg.csv", csv);
        }

        function exportUserDataCSV(username) {
            let users = DB.get('users') || [], u = users.find(x => x.username === username);
            let subs = (DB.get('quiz_submissions') || {})[username] || [];
            if (!u) return;

            let csv = `Fiche Eleve: ${u.username}\nNom Reel: ${u.realName || ''}\nDate de Naissance: ${u.birthDate || ''}\nPseudo: ${u.pseudo || ''}\nRole: ${u.role}\n\nQuiz_Titre,Score,Total,Date\n`;
            subs.forEach(s => {
                csv += `"${s.quizTitle}",${s.score},${s.total},"${s.date}"\n`;
            });

            downloadCSV(`export_${username}.csv`, csv);
        }

        function downloadCSV(filename, text) {
            let element = document.createElement('a');
            element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

                if (type === 'revision_sheets') {

        async function uploadExam(e) {
            e.preventDefault();
            let title = document.getElementById('ex-title').value;
            let category = document.getElementById('ex-cat').value;
            let subFile = document.getElementById('ex-sub-file').files[0];
            let subUrl = document.getElementById('ex-sub-url').value;
            let corrFile = document.getElementById('ex-corr-file').files[0];
            let corrUrl = document.getElementById('ex-corr-url').value;

            let processFiles = async (subData, subT, corrData, corrT) => {
                let exams = DB.get('exam_subjects') || [];
                exams.push({ title, category, subjectData: subData, subjectType: subT, corrData, corrType: corrT });
                await DB.set('exam_subjects', exams);
                showToast("Succès", "Sujet et corrigé ajoutés !");
            };

            let getBase64 = (file) => new Promise((resolve) => {
                let r = new FileReader(); r.onload = (e) => resolve(e.target.result); r.readAsDataURL(file);
            });

            let subData = subUrl || (subFile ? await getBase64(subFile) : '');
            let subT = subUrl ? 'url' : (subFile ? subFile.type : '');
            let corrData = corrUrl || (corrFile ? await getBase64(corrFile) : '');
            let corrT = corrUrl ? 'url' : (corrFile ? corrFile.type : '');

            await processFiles(subData, subT, corrData, corrT);
        }

                    <button type="submit" class="w-full py-2 dyn-btn text-white font-bold rounded-xl">Ajouter la formation</button>
                </form>
                <div class="space-y-2 pt-2">
                    ${list.map((f, i) => `<div class="p-2 bg-stone-900 rounded flex justify-between border"><span>${f.title} (${f.city})</span><button onclick="deleteFormation(${i})" class="text-red-400">Supprimer</button></div>`).join('')}
                </div>
            </div>`;
        }
        async function addFormation(e) {
            e.preventDefault();
            let list = DB.get('formations') || [];
            list.push({ title: document.getElementById('f-title').value, type: document.getElementById('f-type').value, establishment: document.getElementById('f-establishment').value, city: document.getElementById('f-city').value, desc: document.getElementById('f-desc').value, link: document.getElementById('f-link').value });
            await DB.set('formations', list); showToast("Succès", "Formation ajoutée !");
        }
        async function deleteFormation(idx) {
            let list = DB.get('formations') || []; list.splice(idx, 1); await DB.set('formations', list);
        }

        function renderAdminPolls() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-amber-300">Créer un Sondage Éclair & Export</h3>
                    <button onclick="exportPollsCSV()" class="px-3 py-1.5 bg-green-600 text-white rounded-xl font-bold"><i class="fa-solid fa-file-csv mr-1"></i> Export Sondages CSV</button>
                </div>
                <form onsubmit="createPoll(event)" class="space-y-3">
                    <input type="text" id="p-quest" required placeholder="Question du sondage..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                    <input type="text" id="p-opts" required placeholder="Options séparées par des virgules (ex: Oui, Non, Peut-être)" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                    <input type="number" id="p-hours" required placeholder="Durée en heures (ex: 24)" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                    <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Lancer le Sondage</button>
                </form>
            </div>`;
        }
        function exportPollsCSV() {
            let polls = DB.get('polls') || [];
            let csv = "Question,Expiration,Option,Nombre_Votes\n";
            polls.forEach(p => {
                p.options.forEach((opt, oIdx) => {
                    csv += `"${p.question}","${p.expiresAt}","${opt}",${p.results[oIdx] || 0}\n`;
                });
            });
            downloadCSV("export_sondages.csv", csv);
        }
        async function createPoll(e) {
            e.preventDefault();
            let question = document.getElementById('p-quest').value;
            let options = document.getElementById('p-opts').value.split(',').map(s => s.trim());
            let hours = parseInt(document.getElementById('p-hours').value) || 24;
            let expiresAt = new Date(new Date().getTime() + hours * 3600 * 1000).toISOString();
            let polls = DB.get('polls') || [];
            polls.push({ question, options, expiresAt, results: {}, voters: [] });
            await DB.set('polls', polls);
            sendPushNotification("Nouveau Sondage !", `Répondez au sondage : "${question}"`);
            showToast("Succès", "Sondage lancé !");
        }

        function renderAdminIdeas() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-amber-300">Boîte à Idées & Export CSV</h3>
                    <button onclick="exportIdeasCSV()" class="px-3 py-1.5 bg-green-600 text-white rounded-xl font-bold"><i class="fa-solid fa-file-csv mr-1"></i> Export Idées CSV</button>
                </div>
            </div>`;
        }
        function exportIdeasCSV() {
            let ideas = DB.get('ideas_board') || [];
            let csv = "Auteur,Titre,Description,Votes_Pour,Votes_Contre,Expiration\n";
            ideas.forEach(i => {
                csv += `"${i.author}","${i.title}","${i.desc}",${i.forVotes||0},${i.againstVotes||0},"${i.expiresAt}"\n`;
            });
            downloadCSV("export_boite_idees.csv", csv);
        }

        function renderAdminCalendar() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4">
                <h3 class="font-bold text-amber-300">Ajouter un Événement au Planning</h3>
                <form onsubmit="addCalendarEvent(event)" class="space-y-2">
                    <input type="text" id="ev-title" required placeholder="Titre de l'événement..." class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <input type="date" id="ev-date" required class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <input type="text" id="ev-desc" required placeholder="Description..." class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <button type="submit" class="w-full py-2 dyn-btn text-white font-bold rounded-xl">Ajouter au planning</button>
                </form>
            </div>`;
        }
        async function addCalendarEvent(e) {
            e.preventDefault();
            let events = DB.get('calendar_events') || [];
            events.push({ title: document.getElementById('ev-title').value, date: document.getElementById('ev-date').value, desc: document.getElementById('ev-desc').value });
            await DB.set('calendar_events', events);
            showToast("Succès", "Événement ajouté au planning !");
        }

        function renderAdminTheme() {
            let cd = DB.get('countdown') || { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' };
            let theme = DB.get('site_theme') || {};
            
            return `<div class="dyn-card border p-6 rounded-3xl space-y-6">
                <h3 class="font-bold text-amber-300">Paramétrage du Compte à Rebours (Accueil)</h3>
                <form onsubmit="saveCountdown(event)" class="space-y-2">
                    <input type="text" id="cd-title" value="${cd.title}" required placeholder="Titre de l'événement..." class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <input type="datetime-local" id="cd-date" value="${cd.date}" required class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <button type="submit" class="w-full py-2 dyn-btn text-white font-bold rounded-xl">Mettre à jour le compte à rebours</button>
                </form>

                <h3 class="font-bold text-amber-300 border-t border-amber-900/40 pt-4">Thèmes Prédéfinis & Décorations Saisons/Fêtes</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <button onclick="setThemePreset('standard')" class="p-2 bg-stone-900 border rounded-xl font-bold">Standard</button>
                    <button onclick="setThemePreset('noel')" class="p-2 bg-stone-900 border rounded-xl font-bold">🎄 Noël</button>
                    <button onclick="setThemePreset('halloween')" class="p-2 bg-stone-900 border rounded-xl font-bold">🎃 Halloween</button>
                    <button onclick="setThemePreset('paques')" class="p-2 bg-stone-900 border rounded-xl font-bold">🥚 Pâques</button>
                    <button onclick="setThemePreset('automne')" class="p-2 bg-stone-900 border rounded-xl font-bold">🍂 Automne</button>
                    <button onclick="setThemePreset('hiver')" class="p-2 bg-stone-900 border rounded-xl font-bold">❄️ Hiver</button>
                    <button onclick="setThemePreset('printemps')" class="p-2 bg-stone-900 border rounded-xl font-bold">🌸 Printemps</button>
                    <button onclick="setThemePreset('ete')" class="p-2 bg-stone-900 border rounded-xl font-bold">☀️ Été</button>
                </div>

                <div class="space-y-3 border-t border-amber-900/40 pt-4">
                    <label class="block font-bold">Couleur principale des boutons</label>
                    <input type="color" id="t-color" value="${theme.btnColor || '#d97706'}" class="p-1 bg-stone-900 border rounded w-20 h-10">
                    
                    <label class="block font-bold pt-2">Fond de page personnalisé (URL ou Fichier)</label>
                    <input type="text" id="t-media" value="${theme.bgMedia || ''}" placeholder="Coller une URL d'image ou vidéo..." class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                    <div class="text-[10px] text-amber-200/60">Ou importer un fichier depuis votre appareil :</div>
                    <input type="file" id="t-file" accept="image/*,video/*" class="w-full p-2 bg-stone-900 border rounded-xl text-xs text-amber-100">

                    <button onclick="saveTheme()" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Appliquer le thème personnalisé</button>
                </div>

                <div class="border-t border-amber-900/40 pt-4 space-y-3">
                    <h4 class="font-bold text-amber-400">Créer une page "Carte Blanche"</h4>
                    <form onsubmit="createCustomPage(event)" class="space-y-2">
                        <input type="text" id="cp-title" required placeholder="Titre de la nouvelle page..." class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100">
                        <textarea id="cp-content" required placeholder="Code HTML / Contenu / Liens vers mini-jeux..." class="w-full p-2 bg-stone-900 border rounded-xl h-20 resize-none text-amber-100"></textarea>
                        <button type="submit" class="w-full py-2 dyn-btn text-white font-bold rounded-xl">Créer la Page</button>
                    </form>
                </div>
            </div>`;
        }

        async function saveCountdown(e) {
            e.preventDefault();
            let title = document.getElementById('cd-title').value;
            let date = document.getElementById('cd-date').value;
            await DB.set('countdown', { title, date });
            showToast("Compte à rebours mis à jour", "Modifié sur la page d'accueil !");
        }

        async function setThemePreset(preset) {
            let t = DB.get('site_theme') || {};
            t.preset = preset;
            await DB.set('site_theme', t);
            showToast("Thème appliqué", `Thème ${preset} activé !`);
        }

        async function saveTheme() {
            let btnColor = document.getElementById('t-color').value;
            let bgMedia = document.getElementById('t-media').value;
            let fileInput = document.getElementById('t-file');
            let t = DB.get('site_theme') || {};
            t.btnColor = btnColor;

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = async (ev) => {
                    t.bgMedia = ev.target.result;
                    await DB.set('site_theme', t);
                    showToast("Thème mis à jour", "Fond et apparence modifiés !");
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                t.bgMedia = bgMedia;
                await DB.set('site_theme', t);
                showToast("Thème mis à jour", "Apparence modifiée !");
            }
        }

        async function createCustomPage(e) {
            e.preventDefault();
            let pages = DB.get('custom_pages') || [];
            pages.push({ id: Date.now().toString(), title: document.getElementById('cp-title').value, content: document.getElementById('cp-content').value });
            await DB.set('custom_pages', pages);
            showToast("Succès", "Page Carte Blanche créée !");
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();
            try {
                let doc = await db.collection("leqg_data").doc("users").get();
                if (doc.exists) cloudData.users = doc.data().value;
            } catch(err){}
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1) {
                if (user.role === 'admin') {
                    let newUsername = document.getElementById('s-username').value.trim();
                    if (newUsername) users[idx].username = newUsername;
                }
                users[idx].realName = document.getElementById('s-lastname').value;
                users[idx].birthDate = document.getElementById('s-birth').value;
                users[idx].password = document.getElementById('s-pass').value;
                let pseudo = document.getElementById('s-pseudo').value;
                let email = document.getElementById('s-email').value;
                if (pseudo) users[idx].pseudo = pseudo;
                if (email) users[idx].email = email;
                users[idx].mustChangePass = false;

                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
