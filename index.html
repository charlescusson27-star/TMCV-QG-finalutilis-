<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- SheetJS CDN pour l'export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(12, 12, 12, 0.95);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
        .seasonal-particle {
            position: fixed;
            top: -5vh;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            animation: fall linear infinite;
        }

        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; color: black !important; background: white !important; }
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden transition-all duration-500">

    <div id="seasonal-particles-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 bg-black/75 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Banner d'Alerte Flash Urgente -->
    <div id="flash-alert-banner" class="hidden fixed top-0 inset-x-0 z-50 bg-red-600 text-white font-black text-xs px-4 py-2 text-center shadow-2xl flex items-center justify-center gap-2 animate-bounce">
        <i class="fa-solid fa-triangle-exclamation text-base"></i>
        <span id="flash-alert-text">ALERTE DÉLÉGUÉS : Message urgent</span>
        <button onclick="document.getElementById('flash-alert-banner').classList.add('hidden')" class="ml-4 text-white hover:text-stone-200"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal Téléchargement APK & Instructions -->
    <div id="apk-download-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-xl dyn-card border rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-amber-400 flex items-center gap-2"><i class="fa-brands fa-android text-lg text-green-500"></i> Instructions d'installation APK</h3>
                <button onclick="toggleModal('apk-download-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 bg-stone-900/80 rounded-2xl border border-amber-900/40 space-y-2">
                <p class="font-bold text-amber-300">📱 Guide de téléchargement & d'installation :</p>
                <div id="apk-instructions-content" class="text-amber-100 whitespace-pre-line leading-relaxed"></div>
            </div>
            <div class="pt-2 flex justify-end">
                <button onclick="toggleModal('apk-download-modal', false)" class="px-5 py-2 dyn-btn text-white font-bold rounded-xl">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modal Fiche de Sanction & Signalement Administrateur -->
    <div id="sanction-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl dyn-card border rounded-3xl p-6 shadow-2xl space-y-4 text-xs max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-red-400 flex items-center gap-2"><i class="fa-solid fa-gavel"></i> Fiche de Sanction & Signalement Officiel</h3>
                <button onclick="toggleModal('sanction-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="submitSanctionForm(event)" class="space-y-4">
                <input type="hidden" id="sanction-target-user">
                
                <div class="p-3 bg-stone-900 rounded-xl border border-amber-900/40 font-bold text-amber-300">
                    Compte ciblé : <span id="sanction-target-display" class="text-white"></span>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Motifs du signalement / Infraction * :</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Propos inappropriés / Insultes" class="sanction-reason accent-amber-500"> Propos inappropriés / Insultes</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Spam / Messages répétés" class="sanction-reason accent-amber-500"> Spam / Harcèlement de chat</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Non-respect du règlement intérieur" class="sanction-reason accent-amber-500"> Non-respect du règlement</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Tricherie / Contournement" class="sanction-reason accent-amber-500"> Tricherie aux quiz</label>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Détails complémentaires & faits observés * :</label>
                    <textarea id="sanction-details" required placeholder="Expliquez précisément la situation..." class="w-full p-3 bg-stone-900 border rounded-xl text-amber-100 h-24 resize-none"></textarea>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Mesure(s) / Sanction(s) appliquée(s) * :</label>
                    <select id="sanction-type" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-300 font-bold">
                        <option value="avertissement">⚠️ Avertissement officiel (Alerte sur le compte)</option>
                        <option value="blocage_tchat">🔇 Mute Tchat / Messagerie (Accès cours conservé)</option>
                        <option value="blocage_forum">🚫 Interdiction de publication (Sondages, Idées, Quiz)</option>
                        <option value="retrait_points">📉 Retrait de points au classement (Personnalisable ci-dessous)</option>
                        <option value="suspension_temp">⏳ Suspension temporaire de compte (24h - 72h)</option>
                        <option value="ban_definitif">❌ Exclusion définitive du QG</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Nombre de points à retirer au classement :</label>
                    <input type="number" id="sanction-points-val" value="20" placeholder="Ex: 50, 100..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Période d'application / Durée :</label>
                    <input type="text" id="sanction-duration" placeholder="Ex: 48h, 1 semaine, Définitif..." value="Immédiat" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 py-3 bg-red-800 hover:bg-red-700 text-white font-black rounded-xl">Enregistrer la sanction & Générer la fiche</button>
                    <button type="button" onclick="toggleModal('sanction-modal', false)" class="px-4 py-3 bg-stone-800 text-amber-200 font-bold rounded-xl">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26', sanctions: [] }
            ],
            messages: [],
            ideas_board: [],
            polls: [],
            quizzes: [],
            quiz_submissions: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            mails: [],
            appreciations: {},
            flashcards_decks: [],
            personal_notes: {},
            app_notifications: [],
            user_scores: {},
            home_qr_image: '',
            app_logo_url: '',
            hidden_tabs: [],
            crosswords: [],
            sanction_reports: [],
            admin_logs: [],
            app_apk_config: { fileUrl: '', instructions: '1. Cliquez sur le lien pour télécharger le fichier APK.\n2. Autorisez l\'installation depuis des sources inconnues dans vos paramètres Android si nécessaire.\n3. Ouvrez le fichier téléchargé et suivez les instructions à l\'écran.' },
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)', bgUrl: '' },
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' }
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                await db.collection("leqg_data").doc(k).set({ value: val });
                applyTheme();
                render();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeConvFilter: null,
            activeDeckId: null,
            activeNoteId: null,
            activeQuizId: null,
            activeCrosswordId: null,
            mailSubTab: 'inbox',
            cvName: '',
            cvEmail: '',
            cvPhone: '',
            cvProfile: '',
            cvExp: '',
            cvEdu: '',
            cvSkills: ''
        };

        async function init() {
            try {
                let userDoc = await db.collection("leqg_data").doc("users").get();
                if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                    for (let k of Object.keys(cloudData)) {
                        await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                    }
                } else {
                    for (let k of Object.keys(cloudData)) {
                        let doc = await db.collection("leqg_data").doc(k).get();
                        if (doc.exists) cloudData[k] = doc.data().value;
                    }
                }
            } catch(e) {
                console.error("Erreur Firebase :", e);
            }
            applyTheme();
            checkBirthdays();
            render();
        }

        async function logAdminAction(action, target) {
            let user = getCurrentUser();
            let logs = DB.get('admin_logs') || [];
            logs.unshift({
                admin: user ? user.username : 'Système',
                action,
                target,
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            });
            await DB.set('admin_logs', logs);
        }

        function checkBirthdays() {
            let users = DB.get('users') || [];
            let today = new Date().toISOString().slice(5, 10);
            let checkedKey = 'leqg_bday_checked_' + today;
            if (sessionStorage.getItem(checkedKey)) return;

            let adminUser = users.find(u => u.username === 'Charlesadmin');
            users.forEach(u => {
                if (u.birthDate && u.birthDate.slice(5, 10) === today) {
                    pushGlobalNotification("🎂 Anniversaire !", `C'est l'anniversaire de ${u.pseudo || u.username} aujourd'hui !`, 'all');
                }
            });
            sessionStorage.setItem(checkedKey, 'true');
        }

        function applyTheme() {
            let t = DB.get('site_theme') || { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)' };
            document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', t.borderColor);

            let body = document.getElementById('body-theme');
            if (t.bgUrl) body.style.backgroundImage = `url('${t.bgUrl}')`;
            else body.style.backgroundImage = 'none';

            generateSeasonalParticles(t.preset);
        }

        function generateSeasonalParticles(preset) {
            let container = document.getElementById('seasonal-particles-container');
            container.innerHTML = '';
            let items = [];

            if (preset === 'noel') items = ['🎄', '🎁', '❄️', '🔴', '⛄'];
            else if (preset === 'halloween') items = ['🎃', '🧙‍♀️', '💀', '🦇', '👻'];
            else if (preset === 'ete') items = ['🏖️', '☀️', '🌊', '🍦', '🌴'];
            else if (preset === 'automne') items = ['🍂', '🍁', '🌰', '🌾'];
            else if (preset === 'hiver') items = ['❄️', '🌨️', '🧊'];
            else if (preset === 'printemps') items = ['🌸', '🌺', '🌼', '🥚', '🦋'];

            if (items.length === 0) return;

            for (let i = 0; i < 25; i++) {
                let el = document.createElement('div');
                el.className = 'seasonal-particle';
                el.textContent = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (5 + Math.random() * 7) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                el.style.fontSize = (16 + Math.random() * 20) + 'px';
                container.appendChild(el);
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        
        async function pushGlobalNotification(title, message, targetUsername = 'all') {
            let notifs = DB.get('app_notifications') || [];
            let newNotif = {
                id: 'notif_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                title, message,
                target: targetUsername || 'all',
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            };
            notifs.unshift(newNotif);
            await DB.set('app_notifications', notifs);
            showToast(title, message);
        }

        async function triggerFlashAlert(event) {
            event.preventDefault();
            let msg = document.getElementById('flash-msg-input').value.trim();
            if (!msg) return;
            
            document.getElementById('flash-alert-text').textContent = "📢 ALERTE DÉLÉGUÉS : " + msg;
            document.getElementById('flash-alert-banner').classList.remove('hidden');
            await pushGlobalNotification("🚨 ALERTE URGENTE", msg, 'all');
            await logAdminAction("Alerte Flash diffusée", msg);
            showToast("Alerte Flash envoyée !", "Visible immédiatement par toute la classe.");
        }

        async function deleteNotification(notifId) {
            let notifs = DB.get('app_notifications') || [];
            notifs = notifs.filter(n => n.id !== notifId);
            await DB.set('app_notifications', notifs);
            showToast("Notification supprimée", "");
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 4000);
        }

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function triggerApkDownload() {
            let apkConfig = DB.get('app_apk_config') || { fileUrl: '', instructions: '' };
            if (!apkConfig.fileUrl) {
                alert("L'application APK n'est pas encore disponible au téléchargement.");
                return;
            }
            window.open(apkConfig.fileUrl, '_blank');
            document.getElementById('apk-instructions-content').textContent = apkConfig.instructions || "Aucune instruction spécifique fournie par l'administration.";
            toggleModal('apk-download-modal', true);
        }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
        }

        function renderLogin() {
            let logoUrl = DB.get('app_logo_url') || '';
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    ${logoUrl ? `
                        <img src="${logoUrl}" class="w-20 h-20 object-contain mx-auto rounded-2xl border-2 border-amber-400 p-1 bg-black/40 shadow-lg">
                    ` : `
                        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    `}
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>
                    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                        <input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button>
                    </form>
                </div>
            </div>`;
        }

        function renderSetup(user) {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs">
                    <h1 class="text-base font-bold text-amber-400">Première connexion - Sécurité Obligatoire</h1>
                    <p class="text-amber-200/70 text-[11px]">Veuillez modifier votre mot de passe provisoire et renseigner vos informations.</p>
                    <form onsubmit="saveSetup(event)" class="space-y-3">
                        <div><label class="block font-bold text-amber-300">Nom & Prénom réels *</label><input type="text" id="s-realname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>
                        <div><label class="block font-bold text-amber-300">Nouveau Mot de passe *</label><input type="password" id="s-pass" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white" placeholder="Nouveau mot de passe"></div>
                        <div><label class="block font-bold text-amber-300">Date de naissance *</label><input type="date" id="s-bdate" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>

        // --- QUIZ UTILISATEUR & PROGRESSION ---
        function renderQuizzesTab(user) {
            let quizzes = DB.get('quizzes') || [];
            let submissions = DB.get('quiz_submissions') || {};
            let mySubmissions = submissions[user.username] || {};

                let quiz = quizzes.find(q => q.id === state.activeQuizId);
                if (quiz) return renderQuizPlayer(user, quiz);
            }

            let totalQuizzesDone = Object.keys(mySubmissions).length;
            let totalQuestions = 0;
            let totalCorrect = 0;
            let subjectStats = {};

            quizzes.forEach(q => {
                let subject = q.subject || 'Général';
                if (!subjectStats[subject]) subjectStats[subject] = { total: 0, correct: 0, done: 0 };
                
                if (mySubmissions[q.id]) {
                    let sub = mySubmissions[q.id];
                    totalQuestions += sub.total;
                    totalCorrect += sub.score;
                    subjectStats[subject].total += sub.total;
                    subjectStats[subject].correct += sub.score;
                    subjectStats[subject].done++;
                }
            });

            let globalPct = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
            let scores = DB.get('user_scores') || {};
            let myPoints = scores[user.username] !== undefined ? scores[user.username] : 0;

            return `<div class="max-w-4xl mx-auto space-y-6 text-xs">
                <!-- VUE PROGRESSION GÉNÉRALE ET MATIÈRES -->
                <div class="dyn-card border p-6 rounded-3xl space-y-4 shadow-xl">
                    <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                        <div>
                            <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-graduation-cap mr-2"></i>Ma Progression & Quiz</h2>
                            <p class="text-amber-200/70">Répondez aux quiz à l'infini pour gagner des points au classement classe !</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-amber-300 font-bold">Score Classe :</span>
                            <div class="text-2xl font-black ${myPoints < 0 ? 'text-red-400' : 'text-white'}">${myPoints} pts</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="p-4 bg-stone-900 rounded-2xl border text-center space-y-1">
                            <div class="text-amber-400 font-bold">Réussite Globale</div>
                            <div class="text-2xl font-black text-white">${globalPct}%</div>
                            <div class="text-[10px] text-amber-200/60">${totalCorrect} / ${totalQuestions} réponses correctes</div>
                        </div>
                        <div class="p-4 bg-stone-900 rounded-2xl border text-center space-y-1">
                            <div class="text-amber-400 font-bold">Quiz Complétés</div>
                            <div class="text-2xl font-black text-white">${totalQuizzesDone} / ${quizzes.length}</div>
                            <div class="text-[10px] text-amber-200/60">Entraînements illimités</div>
                        </div>
                        <div class="p-4 bg-stone-900 rounded-2xl border text-center space-y-1">
                            <div class="text-amber-400 font-bold">Matières évaluées</div>
                            <div class="text-2xl font-black text-white">${Object.keys(subjectStats).length}</div>
                            <div class="text-[10px] text-amber-200/60">Droit, Éco, Vente...</div>
                        </div>
                    </div>

                    <!-- PROGRESSION PAR MATIÈRE -->
                    <div class="space-y-2 pt-2">
                        <h3 class="font-bold text-amber-300 text-xs">Progression par matière :</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${Object.keys(subjectStats).length === 0 ? '<p class="text-amber-200/50 italic">Aucune donnée de matière disponible.</p>' : ''}
                            ${Object.entries(subjectStats).map(([subj, stats]) => {
                                let pct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
                                return `
                                    <div class="p-3 bg-stone-900/80 rounded-xl border space-y-1">
                                        <div class="flex justify-between font-bold text-amber-100">
                                            <span>${subj}</span>
                                            <span>${pct}% (${stats.correct}/${stats.total})</span>
                                        </div>
                                        <div class="w-full bg-stone-950 h-2 rounded-full overflow-hidden border">
                                            <div class="bg-amber-500 h-full" style="width: ${pct}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>

                <!-- LISTE DES QUIZ PAR QUIZ -->
                <div class="space-y-3">
                    <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-list-check mr-2"></i>Liste des Quiz disponibles</h3>
                    ${quizzes.length === 0 ? '<p class="text-amber-200/50 text-center py-6">Aucun quiz publié par l\'administration pour le moment.</p>' : ''}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${quizzes.map(q => {
                            let sub = mySubmissions[q.id];
                            let pct = sub ? Math.round((sub.score / sub.total) * 100) : null;
                            return `
                                <div class="dyn-card border p-5 rounded-2xl flex flex-col justify-between space-y-3">
                                    <div>
                                        <div class="flex justify-between items-start gap-2">
                                            <h4 class="font-bold text-amber-300 text-sm">${q.title}</h4>
                                            <span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded font-bold text-[10px]">${q.subject || 'Général'}</span>
                                        </div>
                                        <p class="text-[10px] text-amber-200/60 mt-1">${q.questions.length} question(s)</p>
                                    </div>
                                    
                                    <div class="flex justify-between items-center border-t border-amber-900/30 pt-3">
                                        <div>
                                            ${sub !== undefined ? `
                                                <span class="text-[10px] text-amber-200 font-bold">Dernier résultat :</span>
                                                <div class="text-xs font-black text-amber-400">${sub.score} / ${sub.total} (${pct}%)</div>
                                            ` : '<span class="text-[10px] text-amber-200/40 italic">Non effectué</span>'}

                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderQuizPlayer(user, quiz) {
            return `<div class="max-w-2xl mx-auto dyn-card border p-8 rounded-3xl space-y-6 text-xs shadow-2xl">
                <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                    <div>
                        <span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded font-bold text-[10px]">${quiz.subject || 'Général'}</span>
                        <h2 class="text-lg font-black text-amber-400 mt-1">${quiz.title}</h2>
                    </div>
                    <button onclick="state.activeQuizId=null;render()" class="px-3 py-1 bg-stone-900 text-amber-200 border rounded-xl font-bold">Quitter</button>
                </div>

                <form onsubmit="submitQuizForm(event, '${quiz.id}')" class="space-y-6">
                    ${quiz.questions.map((q, qIdx) => `
                        <div class="p-4 bg-stone-900/80 rounded-2xl border space-y-3">
                            <h4 class="font-bold text-amber-200 text-sm">Question ${qIdx + 1} : ${q.text}</h4>
                            <div class="space-y-2">
                                ${q.options.map((opt, oIdx) => `
                                    <label class="flex items-center gap-3 p-3 bg-stone-950 border rounded-xl cursor-pointer hover:border-amber-400 transition">
                                        <input type="radio" name="q_${qIdx}" value="${oIdx}" required class="accent-amber-500 w-4 h-4">
                                        <span class="text-amber-100 font-medium">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}

                    <button type="submit" class="w-full py-3 dyn-btn text-white font-black text-sm rounded-xl shadow-lg">Valider mes réponses</button>
                </form>
            </div>`;
        }

        async function submitQuizForm(e, quizId) {
            e.preventDefault();
            let user = getCurrentUser();
            let quizzes = DB.get('quizzes') || [];
            let quiz = quizzes.find(q => q.id === quizId);
            if (!quiz) return;

            let score = 0;
            quiz.questions.forEach((q, qIdx) => {
                let selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
                if (selected && parseInt(selected.value) === parseInt(q.correct)) {
                    score++;
                }
            });

            let submissions = DB.get('quiz_submissions') || {};
            if (!submissions[user.username]) submissions[user.username] = {};
            
            let previousScore = submissions[user.username][quizId] ? submissions[user.username][quizId].score : 0;
            submissions[user.username][quizId] = { score, total: quiz.questions.length, date: new Date().toLocaleDateString('fr-FR') };
            await DB.set('quiz_submissions', submissions);

            // Mise à jour des points au classement
            let pointsGained = Math.max(0, score - previousScore) * 10;
            if (pointsGained > 0) {
                let scores = DB.get('user_scores') || {};
                scores[user.username] = (scores[user.username] || 0) + pointsGained;
                await DB.set('user_scores', scores);
            }

            state.activeQuizId = null;
            showToast("Quiz terminé !", `Votre score : ${score} / ${quiz.questions.length}. ${pointsGained > 0 ? `+${pointsGained} pts au classement !` : ''}`);
            render();
        }

        // --- NOTIFICATIONS SECTION ---
        function renderNotifsSection(user) {
            let notifs = DB.get('app_notifications') || [];
            let myNotifs = notifs.filter(n => n.target === 'all' || n.target === user.username);

            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl space-y-2">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-bell mr-2"></i>Centre de Notifications</h2>
                    <p class="text-amber-200/70">Retrouvez toutes les alertes, messages et annonces reçus. Les notifications restent enregistrées tant que vous ne les supprimez pas.</p>
                </div>
                <div class="space-y-3">
                    ${myNotifs.length === 0 ? '<p class="text-amber-200/50 text-center py-6">Aucune notification pour le moment.</p>' : ''}
                    ${myNotifs.map(n => `
                        <div class="dyn-card border p-4 rounded-2xl flex items-start gap-3">
                            <div class="p-2 bg-amber-500/20 text-amber-400 rounded-xl"><i class="fa-solid fa-circle-info"></i></div>

                                    <h4 class="font-bold text-amber-200 text-sm">${n.title}</h4>
                                    <span class="text-[10px] text-amber-200/50">${n.date}</span>
                                </div>

                            </div>
                            <button onclick="deleteNotification('${n.id}')" title="Supprimer la notification" class="text-red-400/70 hover:text-red-300 p-2 rounded-xl bg-stone-900 border border-red-900/30 transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        // --- SONDAGES EN DIRECT ---
        function renderPollsTab(user) {
            let polls = DB.get('polls') || [];
            let now = new Date();

            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl space-y-2">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Sondages en Direct</h2>
                    <p class="text-amber-200/70">Réponds aux sondages lancés par l'administration avant la fin du temps imparti.</p>
                </div>
                <div class="space-y-3">
                    ${polls.length === 0 ? '<p class="text-amber-200/50 text-center py-6">Aucun sondage en cours.</p>' : ''}
                    ${polls.map((p, pIdx) => {
                        let isExpired = new Date(p.expiresAt) < now;
                        let hasVoted = p.voters && p.voters.includes(user.username);
                        let totalVotes = p.options.reduce((sum, opt) => sum + (opt.votes || 0), 0);

                        return `
                            <div class="dyn-card border p-6 rounded-3xl space-y-4">
                                <div class="flex justify-between items-center">
                                    <h3 class="font-bold text-amber-300 text-sm">${p.question}</h3>
                                    <span class="px-2.5 py-1 rounded text-[10px] font-bold ${isExpired ? 'bg-red-500/20 text-red-300' : 'bg-green-500/20 text-green-300'}">${isExpired ? 'Sondage Terminé' : 'En cours'}</span>
                                </div>
                                <div class="space-y-2">
                                    ${p.options.map((opt, oIdx) => {
                                        let pct = totalVotes > 0 ? Math.round(((opt.votes || 0) / totalVotes) * 100) : 0;
                                        return `
                                            <div class="p-3 bg-stone-900 rounded-xl border space-y-1">
                                                <div class="flex justify-between items-center font-bold text-amber-100">
                                                    <span>${opt.text}</span>
                                                    ${isExpired || hasVoted ? `<span>${opt.votes || 0} vote(s) (${pct}%)</span>` : `<button onclick="votePoll(${pIdx}, ${oIdx})" class="px-3 py-1 dyn-btn text-white rounded-lg text-[10px]">Voter</button>`}
                                                </div>
                                                ${isExpired || hasVoted ? `<div class="w-full bg-stone-950 h-2 rounded-full overflow-hidden border"><div class="bg-amber-500 h-full" style="width: ${pct}%"></div></div>` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>`;
        }

        async function votePoll(pollIdx, optIdx) {
            let user = getCurrentUser();
            let polls = DB.get('polls') || [];
            if (!polls[pollIdx].voters) polls[pollIdx].voters = [];
            if (polls[pollIdx].voters.includes(user.username)) return;

            polls[pollIdx].voters.push(user.username);
            if (!polls[pollIdx].options[optIdx].votes) polls[pollIdx].options[optIdx].votes = 0;
            polls[pollIdx].options[optIdx].votes++;

            await DB.set('polls', polls);
            showToast("Vote enregistré !", "Merci d'avoir participé au sondage.");
        }

        // --- MOTS CROISÉS DYNAMIQUES ADMIN & UTILISATEUR ---
        function renderCrosswordsSection() {
            let crosswords = DB.get('crosswords') || [];

            if (state.activeCrosswordId !== null) {
                let cw = crosswords.find(c => c.id === state.activeCrosswordId);
                if (cw) return renderCrosswordGame(cw);
            }

            return `
                <div class="dyn-card border p-6 rounded-3xl space-y-6 shadow-2xl max-w-4xl mx-auto text-xs">

            notes[user.username].push({ id: newId, title: 'Nouveau cours', content: '', date: new Date().toLocaleDateString('fr-FR') });

            state.activeNoteId = newId;

            let titleEl = document.getElementById('doc-title');

            if (!titleEl || !contentEl) return;
            let title = titleEl.value;
            let content = contentEl.value;
            let notes = DB.get('personal_notes') || {};
            let idx = (notes[user.username] || []).findIndex(n => n.id === noteId);
            if (idx !== -1) {
                notes[user.username][idx].title = title;
                notes[user.username][idx].content = content;
                notes[user.username][idx].date = new Date().toLocaleDateString('fr-FR');
                await DB.set('personal_notes', notes);
                showToast("Document enregistré !", "Vos notes sont sauvegardées.");

        function calculateFullBacAverage() {
            let inputs = document.querySelectorAll('.sim-input');
            let totalWeighted = 0, totalCoef = 0;
            inputs.forEach(i => {
                let note = parseFloat(i.value) || 0;
                let coef = parseFloat(i.getAttribute('data-coef')) || 1;
                totalWeighted += note * coef;
                totalCoef += coef;
            });
            let avg = (totalWeighted / totalCoef).toFixed(2);
            let mention = avg >= 16 ? 'Très Bien 🏆' : avg >= 14 ? 'Bien 🌟' : avg >= 12 ? 'Assez Bien 👍' : avg >= 10 ? 'Admis (Sans mention) ✅' : 'Refusé ❌';

            resDiv.classList.remove('hidden');

        }

        async function sendChatMessage(e) {
            e.preventDefault();
            let user = getCurrentUser(), inp = document.getElementById('chat-inp'), text = inp.value.trim();
            if (!text) return;

            if (user.sanctions && user.sanctions.includes('blocage_tchat')) {
                return alert("Vous ne pouvez pas envoyer de messages suite à une restriction.");
            }

            let msgs = DB.get('messages') || [];
            let recipient = state.chatMode === 'private' ? state.targetUser : 'all';
            
            msgs.push({ sender: user.username, recipient, type: state.chatMode === 'private' ? 'private' : 'general', text, time: new Date().toLocaleTimeString() });
            await DB.set('messages', msgs);

            // Notification du message
            if (state.chatMode === 'private' && recipient) {
                await pushGlobalNotification("💬 Nouveau Message Privé", `${user.pseudo || user.username} vous a envoyé un message : "${text.slice(0, 30)}..."`, recipient);
            } else if (state.chatMode === 'general') {
                await pushGlobalNotification("💬 Nouveau Message Général", `${user.pseudo || user.username} : "${text.slice(0, 30)}..."`, 'all');
            }

            inp.value = '';
            render();
        }

        function openSanctionModal(username) {
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (!u) return;

            document.getElementById('sanction-target-user').value = username;
            document.getElementById('sanction-target-display').textContent = `${u.pseudo || u.username} (${u.realName || u.username})`;
            document.querySelectorAll('.sanction-reason').forEach(cb => cb.checked = false);
            document.getElementById('sanction-details').value = '';
            document.getElementById('sanction-points-val').value = '20';
            toggleModal('sanction-modal', true);
        }

        async function submitSanctionForm(e) {
            e.preventDefault();
            let admin = getCurrentUser();
            let target = document.getElementById('sanction-target-user').value;
            let details = document.getElementById('sanction-details').value.trim();
            let type = document.getElementById('sanction-type').value;
            let duration = document.getElementById('sanction-duration').value.trim();
            let pointsDeducted = parseInt(document.getElementById('sanction-points-val').value) || 0;

            let reasons = [];
            document.querySelectorAll('.sanction-reason:checked').forEach(cb => reasons.push(cb.value));

            if (reasons.length === 0) return alert("Veuillez cocher au moins un motif de signalement.");

            let report = {
                id: 'report_' + Date.now(),
                admin: admin ? admin.username : 'Charlesadmin',
                target,
                reasons,
                details,
                type,
                duration,
                pointsDeducted,
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            };

            let reports = DB.get('sanction_reports') || [];
            reports.unshift(report);
            await DB.set('sanction_reports', reports);

            // Application directe sur l'utilisateur
            let users = DB.get('users') || [];
            let uIdx = users.findIndex(x => x.username === target);
            if (uIdx !== -1) {
                if (!users[uIdx].sanctions) users[uIdx].sanctions = [];
                if (!users[uIdx].sanctions.includes(type)) users[uIdx].sanctions.push(type);

                if (type === 'ban_definitif' || type === 'suspension_temp') {
                    users[uIdx].status = 'masked';
                }
                await DB.set('users', users);
            }

            // Retrait de points au classement (permet les négatifs)
            if (pointsDeducted > 0) {
                let scores = DB.get('user_scores') || {};
                let currentScore = scores[target] !== undefined ? scores[target] : 0;
                scores[target] = currentScore - pointsDeducted;
                await DB.set('user_scores', scores);
            }

            await logAdminAction(`Sanction appliquée (${type}, -${pointsDeducted} pts)`, target);
            await pushGlobalNotification("⚠️ Notification Disciplinaire", `Une mesure disciplinaire (${type}) entraînant un retrait de ${pointsDeducted} pts a été appliquée sur votre compte.`, target);

            toggleModal('sanction-modal', false);
            showToast("Sanction enregistrée !", "Fiche envoyée et synchronisée sur Firebase.");
        }

        async function handleBulkUsersImport(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    let data = evt.target.result;
                    let workbook = XLSX.read(data, { type: 'binary' });
                    let sheetName = workbook.SheetNames[0];
                    let json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                    let users = DB.get('users') || [];
                    let addedCount = 0;

                    json.forEach(row => {
                        let username = row['Identifiant'] || row['username'] || row['ID'];
                        let password = row['Mot de passe'] || row['password'] || 'qg2026';
                        let role = row['Rôle'] || row['role'] || 'student';

                        if (username && !users.some(u => u.username === username)) {
                            users.push({
                                username: String(username).trim(),
                                password: String(password).trim(),
                                role: String(role).trim(),
                                status: 'active',
                                mustChangePass: true,
                                realName: String(username).trim(),
                                pseudo: String(username).trim()
                            });
                            addedCount++;
                        }
                    });

                    await DB.set('users', users);
                    await logAdminAction(`Importation en masse (${addedCount} comptes)`, "Excel/CSV");
                    showToast("Importation réussie !", `${addedCount} comptes ajoutés sur LE QG.`);
                } catch(err) {
                    alert("Erreur lors de la lecture du fichier : " + err.message);
                }
            };
            reader.readAsBinaryString(file);
        }

        async function adminCreateQuiz(e) {
            e.preventDefault();
            let title = document.getElementById('quiz-title').value.trim();
            let subject = document.getElementById('quiz-subject').value.trim();
            let blocks = document.querySelectorAll('.quiz-q-block');
            let questions = [];

                let o2 = b.querySelector('.q-opt-2').value.trim();
                let o3 = b.querySelector('.q-opt-3').value.trim();
                let correct = parseInt(b.querySelector('.q-correct').value);

                let options = [o0, o1];
                if (o2) options.push(o2);
                if (o3) options.push(o3);

                if (text && options.length >= 2) {
                    questions.push({ text, options, correct });
                }
            });

            if (questions.length === 0) return alert("Ajoutez au moins une question valide !");

            let quizzes = DB.get('quizzes') || [];
            let newQuiz = {
                id: 'quiz_' + Date.now(),
                title,
                subject,
                questions
            };
            quizzes.unshift(newQuiz);
            await DB.set('quizzes', quizzes);

            await pushGlobalNotification("❓ Nouveau Quiz Publié", `Un nouveau quiz "${title}" (${subject}) est en ligne !`, 'all');

        }

        // --- EXPORTATIONS EXCEL (.XLSX) VIA SHEETJS ---
        function exportExcelData(type) {
            let wb = XLSX.utils.book_new();
            let data = [];

            if (type === 'all_accounts') {
                let users = DB.get('users') || [];
                let submissions = DB.get('quiz_submissions') || {};
                let scores = DB.get('user_scores') || {};
                data = users.map(u => {
                    let userSubs = submissions[u.username] || {};
                    let totalQ = 0, totalCorrect = 0;
                    Object.values(userSubs).forEach(s => { totalQ += s.total; totalCorrect += s.score; });
                    let progText = totalQ > 0 ? `${Math.round((totalCorrect / totalQ) * 100)}% (${totalCorrect}/${totalQ})` : 'Aucun quiz effectué';

                    return {
                        "Identifiant": u.username,
                        "Mot de passe": u.password,
                        "Score Classe (pts)": scores[u.username] !== undefined ? scores[u.username] : 0,
                        "Progression au Quiz": progText,
                        "Date de naissance": u.birthDate || 'Non renseignée',
                        "Adresse Mail": u.email || 'Non renseignée',
                        "Sanctions actives": (u.sanctions || []).join(', ') || 'Aucune'
                    };
                });
                let ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "Comptes Utilisateurs");
                XLSX.writeFile(wb, "leqg_comptes_utilisateurs.xlsx");
            } 
            else if (type === 'polls') {
                let polls = DB.get('polls') || [];
                data = polls.map(p => {
                    let totalVoters = p.voters ? p.voters.length : 0;
                    let resultStr = p.options.map(o => `${o.text}: ${o.votes || 0} vote(s)`).join(' | ');
                    return {
                        "Intitulé": p.question,
                        "Nombre de votants": totalVoters,
                        "Résultat": resultStr
                    };
                });
                let ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "Sondages");
                XLSX.writeFile(wb, "leqg_sondages_resultats.xlsx");
            } 
            else if (type === 'ideas') {
                let ideas = DB.get('ideas_board') || [];
                data = ideas.map(i => ({
                    "Titre de l'idée": i.title,
                    "Description": i.description,
                    "Nom de la personne": i.author,
                    "Résultat": `${i.votes || 0} vote(s)`
                }));
                let ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "Boîte à Idées");
                XLSX.writeFile(wb, "leqg_boite_a_idees.xlsx");
            }

            showToast("Export Excel réussi !", "Fichier .xlsx téléchargé.");
        }
