<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- SheetJS CDN pour l'export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(12, 12, 12, 0.95);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
        .seasonal-particle {
            position: fixed;
            top: -5vh;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            animation: fall linear infinite;
        }

        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; color: black !important; background: white !important; }
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden transition-all duration-500">

    <div id="seasonal-particles-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 bg-black/75 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Banner d'Alerte Flash Urgente -->
    <div id="flash-alert-banner" class="hidden fixed top-0 inset-x-0 z-50 bg-red-600 text-white font-black text-xs px-4 py-2 text-center shadow-2xl flex items-center justify-center gap-2 animate-bounce">
        <i class="fa-solid fa-triangle-exclamation text-base"></i>
        <span id="flash-alert-text">ALERTE DÉLÉGUÉS : Message urgent</span>
        <button onclick="document.getElementById('flash-alert-banner').classList.add('hidden')" class="ml-4 text-white hover:text-stone-200"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal Téléchargement APK & Instructions -->
    <div id="apk-download-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-xl dyn-card border rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-amber-400 flex items-center gap-2"><i class="fa-brands fa-android text-lg text-green-500"></i> Instructions d'installation APK</h3>
                <button onclick="toggleModal('apk-download-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 bg-stone-900/80 rounded-2xl border border-amber-900/40 space-y-2">
                <p class="font-bold text-amber-300">📱 Guide de téléchargement & d'installation :</p>
                <div id="apk-instructions-content" class="text-amber-100 whitespace-pre-line leading-relaxed"></div>
            </div>
            <div class="pt-2 flex justify-end">
                <button onclick="toggleModal('apk-download-modal', false)" class="px-5 py-2 dyn-btn text-white font-bold rounded-xl">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modal Fiche de Sanction & Signalement Administrateur -->
    <div id="sanction-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl dyn-card border rounded-3xl p-6 shadow-2xl space-y-4 text-xs max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-red-400 flex items-center gap-2"><i class="fa-solid fa-gavel"></i> Fiche de Sanction & Signalement Officiel</h3>
                <button onclick="toggleModal('sanction-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="submitSanctionForm(event)" class="space-y-4">
                <input type="hidden" id="sanction-target-user">
                
                <div class="p-3 bg-stone-900 rounded-xl border border-amber-900/40 font-bold text-amber-300">
                    Compte ciblé : <span id="sanction-target-display" class="text-white"></span>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Motifs du signalement / Infraction * :</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Propos inappropriés / Insultes" class="sanction-reason accent-amber-500"> Propos inappropriés / Insultes</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Spam / Messages répétés" class="sanction-reason accent-amber-500"> Spam / Harcèlement de chat</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Non-respect du règlement intérieur" class="sanction-reason accent-amber-500"> Non-respect du règlement</label>
                        <label class="flex items-center gap-2 p-2 bg-stone-900 rounded-lg border cursor-pointer hover:border-amber-400"><input type="checkbox" value="Tricherie / Contournement" class="sanction-reason accent-amber-500"> Tricherie aux quiz</label>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Détails complémentaires & faits observés * :</label>
                    <textarea id="sanction-details" required placeholder="Expliquez précisément la situation..." class="w-full p-3 bg-stone-900 border rounded-xl text-amber-100 h-24 resize-none"></textarea>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Mesure(s) / Sanction(s) appliquée(s) * :</label>
                    <select id="sanction-type" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-300 font-bold">
                        <option value="avertissement">⚠️ Avertissement officiel (Alerte sur le compte)</option>
                        <option value="blocage_tchat">🔇 Mute Tchat / Messagerie (Accès cours conservé)</option>
                        <option value="blocage_forum">🚫 Interdiction de publication (Sondages, Idées, Quiz)</option>
                        <option value="retrait_points">📉 Retrait de points au classement (Personnalisable ci-dessous)</option>
                        <option value="suspension_temp">⏳ Suspension temporaire de compte (24h - 72h)</option>
                        <option value="ban_definitif">❌ Exclusion définitive du QG</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Nombre de points à retirer au classement :</label>
                    <input type="number" id="sanction-points-val" value="20" placeholder="Ex: 50, 100..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                </div>

                <div>
                    <label class="block font-bold text-amber-200 mb-1">Période d'application / Durée :</label>
                    <input type="text" id="sanction-duration" placeholder="Ex: 48h, 1 semaine, Définitif..." value="Immédiat" class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 py-3 bg-red-800 hover:bg-red-700 text-white font-black rounded-xl">Enregistrer la sanction & Générer la fiche</button>
                    <button type="button" onclick="toggleModal('sanction-modal', false)" class="px-4 py-3 bg-stone-800 text-amber-200 font-bold rounded-xl">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26', sanctions: [], emojiBadges: ['👑'], currentBadge: '👑', privacyMode: 'public' }
            ],
            quests_month: [
                { id: 'quest_1', title: 'Défi Vente : Rédiger une fiche produit parfaite', reward: 50, desc: 'Proposez une fiche détaillée sur un produit de votre choix.', status: 'active' },
                { id: 'quest_2', title: 'Défi Vocabulaire Éco-Gestion (QCM)', reward: 75, desc: 'Quiz interactif de vocabulaire seconde et première.', status: 'active', type: 'vocab_quiz' }
            ],
            pending_quests: [],
            pending_revision_sheets: [],
            monthly_scores: {},
            annual_scores: {},
            badges_config: [
                { id: 'badge_king', name: 'Roi du QG', emoji: '👑', criteria: 'Top 1 mensuel' },
                { id: 'badge_star', name: 'Étoile de la Vente', emoji: '⭐', criteria: 'Meilleures fiches' }
            ],
            messages: [],
            ideas_board: [],
            polls: [],
            quizzes: [],
            quiz_submissions: {},
            revision_sheets: [],
            exam_subjects: [],
            exercises: [],
            formations: [],
            mails: [],
            appreciations: {},
            flashcards_decks: [],
            personal_notes: {},
            app_notifications: [],
            user_scores: {},
            home_qr_image: '',
            app_logo_url: '',
            hidden_tabs: [],
            crosswords: [],
            sanction_reports: [],
            admin_logs: [],
            app_apk_config: { fileUrl: '', instructions: '1. Cliquez sur le lien pour télécharger le fichier APK.\n2. Autorisez l\'installation depuis des sources inconnues dans vos paramètres Android si nécessaire.\n3. Ouvrez le fichier téléchargé et suivez les instructions à l\'écran.' },
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)', bgUrl: '' },
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' }
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                await db.collection("leqg_data").doc(k).set({ value: val });
                applyTheme();
                render();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeConvFilter: null,
            activeDeckId: null,
            activeNoteId: null,
            activeQuizId: null,
            activeCrosswordId: null,
            mailSubTab: 'inbox',
            cvName: '',
            cvEmail: '',
            cvPhone: '',
            cvProfile: '',
            cvExp: '',
            cvEdu: '',
            cvSkills: ''
        };

        async function init() {
            try {
                let userDoc = await db.collection("leqg_data").doc("users").get();
                if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                    for (let k of Object.keys(cloudData)) {
                        await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                    }
                } else {
                    for (let k of Object.keys(cloudData)) {
                        let doc = await db.collection("leqg_data").doc(k).get();
                        if (doc.exists) cloudData[k] = doc.data().value;
                    }
                }
            } catch(e) {
                console.error("Erreur Firebase :", e);
            }
            applyTheme();
            checkBirthdays();
            checkMonthlyResetAndBadges();
            render();
        }

        function checkMonthlyResetAndBadges() {
            let now = new Date();
            if (now.getDate() === 1) {
                let lastReset = localStorage.getItem('leqg_monthly_reset_date');
                let todayStr = now.toISOString().slice(0, 10);
                if (lastReset !== todayStr) {
                    // Remise à zéro mensuelle du classement mensuel
                    cloudData.monthly_scores = {};
                    db.collection("leqg_data").doc("monthly_scores").set({ value: {} });
                    localStorage.setItem('leqg_monthly_reset_date', todayStr);
                    pushGlobalNotification("🏆 Nouveau Mois !", "Le classement mensuel a été réinitialisé. De nouveaux badges ont été attribués !", 'all');
                }
            }
        }

        async function logAdminAction(action, target) {
            let user = getCurrentUser();
            let logs = DB.get('admin_logs') || [];
            logs.unshift({
                admin: user ? user.username : 'Système',
                action,
                target,
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            });
            await DB.set('admin_logs', logs);
        }

        function checkBirthdays() {
            let users = DB.get('users') || [];
            let today = new Date().toISOString().slice(5, 10);
            let checkedKey = 'leqg_bday_checked_' + today;
            if (sessionStorage.getItem(checkedKey)) return;

            users.forEach(u => {
                if (u.birthDate && u.birthDate.slice(5, 10) === today) {
                    pushGlobalNotification("🎂 Anniversaire !", `C'est l'anniversaire de ${u.pseudo || u.username} aujourd'hui !`, 'all');
                }
            });
            sessionStorage.setItem(checkedKey, 'true');
        }

        function applyTheme() {
            let t = DB.get('site_theme') || { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)' };
            document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', t.borderColor);

            let body = document.getElementById('body-theme');
            if (t.bgUrl) body.style.backgroundImage = `url('${t.bgUrl}')`;
            else body.style.backgroundImage = 'none';

            generateSeasonalParticles(t.preset);
        }

        function generateSeasonalParticles(preset) {
            let container = document.getElementById('seasonal-particles-container');
            container.innerHTML = '';
            let items = [];

            if (preset === 'noel') items = ['🎄', '🎁', '❄️', '🔴', '⛄'];
            else if (preset === 'halloween') items = ['🎃', '🧙‍♀️', '💀', '🦇', '👻'];
            else if (preset === 'ete') items = ['🏖️', '☀️', '🌊', '🍦', '🌴'];
            else if (preset === 'automne') items = ['🍂', '🍁', '🌰', '🌾'];
            else if (preset === 'hiver') items = ['❄️', '🌨️', '🧊'];
            else if (preset === 'printemps') items = ['🌸', '🌺', '🌼', '🥚', '🦋'];

            if (items.length === 0) return;

            for (let i = 0; i < 25; i++) {
                let el = document.createElement('div');
                el.className = 'seasonal-particle';
                el.textContent = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (5 + Math.random() * 7) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                el.style.fontSize = (16 + Math.random() * 20) + 'px';
                container.appendChild(el);
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        
        async function pushGlobalNotification(title, message, targetUsername = 'all') {
            let notifs = DB.get('app_notifications') || [];
            let newNotif = {
                id: 'notif_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                title, message,
                target: targetUsername || 'all',
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            };
            notifs.unshift(newNotif);
            await DB.set('app_notifications', notifs);
            showToast(title, message);
        }

        async function triggerFlashAlert(event) {
            event.preventDefault();
            let msg = document.getElementById('flash-msg-input').value.trim();
            if (!msg) return;
            
            document.getElementById('flash-alert-text').textContent = "📢 ALERTE DÉLÉGUÉS : " + msg;
            document.getElementById('flash-alert-banner').classList.remove('hidden');
            await pushGlobalNotification("🚨 ALERTE URGENTE", msg, 'all');
            await logAdminAction("Alerte Flash diffusée", msg);
            showToast("Alerte Flash envoyée !", "Visible immédiatement par toute la classe.");
        }

        async function deleteNotification(notifId) {
            let notifs = DB.get('app_notifications') || [];
            notifs = notifs.filter(n => n.id !== notifId);
            await DB.set('app_notifications', notifs);
            showToast("Notification supprimée", "");
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 4000);
        }

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function triggerApkDownload() {
            let apkConfig = DB.get('app_apk_config') || { fileUrl: '', instructions: '' };
            if (!apkConfig.fileUrl) {
                alert("L'application APK n'est pas encore disponible au téléchargement.");
                return;
            }
            window.open(apkConfig.fileUrl, '_blank');
            document.getElementById('apk-instructions-content').textContent = apkConfig.instructions || "Aucune instruction spécifique fournie par l'administration.";
            toggleModal('apk-download-modal', true);
        }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            let badge = (user.privacyMode !== 'private' && user.currentBadge) ? user.currentBadge : '';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
                ${badge ? `<span class="absolute -bottom-1 -left-1 text-[10px] bg-black/80 rounded-full px-0.5">${badge}</span>` : ''}
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
        }

        function renderLogin() {
            let logoUrl = DB.get('app_logo_url') || '';
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    ${logoUrl ? `
                        <img src="${logoUrl}" class="w-20 h-20 object-contain mx-auto rounded-2xl border-2 border-amber-400 p-1 bg-black/40 shadow-lg">
                    ` : `
                        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    `}
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>

        async function submitStudentRevisionSheet(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let title = document.getElementById('sr-title').value.trim();
            let subject = document.getElementById('sr-subject').value.trim();
            let fileData = document.getElementById('sr-url').value.trim();
            let desc = document.getElementById('sr-desc').value.trim();

            let pending = DB.get('pending_revision_sheets') || [];
            pending.unshift({
                id: 'rev_prop_' + Date.now(),
                author: user.username,
                pseudo: user.pseudo || user.username,
                title,
                subject,
                fileData,
                fileType: 'url',
                desc,
                date: new Date().toLocaleDateString('fr-FR')
            });

            await DB.set('pending_revision_sheets', pending);
            showToast("Fiche proposée !", "Votre proposition a été transmise à l'administrateur en toute confidentialité.");
            e.target.reset();
        }

        async function completeQuest(questId, questTitle, reward) {
            let user = getCurrentUser();
            let pending = DB.get('pending_quests') || [];
            if (pending.some(p => p.user === user.username && p.questId === questId)) {
                return alert("Vous avez déjà soumis cette quête en attente de validation.");
            }
            pending.unshift({
                id: 'pq_' + Date.now(),
                user: user.username,
                pseudo: user.pseudo || user.username,
                questId,
                questTitle,
                reward,
                date: new Date().toLocaleDateString('fr-FR')
            });
            await DB.set('pending_quests', pending);
            showToast("Quête soumise !", "Votre demande de validation a été envoyée à l'administrateur.");
        }

        async function submitVocabQuiz(e) {
            e.preventDefault();
            let selects = document.querySelectorAll('.vocab-q');
            let correctCount = 0;
            selects.forEach(s => {
                if (s.value === s.getAttribute('data-correct')) correctCount++;
            });

            let user = getCurrentUser();
            let pending = DB.get('pending_quests') || [];
            pending.unshift({
                id: 'pq_vocab_' + Date.now(),
                user: user.username,
                pseudo: user.pseudo || user.username,
                questTitle: 'Quiz de Vocabulaire Éco-Gestion',
                reward: correctCount * 25,
                scoreDetails: `${correctCount} / ${selects.length} bonnes réponses`,
                date: new Date().toLocaleDateString('fr-FR')
            });
            await DB.set('pending_quests', pending);

            document.getElementById('vocab-modal').remove();
            showToast("Quiz envoyé !", "Vos réponses ont été transmises à l'administrateur pour attribution des points.");
        }

        // --- QUIZ UTILISATEUR & PROGRESSION ---
        function renderQuizzesTab(user) {
            let quizzes = DB.get('quizzes') || [];
            let submissions = DB.get('quiz_submissions') || {};
            let mySubmissions = submissions[user.username] || {};

            if (state.activeQuizId !== null) {
                let quiz = quizzes.find(q => q.id === state.activeQuizId);
                if (quiz) return renderQuizPlayer(user, quiz);
            }

            let totalQuizzesDone = Object.keys(mySubmissions).length;
            let totalQuestions = 0;
            let totalCorrect = 0;
            let subjectStats = {};

            quizzes.forEach(q => {
                let subject = q.subject || 'Général';
                if (!subjectStats[subject]) subjectStats[subject] = { total: 0, correct: 0, done: 0 };
                
                if (mySubmissions[q.id]) {
                    let sub = mySubmissions[q.id];
                    totalQuestions += sub.total;
                    totalCorrect += sub.score;
                    subjectStats[subject].total += sub.total;
                    subjectStats[subject].correct += sub.score;
                    subjectStats[subject].done++;
                }
            });

            let globalPct = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
            let scores = DB.get('user_scores') || {};
            let myPoints = scores[user.username] !== undefined ? scores[user.username] : 0;

            return `<div class="max-w-4xl mx-auto space-y-6 text-xs">

                            let sub = mySubmissions[q.id];

                                    <div>
                                        <div class="flex justify-between items-start gap-2">

                                                <div class="text-xs font-black text-amber-400">${sub.score} / ${sub.total} (${pct}%)</div>

                                    </label>
                                `).join('')}

                    `).join('')}

        async function submitQuizForm(e, quizId) {
            e.preventDefault();
            let user = getCurrentUser();
            let quizzes = DB.get('quizzes') || [];
            let quiz = quizzes.find(q => q.id === quizId);
            if (!quiz) return;

            let score = 0;
            quiz.questions.forEach((q, qIdx) => {
                let selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
                if (selected && parseInt(selected.value) === parseInt(q.correct)) {
                    score++;
                }
            });

            let submissions = DB.get('quiz_submissions') || {};
            if (!submissions[user.username]) submissions[user.username] = {};
            
            let previousScore = submissions[user.username][quizId] ? submissions[user.username][quizId].score : 0;
            submissions[user.username][quizId] = { score, total: quiz.questions.length, date: new Date().toLocaleDateString('fr-FR') };
            await DB.set('quiz_submissions', submissions);

            let pointsGained = Math.max(0, score - previousScore) * 10;
            if (pointsGained > 0) {
                let scores = DB.get('user_scores') || {};
                scores[user.username] = (scores[user.username] || 0) + pointsGained;
                let monthly = DB.get('monthly_scores') || {};
                monthly[user.username] = (monthly[user.username] || 0) + pointsGained;
                await DB.set('user_scores', scores);
                await DB.set('monthly_scores', monthly);
            }

            state.activeQuizId = null;
            showToast("Quiz terminé !", `Votre score : ${score} / ${quiz.questions.length}. ${pointsGained > 0 ? `+${pointsGained} pts au classement !` : ''}`);
            render();
        }

            let msgs = DB.get('messages') || [], users = DB.get('users') || [];
            let isMuted = user.sanctions && user.sanctions.includes('blocage_tchat');
            let filtered = state.chatMode === 'general' ? msgs.filter(m => !m.recipient || m.recipient === 'all') : msgs.filter(m => (m.sender === user.username && m.recipient === state.targetUser) || (m.sender === state.targetUser && m.recipient === user.username));
            
            return `<div class="max-w-4xl mx-auto dyn-card border p-6 rounded-3xl space-y-4 text-xs h-[540px] flex flex-col justify-between">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-base font-black text-amber-400">Messagerie</h2>
                    <div class="flex gap-2">
                        <button onclick="state.chatMode='general';state.targetUser=null;render()" class="px-3 py-1.5 ${state.chatMode==='general'?'dyn-btn text-white':'bg-stone-900'} rounded-xl font-bold">Général</button>
                        <select onchange="state.chatMode='private';state.targetUser=this.value;render()" class="p-1.5 bg-stone-900 border rounded-xl text-amber-300 font-bold"><option value="">Message Privé...</option>${users.filter(x => x.username !== user.username).map(x => `<option value="${x.username}" ${state.targetUser===x.username?'selected':''}>${x.pseudo||x.username}</option>`).join('')}</select>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-3 bg-stone-900/60 rounded-2xl border">${filtered.map(m => {
                    let senderObj = users.find(u => u.username === m.sender);
                    let badge = (senderObj && senderObj.privacyMode !== 'private' && senderObj.currentBadge) ? senderObj.currentBadge + ' ' : '';
                    return `<div class="p-3 rounded-2xl max-w-[80%] ${m.sender===user.username?'ml-auto bg-amber-600 text-white':'mr-auto bg-stone-950 text-amber-100 border'}"><b class="text-amber-300">${badge}${m.sender}</b><p>${m.text}</p></div>`;
                }).join('')}</div>
                ${isMuted ? `<div class="p-3 bg-red-950/80 text-red-200 text-center rounded-xl font-bold">🚫 Accès au tchat restreint.</div>` : `<form onsubmit="sendChatMessage(event)" class="flex gap-2"><input type="text" id="chat-inp" required placeholder="Message..." class="flex-1 p-3 bg-stone-900 border rounded-xl text-amber-100"><button type="submit" class="dyn-btn px-6 text-white font-bold rounded-xl">Envoyer</button></form>`}
            </div>`;
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            let user = getCurrentUser(), inp = document.getElementById('chat-inp'), text = inp.value.trim();
            if (!text) return;
            let msgs = DB.get('messages') || [];
            let recipient = state.chatMode === 'private' ? state.targetUser : 'all';
            msgs.push({ sender: user.username, recipient, type: state.chatMode === 'private' ? 'private' : 'general', text, time: new Date().toLocaleTimeString() });
            await DB.set('messages', msgs);
            inp.value = '';
            render();
        }

        // --- PANNEAU ADMINISTRATEUR COMPLET & VALIDATIONS ---
        function renderAdmin() {
            let users = DB.get('users') || [];
            let pendingQuests = DB.get('pending_quests') || [];
            let pendingSheets = DB.get('pending_revision_sheets') || [];

            return `
                <div class="max-w-5xl mx-auto space-y-6 text-xs">
                    <div class="dyn-card border p-6 rounded-3xl space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                            <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-user-gear mr-2"></i>Super-Panneau Administrateur LE QG</h2>
                            <span class="px-3 py-1 bg-amber-500/20 text-amber-300 font-bold border rounded-xl">Admin</span>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-2">
                            ${adminNavBtn('users', 'Comptes Users', 'users-gear')}
                            ${adminNavBtn('points_mgmt', 'Gestion Points', 'calculator')}
                            ${adminNavBtn('val_quests', `Val. Quêtes (${pendingQuests.length})`, 'flag-checkered')}
                            ${adminNavBtn('val_sheets', `Val. Fiches (${pendingSheets.length})`, 'book-bookmark')}
                            ${adminNavBtn('badges_mgmt', 'Badges Émojis', 'award')}
                            ${adminNavBtn('revisions', 'Upload Fiches', 'book-open')}
                            ${adminNavBtn('exercises', 'Upload Exercices', 'file-pen')}
                            ${adminNavBtn('exams', 'Upload Sujets Bac', 'file-pdf')}
                            ${adminNavBtn('apk', 'Fichier APK', 'android')}
                            ${adminNavBtn('logo', 'Logo', 'image')}
                        </div>
                    </div>
                    ${renderAdminSubSection()}
                </div>
            `;
        }

        function adminNavBtn(subId, label, icon) {
            let active = state.adminSub === subId;
            return `<button onclick="state.adminSub='${subId}';render()" class="px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 border transition ${active?'dyn-btn text-white border-amber-400':'bg-stone-900 text-amber-200/80 border-amber-900/40 hover:bg-stone-850'}"><i class="fa-solid fa-${icon}"></i> ${label}</button>`;
        }

        function renderAdminSubSection() {
            if (state.adminSub === 'points_mgmt') {
                let users = DB.get('users') || [];
                let scores = DB.get('user_scores') || {};
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-calculator mr-2"></i>Gestion Libre des Points (Ajouter / Retirer)</h3>
                        <div class="space-y-3">
                            ${users.map(u => `
                                <div class="p-3 bg-stone-900 rounded-xl border flex justify-between items-center">
                                    <div>
                                        <b class="text-amber-200">${u.pseudo || u.username}</b> 
                                        <span class="text-[10px] text-amber-400 ml-2">Score actuel : ${scores[u.username] || 0} pts</span>
                                    </div>
                                    <div class="flex gap-2 items-center">
                                        <input type="number" step="0.5" id="pts-input-${u.username}" placeholder="Ex: 50 ou -20" class="p-2 bg-stone-950 border rounded-lg text-amber-100 w-28">
                                        <button onclick="adminAdjustPoints('${u.username}')" class="px-3 py-2 dyn-btn text-white font-bold rounded-lg">Appliquer</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (state.adminSub === 'val_quests') {
                let pending = DB.get('pending_quests') || [];
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-flag-checkered mr-2"></i>Validation des Quêtes & Défis du Mois</h3>
                        <div class="space-y-3">
                            ${pending.length === 0 ? '<p class="text-amber-200/50 text-center py-6">Aucune demande de quête en attente.</p>' : ''}
                            ${pending.map(p => `
                                <div class="p-4 bg-stone-900 rounded-2xl border space-y-2">
                                    <div class="flex justify-between items-center">
                                        <b class="text-amber-200">Élève : ${p.pseudo}</b>
                                        <span class="text-[10px] text-amber-400">Récompense prévue : ${p.reward} pts</span>
                                    </div>
                                    <p class="text-white text-sm">Quête : ${p.questTitle}</p>
                                    ${p.scoreDetails ? `<p class="text-xs text-amber-300">Détails : ${p.scoreDetails}</p>` : ''}
                                    <div class="flex gap-2 pt-2">
                                        <button onclick="adminApproveQuest('${p.id}', '${p.user}', ${p.reward})" class="px-4 py-2 bg-green-800 hover:bg-green-700 text-white font-bold rounded-xl">Valider & Créditer les points</button>
                                        <button onclick="adminRejectQuest('${p.id}')" class="px-4 py-2 bg-red-900/50 text-red-300 border font-bold rounded-xl">Rejeter</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (state.adminSub === 'val_sheets') {
                let pending = DB.get('pending_revision_sheets') || [];
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-book-bookmark mr-2"></i>Validation des Fiches de Révision Proposées par les Élèves</h3>
                        <div class="space-y-3">
                            ${pending.length === 0 ? '<p class="text-amber-200/50 text-center py-6">Aucune fiche en attente de validation.</p>' : ''}
                            ${pending.map(s => `
                                <div class="p-4 bg-stone-900 rounded-2xl border space-y-2">
                                    <div class="flex justify-between items-center">
                                        <b class="text-amber-200">Proposé par : ${s.pseudo} (${s.subject})</b>
                                        <a href="${s.fileData}" target="_blank" class="text-amber-400 underline">Voir le document ➔</a>
                                    </div>
                                    <h4 class="font-bold text-white text-sm">${s.title}</h4>
                                    <p class="text-amber-100/80">${s.desc || 'Aucun commentaire'}</p>
                                    <div class="flex gap-2 items-center pt-2">
                                        <input type="number" step="0.5" id="sheet-pts-${s.id}" placeholder="Points à attribuer..." class="p-2 bg-stone-950 border rounded-xl text-amber-100 w-36" value="50">
                                        <button onclick="adminApproveStudentSheet('${s.id}')" class="px-4 py-2 bg-green-800 text-white font-bold rounded-xl">Valider & Publier</button>
                                        <button onclick="adminRejectStudentSheet('${s.id}')" class="px-4 py-2 bg-red-900/50 text-red-300 border font-bold rounded-xl">Rejeter</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (state.adminSub === 'badges_mgmt') {
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-award mr-2"></i>Gestion des Badges Émojis Mensuels</h3>
                        <form onsubmit="adminCreateBadge(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-3">
                            <h4 class="font-bold text-amber-400">Créer un nouveau badge</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                <input type="text" id="b-name" required placeholder="Nom (ex: Top Vente)..." class="p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                                <input type="text" id="b-emoji" required placeholder="Émoji (ex: 🥇)..." class="p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                                <input type="text" id="b-crit" required placeholder="Critère d'attribution..." class="p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                            </div>
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Créer & Programmer l'attribution automatique</button>
                        </form>
                    </div>
                `;
            }

            if (state.adminSub === 'revisions') {
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-book-open mr-2"></i>Publier une Fiche de Révision Officielle</h3>
                        <form onsubmit="adminUploadRevision(event)" class="space-y-3">
                            <input type="text" id="rev-title" required placeholder="Titre de la fiche..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <input type="text" id="rev-subject" required placeholder="Matière (ex: Droit, Éco)..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <input type="url" id="rev-url" required placeholder="Lien URL du document..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier la fiche</button>
                        </form>
                    </div>
                `;
            }

            if (state.adminSub === 'exercises' || state.adminSub === 'exams') {
                let isExam = state.adminSub === 'exams';
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-file-pdf mr-2"></i>Publier ${isExam ? 'un Sujet Type Bac' : 'une Fiche d\'Exercice'} (Double Bloc)</h3>
                        <form onsubmit="adminUploadDoubleBlockDoc(event, '${isExam ? 'exam_subjects' : 'exercises'}')" class="space-y-3">
                            <input type="text" id="doc-title" required placeholder="Titre de l'épreuve ou de l'exercice..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100 font-bold">
                            <textarea id="doc-desc" placeholder="Description facultative..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100 h-20 resize-none"></textarea>
                            
                            <div class="p-4 bg-stone-900 rounded-2xl border space-y-2">
                                <label class="block font-bold text-amber-300">Bloc 1 : Énoncé / Sujet / Exercice (URL)</label>
                                <input type="url" id="doc-file-url" required placeholder="Lien URL de l'énoncé..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                            </div>

                            <div class="p-4 bg-stone-900 rounded-2xl border space-y-2">
                                <label class="block font-bold text-green-300">Bloc 2 : Corrigé Associé (URL)</label>
                                <input type="url" id="doc-corr-url" placeholder="Lien URL du corrigé..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                            </div>

                            <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl">Publier avec double bloc</button>
                        </form>
                    </div>
                `;
            }

            if (state.adminSub === 'apk') {
                let apkConfig = DB.get('app_apk_config') || { fileUrl: '', instructions: '' };
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-brands fa-android text-green-500 mr-2"></i>Configuration Fichier APK & Instructions</h3>
                        <form onsubmit="adminSaveApkConfig(event)" class="space-y-3">
                            <input type="url" id="apk-url-inp" value="${apkConfig.fileUrl || ''}" placeholder="Lien URL direct vers le fichier APK..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <textarea id="apk-instructions-inp" class="w-full p-3 bg-stone-900 border rounded-xl text-amber-100 h-32 resize-none" placeholder="Instructions...">${apkConfig.instructions || ''}</textarea>
                            <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl">Enregistrer</button>
                        </form>
                    </div>
                `;
            }

            if (state.adminSub === 'logo') {
                let logoUrl = DB.get('app_logo_url') || '';
                return `
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-image mr-2"></i>Logo du Site</h3>
                        <form onsubmit="adminSaveLogo(event)" class="space-y-3">
                            <input type="url" id="logo-url-inp" value="${logoUrl}" placeholder="https://..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl">Enregistrer</button>
                        </form>
                    </div>
                `;
            }

            return `<div class="dyn-card border p-6 rounded-3xl text-center text-amber-200/50">Sélectionnez une option.</div>`;
        }

        async function adminAdjustPoints(username) {
            let val = parseFloat(document.getElementById(`pts-input-${username}`).value) || 0;
            if (val === 0) return;
            let scores = DB.get('user_scores') || {};
            let monthly = DB.get('monthly_scores') || {};
            scores[username] = (scores[username] || 0) + val;
            monthly[username] = (monthly[username] || 0) + val;
            await DB.set('user_scores', scores);
            await DB.set('monthly_scores', monthly);
            showToast("Points mis à jour !", `Ajustement de ${val} pts pour ${username}.`);
        }

        async function adminApproveQuest(pendId, username, reward) {
            let pending = DB.get('pending_quests') || [];
            let item = pending.find(p => p.id === pendId);
            if (!item) return;

            let scores = DB.get('user_scores') || {};
            let monthly = DB.get('monthly_scores') || {};
            scores[username] = (scores[username] || 0) + reward;
            monthly[username] = (monthly[username] || 0) + reward;
            await DB.set('user_scores', scores);
            await DB.set('monthly_scores', monthly);

            DB.set('pending_quests', pending.filter(p => p.id !== pendId));
            await pushGlobalNotification("⭐ Quête Validée !", `Votre quête "${item.questTitle}" a été validée ! +${reward} pts.`, username);
            showToast("Quête validée !", "Points attribués.");
        }

        async function adminRejectQuest(pendId) {
            let pending = DB.get('pending_quests') || [];
            DB.set('pending_quests', pending.filter(p => p.id !== pendId));
            showToast("Quête rejetée", "");
        }

        async function adminApproveStudentSheet(pendId) {
            let pending = DB.get('pending_revision_sheets') || [];
            let item = pending.find(p => p.id === pendId);
            if (!item) return;

            let pts = parseFloat(document.getElementById(`sheet-pts-${pendId}`).value) || 50;
            let scores = DB.get('user_scores') || {};
            let monthly = DB.get('monthly_scores') || {};
            scores[item.author] = (scores[item.author] || 0) + pts;
            monthly[item.author] = (monthly[item.author] || 0) + pts;
            await DB.set('user_scores', scores);
            await DB.set('monthly_scores', monthly);

            // Ajouter aux fiches de révision publiques
            let sheets = DB.get('revision_sheets') || [];
            sheets.unshift({ title: item.title, subject: item.subject, fileData: item.fileData, fileType: 'url' });
            await DB.set('revision_sheets', sheets);

            DB.set('pending_revision_sheets', pending.filter(p => p.id !== pendId));
            await pushGlobalNotification("📚 Fiche Validée !", `Votre fiche "${item.title}" a été publiée ! +${pts} pts.`, item.author);
            showToast("Fiche validée & publiée !", "");
        }

        async function adminRejectStudentSheet(pendId) {
            let pending = DB.get('pending_revision_sheets') || [];
            DB.set('pending_revision_sheets', pending.filter(p => p.id !== pendId));
            showToast("Fiche rejetée", "");
        }

        async function adminCreateBadge(e) {
            e.preventDefault();
            let name = document.getElementById('b-name').value.trim();
            let emoji = document.getElementById('b-emoji').value.trim();
            let criteria = document.getElementById('b-crit').value.trim();
            let badges = DB.get('badges_config') || [];
            badges.push({ id: 'badge_' + Date.now(), name, emoji, criteria });
            await DB.set('badges_config', badges);
            showToast("Badge créé !", "Attribution automatique programmée.");
        }

        async function adminUploadRevision(e) {
            e.preventDefault();
            let title = document.getElementById('rev-title').value.trim();
            let subject = document.getElementById('rev-subject').value.trim();
            let fileData = document.getElementById('rev-url').value.trim();
            let sheets = DB.get('revision_sheets') || [];
            sheets.unshift({ title, subject, fileData, fileType: 'url' });
            await DB.set('revision_sheets', sheets);
            showToast("Fiche publiée !", "");
        }

        async function adminUploadDoubleBlockDoc(e, targetKey) {
            e.preventDefault();
            let title = document.getElementById('doc-title').value.trim();
            let desc = document.getElementById('doc-desc').value.trim();
            let fileData = document.getElementById('doc-file-url').value.trim();
            let corrData = document.getElementById('doc-corr-url').value.trim();

            let items = DB.get(targetKey) || [];
            items.unshift({
                id: 'doc_' + Date.now(),
                title,
                desc,
                fileData,
                fileType: 'url',
                corrData,
                corrType: 'url'
            });
            await DB.set(targetKey, items);
            showToast("Document publié avec double bloc !", "");
        }

        async function adminSaveApkConfig(e) {
            e.preventDefault();
            let fileUrl = document.getElementById('apk-url-inp').value.trim();
            let instructions = document.getElementById('apk-instructions-inp').value.trim();
            await DB.set('app_apk_config', { fileUrl, instructions });
            showToast("Configuration APK enregistrée !", "");
        }

        async function adminSaveLogo(e) {
            e.preventDefault();
            let logoUrl = document.getElementById('logo-url-inp').value.trim();
            await DB.set('app_logo_url', logoUrl);
            showToast("Logo enregistré !", "");
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if (idx !== -1) {
                users[idx].realName = document.getElementById('s-realname').value;
                users[idx].password = document.getElementById('s-pass').value;
                users[idx].birthDate = document.getElementById('s-bdate').value;
                users[idx].email = document.getElementById('s-email').value;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
