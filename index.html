        function renderAdminUsersWithExport() {
            let users = DB.get('users') || [];
            return `<div class="dyn-card border p-6 rounded-3xl space-y-6"><div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-amber-300 text-sm">Gestion des Comptes</h3><button onclick="exportAllUsersJSON()" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold text-xs">Exporter tout</button></div><form onsubmit="adminCreateUser(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-2"><h4 class="font-bold text-amber-400">Créer un utilisateur</h4><div class="grid grid-cols-1 md:grid-cols-3 gap-2"><input type="text" id="adm-new-user" required placeholder="ID..." class="p-2 bg-stone-950 border rounded-xl text-white"><input type="password" id="adm-new-pass" required placeholder="MDP..." class="p-2 bg-stone-950 border rounded-xl text-white"><select id="adm-new-role" class="p-2 bg-stone-950 border rounded-xl text-white"><option value="student">Élève</option><option value="delegate">Délégué</option><option value="admin">Admin</option></select></div><button type="submit" class="w-full py-2 dyn-btn text-white font-bold rounded-xl">Créer</button></form><div class="space-y-2">${users.map((u, idx) => `<div class="p-3 bg-stone-900 border rounded-xl flex justify-between items-center text-white"><div><span class="font-bold">${u.username}</span> (${u.realName || 'Sans nom'}) - <span class="text-amber-400 font-bold">${u.role}</span></div><div class="flex gap-1 items-center"><input type="text" id="reset_pass_${idx}" placeholder="Nouveau mdp" class="p-1 bg-stone-950 border rounded text-xs w-20 text-white"><button onclick="adminResetPass(${idx})" class="px-2 py-1 bg-sky-600 text-white rounded font-bold text-[10px]">Réinit.</button><select onchange="adminChangeRole(${idx}, this.value)" class="p-1 bg-stone-950 border rounded text-[10px] text-white"><option value="student" ${u.role==='student'?'selected':''}>Élève</option><option value="delegate" ${u.role==='delegate'?'selected':''}>Délégué</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select><button onclick="adminDeleteUser(${idx})" class="px-2 py-1 bg-red-600/30 text-red-300 rounded font-bold text-[10px]"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div></div>`;
        }

        async function adminCreateUser(e) {
            e.preventDefault();
            let users = DB.get('users') || [], username = document.getElementById('adm-new-user').value.trim(), password = document.getElementById('adm-new-pass').value.trim(), role = document.getElementById('adm-new-role').value;
            if (users.some(u => u.username === username)) { alert("Existe déjà."); return; }
            users.push({ username, password, role, status: 'active', mustChangePass: true, realName: username, pseudo: username });
            await DB.set('users', users);
            render();
        }

        async function adminResetPass(idx) {
            let users = DB.get('users') || [], newPass = document.getElementById(`reset_pass_${idx}`).value.trim();
            if (!newPass) return;
            users[idx].password = newPass; users[idx].mustChangePass = true;
            await DB.set('users', users);
            showToast("MDP réinitialisé", "");
        }

        async function adminChangeRole(idx, newRole) {
            let users = DB.get('users') || [];
            users[idx].role = newRole;
            await DB.set('users', users);
            render();
        }

        async function adminDeleteUser(idx) {
            let users = DB.get('users') || [];
            if (users[idx].username === 'Charlesadmin') return;
            if (!confirm("Supprimer ?")) return;
            users.splice(idx, 1);
            await DB.set('users', users);
            render();
        }

        function downloadJSON(filename, data) {
            let blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            let url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
        }

        function exportAllUsersJSON() { downloadJSON('LEQG_Comptes.json', DB.get('users') || []); }

        function renderAdminQuizzes() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4 text-white"><h3 class="font-bold text-amber-300">Création de Quiz</h3><form onsubmit="createQuiz(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-3"><input type="text" id="qz-title" required placeholder="Titre..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><div id="qz-questions-container" class="space-y-3"><div class="p-3 bg-stone-950 rounded-xl border space-y-2"><input type="text" placeholder="Question..." class="q-text w-full p-2 bg-stone-900 border rounded-xl text-white" required><input type="text" placeholder="Option 1" class="q-opt-0 w-full p-1.5 bg-stone-900 border rounded text-white" required><input type="text" placeholder="Option 2" class="q-opt-1 w-full p-1.5 bg-stone-900 border rounded text-white" required><select class="q-correct w-full p-2 bg-stone-900 border rounded-xl text-amber-300"><option value="0">Option 1</option><option value="1">Option 2</option></select></div></div><button type="button" onclick="addQuizQuestionField()" class="px-3 py-1.5 bg-stone-800 text-amber-300 rounded-xl font-bold">+ Question</button><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier</button></form></div>`;
        }

        function addQuizQuestionField() {
            let container = document.getElementById('qz-questions-container');
            let div = document.createElement('div');
            div.className = 'p-3 bg-stone-950 rounded-xl border space-y-2';
            div.innerHTML = `<input type="text" placeholder="Question..." class="q-text w-full p-2 bg-stone-900 border rounded-xl text-white" required><input type="text" placeholder="Option 1" class="q-opt-0 w-full p-1.5 bg-stone-900 border rounded text-white" required><input type="text" placeholder="Option 2" class="q-opt-1 w-full p-1.5 bg-stone-900 border rounded text-white" required><select class="q-correct w-full p-2 bg-stone-900 border rounded-xl text-amber-300"><option value="0">Option 1</option><option value="1">Option 2</option></select>`;
            container.appendChild(div);
        }

        async function createQuiz(e) {
            e.preventDefault();
            let title = document.getElementById('qz-title').value;
            let qBlocks = document.querySelectorAll('#qz-questions-container > div'), questions = [];
            qBlocks.forEach(block => {
                let question = block.querySelector('.q-text').value;
                let options = [block.querySelector('.q-opt-0').value, block.querySelector('.q-opt-1').value].filter(Boolean);
                let correct = block.querySelector('.q-correct').value;
                questions.push({ question, options, correct });
            });
            let quizzes = DB.get('quizzes') || [];
            quizzes.push({ id: Date.now(), title, questions });
            await DB.set('quizzes', quizzes);
            showToast("Quiz publié !", "");
            render();
        }

        function renderAdminDocsCategorized() {
            let sheets = DB.get('revision_sheets') || [];
            return `<div class="dyn-card border p-6 rounded-3xl space-y-6 text-white"><h3 class="font-bold text-amber-300 text-sm">Publication de Documents & Corrigés</h3><form onsubmit="adminUploadCategorizedDoc(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-3"><input type="text" id="cat-doc-title" required placeholder="Titre..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><select id="cat-doc-type" required class="p-2.5 bg-stone-950 border rounded-xl text-white"><option value="Fiche de Révision">Fiche de Révision</option><option value="Sujet Type Bac">Sujet Type Bac</option><option value="Fiche d'Exercices">Fiche d'Exercices</option><option value="Corrigé d'Exercices">Corrigé d'Exercices</option><option value="Corrigé Type Bac">Corrigé Type Bac</option></select><input type="file" id="cat-doc-file" accept=".pdf,image/*" required class="p-2 bg-stone-950 border rounded-xl text-xs text-white"></div><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier</button></form><div class="space-y-2">${sheets.map((d, idx) => `<div class="p-3 bg-stone-900 border rounded-xl flex justify-between items-center"><div><span class="font-bold">${d.title}</span> <span class="ml-2 px-2 py-0.5 bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded">${d.category}</span></div><button onclick="adminDeleteDoc(${idx})" class="px-2.5 py-1 bg-red-600/30 text-red-300 rounded"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div></div>`;
        }

        async function adminUploadCategorizedDoc(e) {
            e.preventDefault();
            let title = document.getElementById('cat-doc-title').value, category = document.getElementById('cat-doc-type').value, file = document.getElementById('cat-doc-file').files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = async (ev) => {
                    let sheets = DB.get('revision_sheets') || [];
                    sheets.push({ title, category, fileData: ev.target.result, fileType: file.type });
                    await DB.set('revision_sheets', sheets);
                    showToast("Publié !", "");
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        async function adminDeleteDoc(idx) {
            let sheets = DB.get('revision_sheets') || [];
            sheets.splice(idx, 1);
            await DB.set('revision_sheets', sheets);
            render();
        }

        function renderAdminPolls() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4 text-white"><h3 class="font-bold text-amber-300">Sondage Éclair</h3><form onsubmit="adminCreatePoll(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-3"><input type="text" id="poll-q" required placeholder="Question..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><div id="poll-options-container" class="space-y-2"><input type="text" placeholder="Option 1" class="poll-opt w-full p-2 bg-stone-950 border rounded-xl text-white" required><input type="text" placeholder="Option 2" class="poll-opt w-full p-2 bg-stone-950 border rounded-xl text-white" required></div><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Lancer</button></form></div>`;
        }

        async function adminCreatePoll(e) {
            e.preventDefault();
            let question = document.getElementById('poll-q').value, options = Array.from(document.querySelectorAll('.poll-opt')).map(i => i.value).filter(Boolean);
            let polls = DB.get('polls') || [];
            polls.unshift({ id: Date.now(), question, options, results: {}, voters: [] });
            await DB.set('polls', polls);
            showToast("Sondage lancé !", "");
            render();
        }

        function renderAdminFormations() {
            let list = DB.get('formations') || [];
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4 text-white"><h3 class="font-bold text-amber-300">Formations Post-Bac</h3><form onsubmit="adminAddFormation(event)" class="p-4 bg-stone-900 rounded-2xl border space-y-3"><input type="text" id="fm-title" required placeholder="Intitulé..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><div class="grid grid-cols-1 md:grid-cols-3 gap-2"><input type="text" id="fm-est" required placeholder="Établissement..." class="p-2.5 bg-stone-950 border rounded-xl text-white"><input type="text" id="fm-city" required placeholder="Ville..." class="p-2.5 bg-stone-950 border rounded-xl text-white"><select id="fm-type" class="p-2.5 bg-stone-950 border rounded-xl text-white"><option value="Initial">Initial</option><option value="Alternance">Alternance</option><option value="Apprentissage">Apprentissage</option></select></div><textarea id="fm-desc" required placeholder="Description..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-white h-20"></textarea><input type="url" id="fm-link" placeholder="Lien web (https://...)" class="w-full p-2.5 bg-stone-950 border rounded-xl text-white"><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Ajouter</button></form><div class="space-y-2">${list.map((f, idx) => `<div class="p-3 bg-stone-900 border rounded-xl flex justify-between items-center"><div><span class="font-bold">${f.title}</span> (${f.establishment} - ${f.city})</div><button onclick="adminDeleteFormation(${idx})" class="px-2.5 py-1 bg-red-600/30 text-red-300 rounded"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div></div>`;
        }

        async function adminAddFormation(e) {
            e.preventDefault();
            let list = DB.get('formations') || [];
            list.push({ title: document.getElementById('fm-title').value, establishment: document.getElementById('fm-est').value, city: document.getElementById('fm-city').value, type: document.getElementById('fm-type').value, desc: document.getElementById('fm-desc').value, link: document.getElementById('fm-link').value });
            await DB.set('formations', list);
            render();
        }

        async function adminDeleteFormation(idx) {
            let list = DB.get('formations') || [];
            list.splice(idx, 1);
            await DB.set('formations', list);
            render();
        }

        function renderAdminAppreciations() {
            let users = DB.get('users') || [], allApps = DB.get('appreciations') || {};
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4 text-white"><h3 class="font-bold text-amber-300">Appréciations</h3><div class="space-y-3">${users.map(u => { let app = allApps[u.username] || { t1: '', t2: '', t3: '', published: false }; return `<div class="p-4 bg-stone-900 border rounded-2xl space-y-2"><div class="flex justify-between items-center"><span class="font-bold">${u.pseudo || u.username}</span><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${app.published ? 'checked' : ''} onchange="toggleAppPub('${u.username}', this.checked)" class="w-4 h-4 accent-amber-600"><span class="text-xs font-bold">Publier</span></label></div><div class="grid grid-cols-1 md:grid-cols-3 gap-2"><input type="text" id="app_t1_${u.username}" value="${app.t1}" placeholder="T1" oninput="saveAppInput('${u.username}')" class="p-2 bg-stone-950 border rounded-xl text-white text-xs"><input type="text" id="app_t2_${u.username}" value="${app.t2}" placeholder="T2" oninput="saveAppInput('${u.username}')" class="p-2 bg-stone-950 border rounded-xl text-white text-xs"><input type="text" id="app_t3_${u.username}" value="${app.t3}" placeholder="T3" oninput="saveAppInput('${u.username}')" class="p-2 bg-stone-950 border rounded-xl text-white text-xs"></div></div>`; }).join('')}</div></div>`;
        }

        async function saveAppInput(username) {
            let allApps = DB.get('appreciations') || {};
            if (!allApps[username]) allApps[username] = { t1: '', t2: '', t3: '', published: false };
            allApps[username].t1 = document.getElementById(`app_t1_${username}`).value;
            allApps[username].t2 = document.getElementById(`app_t2_${username}`).value;
            allApps[username].t3 = document.getElementById(`app_t3_${username}`).value;
            await DB.set('appreciations', allApps);
        }

        async function toggleAppPub(username, published) {
            let allApps = DB.get('appreciations') || {};
            if (!allApps[username]) allApps[username] = { t1: '', t2: '', t3: '', published: false };
            allApps[username].published = published;
            await DB.set('appreciations', allApps);
        }

        function renderAdminThemeFull() {
            let t = DB.get('site_theme') || {};
            return `<div class="dyn-card border p-6 rounded-3xl space-y-6 text-white">
                <h3 class="font-bold text-amber-300">Thème & Saisons</h3>
                <select id="theme-preset" onchange="saveThemePreset(this.value)" class="w-full p-2 bg-stone-900 border rounded-xl text-white">
                    <option value="standard" ${t.preset==='standard'?'selected':''}>Standard</option>
                    <option value="noel" ${t.preset==='noel'?'selected':''}>🎄 Noël (Cadeaux)</option>
                    <option value="halloween" ${t.preset==='halloween'?'selected':''}>🎃 Halloween (Citrouilles)</option>
                    <option value="paques" ${t.preset==='paques'?'selected':''}>🥚 Pâques (Œufs)</option>
                    <option value="automne" ${t.preset==='automne'?'selected':''}>🍂 Automne (Feuilles)</option>
                </select>

                <div class="border-t border-amber-900/40 pt-4 space-y-3">
                    <h3 class="font-bold text-amber-300">Configuration App Mobile & Procédure</h3>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold">Fichier de l'application (.apk, .zip, etc.) :</label>
                        <input type="file" id="admin-app-file" class="w-full p-2 bg-stone-900 border rounded-xl text-xs text-white">
                        <button onclick="uploadAppFile()" class="px-4 py-2 dyn-btn text-white rounded-xl font-bold">Uploader le fichier App</button>
                    </div>
                    <div class="space-y-2 pt-2">
                        <label class="block text-xs font-bold">Procédure d'installation (texte affiché dans la modale) :</label>
                        <textarea id="admin-app-proc" class="w-full p-3 bg-stone-900 border rounded-xl text-white h-24 text-xs">${DB.get('app_install_procedure') || ''}</textarea>
                        <button onclick="saveAppProc()" class="px-4 py-2 dyn-btn text-white rounded-xl font-bold">Enregistrer la procédure</button>
                    </div>
                </div>
            </div>`;
        }

        async function saveThemePreset(preset) {
            let t = DB.get('site_theme') || {};
            t.preset = preset;
            await DB.set('site_theme', t);
            render();
        }

        async function uploadAppFile() {
            let file = document.getElementById('admin-app-file').files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = async (ev) => {
                    await DB.set('app_download_file', ev.target.result);
                    showToast("Fichier App uploadé !", "");
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveAppProc() {
            let text = document.getElementById('admin-app-proc').value;
            await DB.set('app_install_procedure', text);
            showToast("Procédure enregistrée !", "");
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim(), p = document.getElementById('l-pass').value.trim();
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if (idx !== -1) {
                if (user.role === 'admin') {
                    let newUsername = document.getElementById('s-username').value.trim();
                    if (newUsername) users[idx].username = newUsername;
                }
                users[idx].realName = document.getElementById('s-lastname').value;
                users[idx].birthDate = document.getElementById('s-birth').value;
                users[idx].password = document.getElementById('s-pass').value;
                users[idx].pseudo = document.getElementById('s-pseudo').value;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
