<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(12, 12, 12, 0.95);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
        .seasonal-particle {
            position: fixed;
            top: -5vh;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            animation: fall linear infinite;
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden transition-all duration-500">

    <div id="seasonal-particles-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 bg-black/75 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26' }
            ],
            messages: [],
            ideas_board: [],
            polls: [],
            quizzes: [],
            quiz_submissions: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            tickets: [],
            appreciations: {},
            flashcards_decks: [],
            personal_notes: {},
            app_notifications: [],
            moods: {},
            user_scores: {},
            home_qr_image: '',
            hidden_tabs: [],
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)', bgUrl: '' },
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' }
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                await db.collection("leqg_data").doc(k).set({ value: val });
                applyTheme();
                render();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeConvFilter: null,
            gameFilter: 'all',
            activeDeckId: null,
            activeNoteId: null,
            aiMessages: [{ sender: 'ai', text: 'Bonjour ! Je suis ton Tuteur IA spécialisé en Droit, Économie, Gestion et Commerce. Pose-moi tes questions de révision pour le Bac Pro MCV !' }]
        };

        const PLAYABLE_GAMES = [
            { id: 'chef_rayon', name: 'Chef de Rayon MCV', cat: 'ludo', icon: 'fa-boxes-packing', desc: 'Implantation des produits selon le merchandising.', rules: '<b>But :</b> Placer chaque article au bon niveau du linéaire.', type: 'chef_rayon' },
            { id: 'demineur_juridique', name: 'Démineur Juridique', cat: 'ludo', icon: 'fa-scale-balanced', desc: 'Identifier les clauses légales vs abusives.', rules: '<b>But :</b> Analyser des clauses de contrats de travail.', type: 'quiz' },
            { id: 'calcul_marge', name: 'Calculateur de Marge', cat: 'ludo', icon: 'fa-calculator', desc: 'Maîtriser les indicateurs commerciaux.', rules: '<b>But :</b> Calculer prix de vente, coût d\'achat et marge.', type: 'quiz' },
            { id: 'clicker_caisse', name: 'Clicker du Vendeur Rapide', cat: 'chill', icon: 'fa-hand-pointer', desc: 'Encaisse le maximum d\'articles en 15 secondes !', rules: '<b>But :</b> Cliquer frénétiquement pour encaisser.', type: 'clicker' }
        ];

        async function init() {
            try {
                let userDoc = await db.collection("leqg_data").doc("users").get();
                if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                    for (let k of Object.keys(cloudData)) {
                        await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                    }
                } else {
                    for (let k of Object.keys(cloudData)) {
                        let doc = await db.collection("leqg_data").doc(k).get();
                        if (doc.exists) cloudData[k] = doc.data().value;
                    }
                }
            } catch(e) {
                console.error("Erreur Firebase :", e);
            }
            applyTheme();
            checkBirthdays();
            render();
        }

        function checkBirthdays() {
            let users = DB.get('users') || [];
            let today = new Date().toISOString().slice(5, 10);
            let checkedKey = 'leqg_bday_checked_' + today;
            if (sessionStorage.getItem(checkedKey)) return;

            let adminUser = users.find(u => u.username === 'Charlesadmin');
            users.forEach(u => {
                if (u.birthDate && u.birthDate.slice(5, 10) === today) {
                    pushGlobalNotification("🎂 Anniversaire !", `C'est l'anniversaire de ${u.pseudo || u.username} aujourd'hui !`, adminUser ? adminUser.username : null);
                }
            });
            sessionStorage.setItem(checkedKey, 'true');
        }

        function applyTheme() {
            let t = DB.get('site_theme') || { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(12, 12, 12, 0.95)', borderColor: 'rgba(245, 158, 11, 0.4)' };
            document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', t.borderColor);

            let body = document.getElementById('body-theme');
            if (t.bgUrl) body.style.backgroundImage = `url('${t.bgUrl}')`;
            else body.style.backgroundImage = 'none';

            generateSeasonalParticles(t.preset);
        }

        function generateSeasonalParticles(preset) {
            let container = document.getElementById('seasonal-particles-container');
            container.innerHTML = '';
            let items = [];

            if (preset === 'noel') items = ['🎄', '🎁', '❄️', '🔴', '⛄'];
            else if (preset === 'halloween') items = ['🎃', '🧙‍♀️', '💀', '🦇', '👻'];
            else if (preset === 'ete') items = ['🏖️', '☀️', '🌊', '🍦', '🌴'];
            else if (preset === 'automne') items = ['🍂', '🍁', '🌰', '🌾'];
            else if (preset === 'hiver') items = ['❄️', '🌨️', '🧊'];
            else if (preset === 'printemps') items = ['🌸', '🌺', '🌼', '🥚', '🦋'];

            if (items.length === 0) return;

            for (let i = 0; i < 25; i++) {
                let el = document.createElement('div');
                el.className = 'seasonal-particle';
                el.textContent = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (5 + Math.random() * 7) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                el.style.fontSize = (16 + Math.random() * 20) + 'px';
                container.appendChild(el);
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        
        async function pushGlobalNotification(title, message, targetUsername = null) {
            let notifs = DB.get('app_notifications') || [];
            notifs.unshift({
                title, message,
                target: targetUsername || 'all',
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            });
            await DB.set('app_notifications', notifs);
            showToast(title, message);
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 4000);
        }

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>
                    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                        <input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button>
                    </form>
                </div>
            </div>`;
        }

        function renderSetup(user) {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs">
                    <h1 class="text-base font-bold text-amber-400">Première connexion - Sécurité Obligatoire</h1>
                    <p class="text-amber-200/70 text-[11px]">Veuillez modifier votre mot de passe provisoire et renseigner vos informations.</p>
                    <form onsubmit="saveSetup(event)" class="space-y-3">
                        <div><label class="block font-bold text-amber-300">Nom & Prénom réels *</label><input type="text" id="s-realname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>
                        <div><label class="block font-bold text-amber-300">Nouveau Mot de passe *</label><input type="password" id="s-pass" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white" placeholder="Nouveau mot de passe"></div>
                        <div><label class="block font-bold text-amber-300">Date de naissance *</label><input type="date" id="s-bdate" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>
                        <div><label class="block font-bold text-amber-300">Adresse e-mail (facultative)</label><input type="email" id="s-email" value="${user.email || ''}" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white" placeholder="votre.email@exemple.com"></div>
                        <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Valider et Entrer sur LE QG</button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboard(user) {
            let canAccessAdmin = user.role === 'admin' || user.role === 'delegate';
            let hidden = DB.get('hidden_tabs') || [];
            let notifs = DB.get('app_notifications') || [];
            let unreadCount = notifs.filter(n => n.target === 'all' || n.target === user.username).length;

            return `
                <header class="bg-stone-950/90 border-b border-amber-900/40 px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2">
                            ${renderAvatarBadge(user)}
                            <div>
                                <div class="font-black text-amber-400 text-xs">${user.pseudo || user.username}</div>
                                <div class="text-[9px] text-amber-200/60">${user.realName || user.username}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="state.tab='notifs';render()" class="relative p-2 bg-stone-900 border border-amber-900/40 text-amber-400 rounded-xl hover:border-amber-500 transition">
                            <i class="fa-solid fa-bell text-sm"></i>
                            ${unreadCount > 0 ? `<span class="absolute -top-1 -right-1 bg-amber-500 text-stone-950 text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">${unreadCount}</span>` : ''}
                        </button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border">Déconnexion</button>
                    </div>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-64 bg-stone-950/95 border-r transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-4 pt-16 space-y-1 text-xs overflow-y-auto">
                        ${!hidden.includes('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                        ${!hidden.includes('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'file-contract') : ''}
                        ${!hidden.includes('mood') ? sbBtn('mood', 'Mur des Humeurs', 'face-smile') : ''}
                        ${!hidden.includes('notifs') ? sbBtn('notifs', 'Centre Notifications', 'bell') : ''}
                        ${!hidden.includes('polls') ? sbBtn('polls', 'Sondages en Direct', 'square-poll-vertical') : ''}
                        ${!hidden.includes('games') ? sbBtn('games', 'Espace Arcade & Jeux', 'gamepad') : ''}
                        ${!hidden.includes('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                        ${!hidden.includes('exams') ? sbBtn('exams', 'Sujets & Corrigés Bac', 'file-pdf') : ''}
                        ${!hidden.includes('formations') ? sbBtn('formations', 'Orientation & Post-Bac', 'graduation-cap') : ''}
                        ${!hidden.includes('ideas') ? sbBtn('ideas', 'Boîte à Idées (Vote 48h)', 'lightbulb') : ''}
                        ${!hidden.includes('flashcards') ? sbBtn('flashcards', 'Flashcards Mémoire', 'clone') : ''}
                        ${!hidden.includes('notes') ? sbBtn('notes', 'Traitement de Texte (Notes)', 'file-lines') : ''}
                        ${!hidden.includes('bac_sim') ? sbBtn('bac_sim', 'Simulateur Bac Complet', 'calculator') : ''}
                        ${!hidden.includes('ai_tuteur') ? sbBtn('ai_tuteur', 'Tuteur IA', 'robot') : ''}
                        ${!hidden.includes('leaderboard') ? sbBtn('leaderboard', 'Classement Classe', 'trophy') : ''}
                        ${!hidden.includes('chat') ? sbBtn('chat', 'Messagerie & Canal', 'comments') : ''}
                        ${!hidden.includes('tickets') ? sbBtn('tickets', 'Support & Mails', 'envelope') : ''}
                        ${!hidden.includes('profile') ? sbBtn('profile', 'Mon Profil & Avatar', 'user-astronaut') : ''}
                        ${canAccessAdmin ? sbBtn('admin', 'Espace Délégué / Admin', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 md:p-6">${renderContent(user)}</main>
                </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon} w-4"></i> ${label}</button>`;
        }

        function renderContent(user) {
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'mood') return renderMoodTab(user);
            if (state.tab === 'notifs') return renderNotifsSection(user);
            if (state.tab === 'polls') return renderPollsTab(user);
            if (state.tab === 'games') return renderGamesSection();
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', DB.get('revision_sheets') || []);
            if (state.tab === 'exams') return renderDocPage('Sujets & Corrigés Bac', DB.get('exam_subjects') || []);
            if (state.tab === 'formations') return renderFormationsTab(user);
            if (state.tab === 'ideas') return renderIdeasPage(user);
            if (state.tab === 'flashcards') return renderFlashcardsTab(user);
            if (state.tab === 'notes') return renderNotesTab(user);
            if (state.tab === 'bac_sim') return renderBacSimTab(user);
            if (state.tab === 'ai_tuteur') return renderAiTuteurSection();
            if (state.tab === 'leaderboard') return renderLeaderboardSection(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'tickets') return renderTicketsTab(user);
            if (state.tab === 'profile') return renderProfileTab(user);
            if (state.tab === 'admin' && (user.role === 'admin' || user.role === 'delegate')) return renderAdmin();
            return '';
        }

        function renderHome() {
            let countdown = DB.get('countdown') || { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' };
            let diffDays = Math.ceil((new Date(countdown.date) - new Date()) / (1000 * 60 * 60 * 24));
            let qrCodeImg = DB.get('home_qr_image') || '';

            return `<div class="max-w-3xl mx-auto space-y-6 text-center">
                <div class="dyn-card border p-8 space-y-3 rounded-3xl shadow-2xl">
                    <h2 class="text-3xl font-black text-amber-400">⏳ ${countdown.title}</h2>
                    <div class="text-4xl font-extrabold text-white mt-2">${diffDays >= 0 ? diffDays + ' jours restants !' : 'Événement passé'}</div>
                </div>

                ${qrCodeImg ? `
                    <div class="dyn-card border p-6 rounded-3xl space-y-3 flex flex-col items-center">
                        <h3 class="font-black text-amber-400 text-sm"><i class="fa-solid fa-qrcode mr-2"></i>QR Code Officiel de la Classe</h3>
                        <img src="${qrCodeImg}" class="w-48 h-48 object-contain rounded-2xl border-2 border-amber-500/40 p-2 bg-white">
                    </div>
                ` : ''}

                <div class="dyn-card border p-8 space-y-3 rounded-3xl">
                    <h2 class="text-2xl font-black text-white">Bienvenue sur LE QG</h2>
                    <p class="text-xs text-amber-200/75">Plateforme collaborative Terminale Bac Pro MCV.</p>
                </div>
            </div>`;
        }

        // --- MUR DES HUMEURS ---
        function renderMoodTab(user) {
            let moods = DB.get('moods') || {};
            let emojis = ['😀', '🚀', '💡', '🔥', '😴', '🧠', '🎯', '☕', '😎', '📚'];
            return `<div class="max-w-2xl mx-auto space-y-4 text-xs">

            let polls = DB.get('polls') || [];

                        let isExpired = new Date(p.expiresAt) < now;
                        let hasVoted = p.voters && p.voters.includes(user.username);
                        let totalVotes = p.options.reduce((sum, opt) => sum + (opt.votes || 0), 0);

                        return `

                                </div>
                                <div class="space-y-2">
                                    ${p.options.map((opt, oIdx) => {
                                        let pct = totalVotes > 0 ? Math.round(((opt.votes || 0) / totalVotes) * 100) : 0;

                                            <div class="p-3 bg-stone-900 rounded-xl border space-y-1">
                                                <div class="flex justify-between items-center font-bold text-amber-100">

                                                </div>

                            </div>
                        `;
                    }).join('')}
                </div>

        async function votePoll(pollIdx, optIdx) {
            let user = getCurrentUser();
            let polls = DB.get('polls') || [];
            if (!polls[pollIdx].voters) polls[pollIdx].voters = [];
            if (polls[pollIdx].voters.includes(user.username)) return;

            polls[pollIdx].voters.push(user.username);
            if (!polls[pollIdx].options[optIdx].votes) polls[pollIdx].options[optIdx].votes = 0;
            polls[pollIdx].options[optIdx].votes++;

            await DB.set('polls', polls);
            showToast("Vote enregistré !", "Merci d'avoir participé au sondage.");

        function renderBacSimTab(user) {

                    <div class="space-y-2 max-h-72 overflow-y-auto pr-2" id="sim-matieres-list">
                        ${[
                            { name: 'Épreuve E1 - Économie - Droit & Gestion', coef: 4 },
                            { name: 'Épreuve E2 - Analyse et résolution de situations professionnelles', coef: 7 },
                            { name: 'Épreuve E3 - Pratique professionnelle', coef: 9 },
                            { name: 'Français / Histoire - Géographie / EMC', coef: 5 },
                            { name: 'Langue Vivante (Anglais)', coef: 2 },
                            { name: 'Mathématiques - Sciences physiques et chimiques', coef: 3 },
                            { name: 'Arts appliqués et cultures artistiques', coef: 1 },
                            { name: 'Éducation Physique et Sportive (EPS)', coef: 1 },
                            { name: 'Prévention Santé Environnement (PSE)', coef: 1 }
                        ].map(m => `
                            <div class="grid grid-cols-3 gap-2 p-3 bg-stone-900 rounded-xl border items-center">
                                <span class="col-span-2 font-bold text-amber-100">${m.name} (Coef. ${m.coef})</span>
                                <input type="number" step="0.5" min="0" max="20" placeholder="Note /20" data-coef="${m.coef}" class="p-2 bg-stone-950 border rounded-xl text-amber-300 font-bold sim-input" value="12">
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="calculateFullBacAverage()" class="w-full py-3 dyn-btn text-white font-bold rounded-xl text-sm">Calculer ma Moyenne Générale & Mention</button>

                <div id="sim-full-result" class="hidden dyn-card border p-6 rounded-3xl text-center space-y-2"></div>
            </div>`;
        }

        function calculateFullBacAverage() {
            let inputs = document.querySelectorAll('.sim-input');
            let totalWeighted = 0, totalCoef = 0;
            inputs.forEach(i => {
                let note = parseFloat(i.value) || 0;
                let coef = parseFloat(i.getAttribute('data-coef')) || 1;
                totalWeighted += note * coef;
                totalCoef += coef;
            });
            let avg = (totalWeighted / totalCoef).toFixed(2);
            let mention = avg >= 16 ? 'Très Bien 🏆' : avg >= 14 ? 'Bien 🌟' : avg >= 12 ? 'Assez Bien 👍' : avg >= 10 ? 'Admis (Sans mention) ✅' : 'Refusé ❌';
            let resDiv = document.getElementById('sim-full-result');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `<h3 class="text-lg font-black text-amber-400">Résultat de la simulation</h3><div class="text-3xl font-extrabold text-white mt-1">${avg} / 20</div><p class="text-sm font-bold text-amber-300 mt-2">Mention : ${mention}</p>`;
        }

        async function sendAiMessage(e) {
            e.preventDefault();
            let inp = document.getElementById('ai-inp');
            let txt = inp.value.trim();

            state.aiMessages.push({ sender: 'user', text: txt });
            inp.value = '';

                                <input type="file" id="rev-file" class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100 text-xs">
                                <input type="url" id="rev-url" placeholder="Ou lien URL externe..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                                <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier la Fiche de Révision</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            return `<div class="dyn-card border p-6 rounded-3xl text-center text-amber-200/50">Sélectionnez un onglet dans le panneau administration.</div>`;
        }

        async function saveAppreciation(username, tKey) {
            let text = document.getElementById(`app-${username}-${tKey}`).value;
            let apps = DB.get('appreciations') || {};
            if (!apps[username]) apps[username] = {};
            if (!apps[username][tKey]) apps[username][tKey] = { text: '', published: false };

            apps[username][tKey].text = text;
            await DB.set('appreciations', apps);
            showToast("Appréciation enregistrée !", `Trimestre ${tKey} mis à jour pour ${username}.`);
        }

        async function togglePublishAppreciation(username, tKey) {
            let apps = DB.get('appreciations') || {};
            if (!apps[username]) apps[username] = {};
            if (!apps[username][tKey]) apps[username][tKey] = { text: '', published: false };

            apps[username][tKey].published = !apps[username][tKey].published;
            await DB.set('appreciations', apps);
            showToast("Statut de publication modifié", "");
            render();
        }

        async function setThemePreset(preset, btnColor, cardBg, borderColor, bgUrl) {
            await DB.set('site_theme', { preset, btnColor, cardBg, borderColor, bgUrl });
            showToast("Thème appliqué !", "Le décor et les animations saisonnières sont actifs.");
        }

        function renderDocPage(t, items) {
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-book-open mr-2"></i>${t}</h2></div>
                <div class="space-y-3">
                    ${items.map(i => `<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center"><span class="font-bold text-amber-100">${i.title}</span><button onclick="openFileViewer('${i.title}', '${i.fileData}', '${i.fileType}')" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Consulter</button></div>`).join('')}
                </div>
            </div>`;
        }

        async function adminUploadExam(e) {
            e.preventDefault();
            let title = document.getElementById('ex-title').value;
            let file = document.getElementById('ex-file').files[0];
            let url = document.getElementById('ex-url').value;
            let fileData = url;
            if (file) { fileData = await new Promise(res => { let r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); }); }
            let subjects = DB.get('exam_subjects') || [];
            subjects.push({ title, fileData, fileType: file ? file.type : 'url' });
            await DB.set('exam_subjects', subjects);
            showToast("Sujet Bac publié !", "");
        }

        async function adminUploadRevision(e) {
            e.preventDefault();
            let title = document.getElementById('rev-title').value;
            let file = document.getElementById('rev-file').files[0];
            let url = document.getElementById('rev-url').value;
            let fileData = url;
            if (file) { fileData = await new Promise(res => { let r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); }); }
            let sheets = DB.get('revision_sheets') || [];
            sheets.push({ title, fileData, fileType: file ? file.type : 'url' });
            await DB.set('revision_sheets', sheets);
            showToast("Fiche publiée !", "");
        }

        async function adminCreateUser(e) {
            e.preventDefault();
            let username = document.getElementById('uc-user').value.trim();
            let password = document.getElementById('uc-pass').value.trim();
            let role = document.getElementById('uc-role').value;
            let users = DB.get('users') || [];
            if (users.some(u => u.username === username)) return alert("Identifiant existant");
            users.push({ username, password, role, status: 'active', mustChangePass: true, realName: username, pseudo: username });
            await DB.set('users', users);
            showToast("Compte créé !", "");
        }

        async function adminChangeRole(username, newRole) {
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.role = newRole; await DB.set('users', users); showToast("Rôle mis à jour", ""); }
        }

        async function adminResetPassword(username) {
            let newPass = prompt("Nouveau mot de passe provisoire :");
            if (!newPass) return;
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.password = newPass; u.mustChangePass = true; await DB.set('users', users); showToast("MDP réinitialisé", ""); }
        }

        async function adminToggleSuspend(username) {
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.status = u.status === 'masked' ? 'active' : 'masked'; await DB.set('users', users); render(); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if (idx !== -1) {
                users[idx].realName = document.getElementById('s-realname').value;
                users[idx].password = document.getElementById('s-pass').value;
                users[idx].birthDate = document.getElementById('s-bdate').value;
                users[idx].email = document.getElementById('s-email').value;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
