<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.6; }
        }
        .deco-item {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 5;
            animation: fall linear infinite;
        }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden">

    <div id="custom-bg-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>
    <div id="theme-decorations" class="fixed inset-0 z-5 pointer-events-none overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Modale Centre de Notifications -->
    <div id="notifications-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-lg dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4 max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 class="font-black text-base text-amber-400 flex items-center gap-2"><i class="fa-solid fa-bell"></i> Centre de Notifications</h3>
                <div class="flex gap-2">
                    <button onclick="clearAllNotifications()" class="px-3 py-1 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold">Tout effacer</button>
                    <button onclick="toggleModal('notifications-modal', false)" class="text-amber-200/70 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="notifications-list-container" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch(e) { console.error(e); }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26' }
            ],
            messages: [],
            ideas_board: [],
            quizzes: [],
            quiz_submissions: {},
            appreciations: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            tickets: [],
            polls: [],
            calendar_events: [],
            custom_pages: [],
            hidden_tabs: [],
            orientation_models: [],
            app_notifications: [],
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' },
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)', bgMedia: '', mode: 'dark' },
            home_qr_image: ''
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                if (db) {
                    try { await db.collection("leqg_data").doc(k).set({ value: val }); } catch(err) { console.error(err); }
                }
                applyTheme();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeQuizId: null,
            activeFcDeck: null,
            playingFcIndex: 0,
            formationSearch: '',
            formationTypeFilter: 'all',
            formationCityFilter: 'all',
            editingDocIndex: null
        };

        async function init() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
            if (db) {
                try {
                    let userDoc = await db.collection("leqg_data").doc("users").get();
                    if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                        const keys = Object.keys(cloudData);
                        for (let k of keys) {
                            await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                        }
                    } else {
                        // Nettoyage automatique des deux pages demandées
                        let cpDoc = await db.collection("leqg_data").doc("custom_pages").get();
                        if (cpDoc.exists) {
                            let pages = cpDoc.data().value || [];
                            pages = pages.filter(p => !p.title.toLowerCase().includes('qr') && !p.title.toLowerCase().includes('badge') && !p.title.toLowerCase().includes('toutou'));
                            cloudData.custom_pages = pages;
                            await db.collection("leqg_data").doc("custom_pages").set({ value: pages });
                        }

                        const keys = Object.keys(cloudData);
                        for (let k of keys) {
                            let doc = await db.collection("leqg_data").doc(k).get();
                            if (doc.exists) cloudData[k] = doc.data().value;
                        }
                    }
                } catch(e) { console.error(e); }
            }
            applyTheme();
            render();

            setInterval(async () => {
                if (db && getCurrentUser()) {
                    try {
                        const keys = Object.keys(cloudData);
                        let updated = false;
                        for (let k of keys) {
                            let doc = await db.collection("leqg_data").doc(k).get();
                            if (doc.exists && JSON.stringify(doc.data().value) !== JSON.stringify(cloudData[k])) {
                                cloudData[k] = doc.data().value;
                                updated = true;
                            }
                        }
                        if (updated) {
                            updateNotificationsModalContent(getCurrentUser());
                        }
                    } catch(e){}
                }
            }, 6000);
        }

        async function pushNotification(title, message, targetRole = 'all') {
            let notifs = DB.get('app_notifications') || [];
            notifs.unshift({
                id: Date.now(),
                title,
                message,
                targetRole,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString(),
                read: false
            });
            if (notifs.length > 50) notifs = notifs.slice(0, 50);
            await DB.set('app_notifications', notifs);
            showToast(title, message);

            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, {
                        body: message,
                        icon: "https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&q=80&w=120"
                    });
                } catch(err) { console.error(err); }
            }
        }

        async function clearAllNotifications() {
            await DB.set('app_notifications', []);
            showToast("Notifications", "Le centre de notifications a été vidé.");
        }

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                let choiceResult = await deferredPrompt.userChoice;
                if (choiceResult.outcome === 'accepted') { showToast("Application", "Installation lancée !"); }
                deferredPrompt = null;
                render();
            } else {
                alert("Pour installer l'application sur votre téléphone, ouvrez le menu de votre navigateur (les 3 petits points) et sélectionnez 'Ajouter à l'écran d'accueil'.");
            }
        }

        function applyTheme() {
            let t = DB.get('site_theme') || {};
            if (t.btnColor) document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            if (t.cardBg) document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            if (t.borderColor) document.documentElement.style.setProperty('--custom-border-color', t.borderColor);
            
            let body = document.getElementById('body-theme');
            if (t.mode === 'light') {
                body.className = "bg-stone-100 text-stone-900 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden";
            } else {
                body.className = "bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden";
            }

            let bgC = document.getElementById('custom-bg-container');
            if (bgC) {
                if (t.preset === 'noel') {
                    bgC.innerHTML = `<div class="w-full h-full bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&q=80&w=1200')"></div>`;
                } else if (t.bgMedia) {
                    if (t.bgMedia.match(/\.(mp4|webm|ogg)$/i) || t.bgMedia.startsWith('data:video')) {
                        bgC.innerHTML = `<video autoplay muted loop class="w-full h-full object-cover opacity-40"><source src="${t.bgMedia}"></video>`;
                    } else {
                        bgC.innerHTML = `<div class="w-full h-full bg-cover bg-center opacity-40" style="background-image: url('${t.bgMedia}')"></div>`;
                    }
                } else {
                    bgC.innerHTML = '';
                }
            }

            let decoContainer = document.getElementById('theme-decorations');
            if (!decoContainer) return;
            decoContainer.innerHTML = '';
            
            let symbol = '';
            if (t.preset === 'noel') symbol = '🎄';
            else if (t.preset === 'halloween') symbol = '🎃';
            else if (t.preset === 'paques') symbol = '🥚';
            else if (t.preset === 'automne') symbol = '🍂';
            else if (t.preset === 'hiver') symbol = '❄️';
            else if (t.preset === 'printemps') symbol = '🌸';
            else if (t.preset === 'ete') symbol = '🟡';

            if (symbol) {
                let count = t.preset === 'ete' ? 30 : 15;
                for (let i = 0; i < count; i++) {
                    let item = document.createElement('div');
                    item.className = 'deco-item ' + (t.preset === 'ete' ? 'text-xs text-amber-400/40' : 'text-xl');
                    item.textContent = t.preset === 'noel' ? (Math.random() > 0.5 ? '🎄' : '🔴') : symbol;
                    item.style.left = Math.random() * 100 + 'vw';
                    item.style.animationDuration = (Math.random() * 4 + 4) + 's';
                    item.style.animationDelay = (Math.random() * 5) + 's';
                    decoContainer.appendChild(item);
                }
            }
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 5000);
        }
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
            updateNotificationsModalContent(user);
        }

        function updateNotificationsModalContent(user) {
            let notifs = DB.get('app_notifications') || [];
            let filtered = notifs.filter(n => n.targetRole === 'all' || (n.targetRole === 'admin' && (user.role === 'admin' || user.role === 'delegate')));
            let container = document.getElementById('notifications-list-container');
            let badge = document.getElementById('notif-badge-count');

            if (badge) {
                badge.textContent = filtered.length;
                badge.style.display = filtered.length > 0 ? 'inline-block' : 'none';
            }

            if (!container) return;
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-amber-200/50 py-6 text-xs">Aucune notification pour le moment.</p>`;
                return;
            }

            container.innerHTML = filtered.map(n => `
                <div class="p-3 bg-stone-900 border border-amber-900/40 rounded-2xl flex items-start gap-3">
                    <div class="text-amber-400 text-lg mt-0.5"><i class="fa-solid fa-bell"></i></div>
                    <div class="flex-1 space-y-0.5">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-amber-300 text-xs">${n.title}</h4>
                            <span class="text-[9px] text-amber-200/50">${n.time} - ${n.date}</span>
                        </div>
                        <p class="text-amber-100 text-[11px]">${n.message}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>
                    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                        <input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button>
                    </form>
                </div>
            </div>`;
        }

        function renderSetup(user) {
            let isAdmin = user.role === 'admin';
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs">
                    <h1 class="text-base font-bold text-amber-400">Première connexion - Configuration obligatoire</h1>
                    <form onsubmit="saveSetup(event)" class="space-y-3">
                        ${isAdmin ? `
                            <div>
                                <label class="block font-bold text-amber-300">Nouvel Identifiant Administrateur *</label>
                                <input type="text" id="s-username" value="${user.username}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block font-bold text-amber-300">Nom & Prénom réels *</label>
                            <input type="text" id="s-lastname" value="${user.realName || ''}" required placeholder="Ex: Jean Dupont" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Date de naissance *</label>
                            <input type="date" id="s-birth" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Nouveau Mot de passe *</label>
                            <input type="password" id="s-pass" required placeholder="Nouveau mot de passe" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Pseudo de messagerie (Facultatif)</label>
                            <input type="text" id="s-pseudo" value="${user.pseudo || ''}" placeholder="Ex: 🚀 SuperÉlève" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <div>
                            <label class="block font-bold text-amber-300">Adresse E-mail (Facultatif)</label>
                            <input type="email" id="s-email" value="${user.email || ''}" placeholder="nom@exemple.com" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white mt-1">
                        </div>
                        <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Valider et Entrer sur LE QG</button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboard(user) {
            let canAccessAdmin = user.role === 'admin' || user.role === 'delegate';
            let hidden = DB.get('hidden_tabs') || [];
            let customPages = (DB.get('custom_pages') || []).filter(p => !p.title.toLowerCase().includes('qr') && !p.title.toLowerCase().includes('badge') && !p.title.toLowerCase().includes('toutou'));

            function isVisible(tabId) { return !hidden.includes(tabId); }

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2">
                            ${renderAvatarBadge(user)}
                            <div>
                                <div class="font-black text-amber-400 text-xs">${user.pseudo || user.username}</div>
                                <div class="text-[9px] text-amber-200/60">${user.realName || user.username}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleModal('notifications-modal', true)" class="relative px-3 py-1.5 bg-stone-900 border border-amber-500/40 text-amber-300 text-xs rounded-xl font-bold flex items-center gap-1.5">
                            <i class="fa-solid fa-bell"></i> Notifications
                            <span id="notif-badge-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold" style="display:none">0</span>
                        </button>
                        <button onclick="installPWA()" class="px-3 py-1.5 dyn-btn text-white text-xs rounded-xl font-bold flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen"></i> App Mobile</button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border">Déconnexion</button>
                    </div>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-64 bg-stone-950/95 border-r transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-4 pt-16 space-y-1 text-xs overflow-y-auto">
                        ${isVisible('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                        ${isVisible('profile') ? sbBtn('profile', 'Mon Profil & Avatar', 'user-astronaut') : ''}
                        ${isVisible('formations') ? sbBtn('formations', 'Formations Post-Bac', 'graduation-cap') : ''}
                        ${isVisible('calendar') ? sbBtn('calendar', 'Planning & Agenda', 'calendar-days') : ''}
                        ${isVisible('tickets') ? sbBtn('tickets', 'Mails & Support Tickets', 'envelope') : ''}
                        ${isVisible('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'award') : ''}
                        ${isVisible('chat') ? sbBtn('chat', 'Messagerie & Canal', 'comments') : ''}

            let active = state.tab === id;

        function renderContent(user) {
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'profile') return renderProfileTab(user);
            if (state.tab === 'formations') return renderFormationsTab();
            if (state.tab === 'calendar') return renderCalendarTab();
            if (state.tab === 'tickets') return renderTicketsTab(user);
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'quizzes') return renderQuizzesTab(user);
            if (state.tab === 'polls') return renderPollsTab(user);

            if (state.tab === 'exams') return renderExamsTab();
            if (state.tab === 'documents') return renderDocumentsTab(user);
            if (state.tab === 'flashcards') return renderFlashcardsTab(user);
            if (state.tab === 'orientation') return renderOrientationTab();

        function renderTicketsTab(user) {
            let users = DB.get('users') || [], tickets = DB.get('tickets') || [];
            let myTickets = tickets.filter(t => t.sender === user.username || t.recipient === user.username || user.role === 'admin' || user.role === 'delegate');

                <div class="dyn-card border p-6 rounded-3xl space-y-4">
                    <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-envelope mr-2"></i>Espace Mails & Support Tickets</h2>
                    <form onsubmit="sendNewTicket(event)" class="p-4 bg-stone-900/60 rounded-2xl border space-y-3">
                        <h3 class="font-bold text-amber-300">Nouveau Mail / Ticket</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <select id="tk-recipient" required class="p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                                <option value="">Destinataire...</option>
                                ${users.filter(u => u.username !== user.username).map(u => `<option value="${u.username}">${u.pseudo || u.username} (${u.role})</option>`).join('')}
                            </select>
                            <input type="text" value="[LE QG] Objet du message" readonly class="p-2.5 bg-stone-950/50 border text-amber-200/50 rounded-xl cursor-not-allowed">
                        </div>
                        <input type="text" id="tk-subject-extra" required placeholder="Sujet précis..." class="w-full p-2.5 bg-stone-950 border rounded-xl text-amber-100">

                </div>
                <div class="space-y-3">
                    <div class="flex justify-between items-center"><h3 class="font-bold text-amber-300 text-sm">Tous mes Mails & Tickets (${myTickets.length})</h3></div>
                    ${myTickets.map(t => `
                        <div class="dyn-card border p-5 rounded-2xl space-y-3">
                            <div class="flex justify-between items-center flex-wrap gap-2 border-b pb-2">
                                <div><span class="font-mono text-amber-400 font-bold">${t.ticketId}</span> - <span class="font-bold text-white">${t.subject}</span><p class="text-[10px] text-amber-200/60">De ${t.sender} vers ${t.recipient} (${t.date})</p></div>
                                <div class="flex items-center gap-2">
                                    <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-amber-500/20 text-amber-300">${t.status}</span>
                                    ${user.role === 'admin' || user.role === 'delegate' || t.sender === user.username ? `
                                        <select onchange="updateTicketStatus('${t.ticketId}', this.value)" class="p-1 bg-stone-900 border rounded text-[10px]">
                                            <option value="Ouvert" ${t.status==='Ouvert'?'selected':''}>Ouvert</option>
                                            <option value="En attente" ${t.status==='En attente'?'selected':''}>En attente</option>
                                            <option value="Clos" ${t.status==='Clos'?'selected':''}>Clos</option>
                                        </select>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="space-y-2 max-h-40 overflow-y-auto p-2 bg-stone-900/40 rounded-xl">
                                ${t.replies.map(r => `<div class="p-2 bg-stone-950 rounded-lg"><div class="flex justify-between text-[10px] text-amber-400 font-bold"><span>${r.author}</span><span>${r.date}</span></div><p class="text-amber-100 text-xs mt-1">${r.text}</p></div>`).join('')}
                            </div>
                            ${t.status !== 'Clos' ? `
                                <form onsubmit="replyTicket(event, '${t.ticketId}')" class="flex gap-2"><input type="text" id="reply_${t.ticketId}" required placeholder="Répondre..." class="flex-1 p-2 bg-stone-900 border rounded-xl text-amber-100"><button type="submit" class="px-3 py-1.5 dyn-btn text-white font-bold rounded-xl">Répondre</button></form>
                            ` : `<p class="text-stone-500 italic text-[10px]">Ce ticket est clos.</p>`}

                    `).join('')}
                </div>
            </div>`;
        }

        async function sendNewTicket(e) {
            e.preventDefault();
            let user = getCurrentUser();
            let ticketId = '#TKT-' + Math.floor(10000 + Math.random() * 90000);
            let tickets = DB.get('tickets') || [];
            tickets.push({
                ticketId, sender: user.username, recipient: document.getElementById('tk-recipient').value,
                subject: `[LE QG] ${document.getElementById('tk-subject-extra').value}`,
                status: 'Ouvert', date: new Date().toLocaleString(),
                replies: [{ author: user.pseudo || user.username, text: document.getElementById('tk-body').value, date: new Date().toLocaleString() }]
            });
            await DB.set('tickets', tickets);
            showToast("Nouveau Ticket !", `Mail envoyé sous le ticket ${ticketId}`);
        }

        async function replyTicket(e, ticketId) {
            e.preventDefault();
            let user = getCurrentUser(), tickets = DB.get('tickets') || [], idx = tickets.findIndex(t => t.ticketId === ticketId);
            if (idx !== -1) {
                tickets[idx].replies.push({ author: user.pseudo || user.username, text: document.getElementById(`reply_${ticketId}`).value, date: new Date().toLocaleString() });
                await DB.set('tickets', tickets);
                showToast("Réponse envoyée", `Ticket ${ticketId} mis à jour.`);
            }
        }

        async function updateTicketStatus(ticketId, newStatus) {
            let tickets = DB.get('tickets') || [], idx = tickets.findIndex(t => t.ticketId === ticketId);
            if (idx !== -1) {
                tickets[idx].status = newStatus;
                await DB.set('tickets', tickets);
                showToast("Statut mis à jour", `Ticket ${ticketId} -> ${newStatus}`);
            }
        }

        function renderUserAppreciations(user) {
            let all = DB.get('appreciations') || {}, myApp = all[user.username] || { t1: '', t2: '', t3: '', published: false };
            if (!myApp.published) return `<div class="max-w-2xl mx-auto dyn-card border p-8 text-center rounded-3xl"><i class="fa-solid fa-lock text-4xl text-amber-400"></i><h2 class="text-xl font-bold text-white">Appréciations</h2><p class="text-xs text-amber-200/70 mt-2">Non publiées par l'administration.</p></div>`;
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs"><div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400">Mes Appréciations</h2></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T1</h4><p class="mt-2 text-amber-100">${myApp.t1||'Aucune'}</p></div><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T2</h4><p class="mt-2 text-amber-100">${myApp.t2||'Aucune'}</p></div><div class="dyn-card border p-4 rounded-2xl"><h4 class="font-bold text-amber-300">T3</h4><p class="mt-2 text-amber-100">${myApp.t3||'Aucune'}</p></div></div></div>`;
        }

        function renderQuizzesTab(user) {
            let quizzes = DB.get('quizzes') || [], subs = DB.get('quiz_submissions') || {}, mySubs = subs[user.username] || [];
            if (state.activeQuizId) {
                let q = quizzes.find(x => x.id === state.activeQuizId);
                return q ? `<div class="max-w-2xl mx-auto dyn-card border p-6 rounded-3xl space-y-4 text-xs"><h2 class="text-lg font-black text-amber-400">${q.title}</h2><form onsubmit="submitQuiz(event, ${q.id})" class="space-y-4">${q.questions.map((item, qIdx)=>`<div class="p-3 bg-stone-900 border rounded-xl"><p class="font-bold text-amber-100">${item.question}</p>${item.options.map((opt, oIdx)=>`<label class="block p-1"><input type="radio" name="q_${qIdx}" value="${oIdx}" required> ${opt}</label>`).join('')}</div>`).join('')}<button type="submit" class="w-full py-2 dyn-btn text-white rounded-xl font-bold">Valider</button></form></div>` : '';
            }

            let bestScores = {};
            mySubs.forEach(s => {
                if (!bestScores[s.quizId] || s.score > bestScores[s.quizId].score) bestScores[s.quizId] = s;
            });
            let bestList = Object.values(bestScores);
            let avgGeneral = bestList.length > 0 ? (bestList.reduce((acc, curr) => acc + (curr.score / curr.total) * 20, 0) / bestList.length).toFixed(1) : '-';

            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl flex justify-between items-center">
                    <div><h2 class="text-xl font-black text-amber-400">Quiz Disponibles & Progression</h2></div>
                    <div class="text-right"><span class="text-xs text-amber-200/70">Moyenne Générale (Meilleures Notes) :</span><div class="text-xl font-extrabold text-amber-400">${avgGeneral} / 20</div></div>
                </div>
                <div class="space-y-2">${quizzes.map(q=>`<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center"><span>${q.title}</span><button onclick="state.activeQuizId=${q.id};render()" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Refaire / Lancer</button></div>`).join('')}</div>
                <div class="dyn-card border p-6 rounded-3xl space-y-2">
                    <h3 class="font-bold text-amber-300">Ma Progression (Meilleures Notes retenues)</h3>
                    ${bestList.length === 0 ? '<p class="text-amber-200/50">Aucun quiz complété.</p>' : bestList.map(s => `<div class="p-2 bg-stone-900 rounded flex justify-between"><span>${s.quizTitle} (${s.date})</span><span class="font-bold text-amber-400">${s.score} / ${s.total}</span></div>`).join('')}
                </div>
            </div>`;
        }

        async function submitQuiz(e, quizId) {
            e.preventDefault();
            let quiz = (DB.get('quizzes') || []).find(x => x.id === quizId), score = 0;
            quiz.questions.forEach((q, idx) => {
                let sel = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (sel && parseInt(sel.value) === parseInt(q.correct)) score++;
            });
            let user = getCurrentUser(), subs = DB.get('quiz_submissions') || {};

        async function votePoll(pIdx, oIdx) {
            let user = getCurrentUser();
            let polls = DB.get('polls') || [];
            if (!polls[pIdx].voters) polls[pIdx].voters = [];
            if (polls[pIdx].voters.includes(user.username)) return;
            polls[pIdx].voters.push(user.username);
            if (!polls[pIdx].results) polls[pIdx].results = {};
            polls[pIdx].results[oIdx] = (polls[pIdx].results[oIdx] || 0) + 1;
            await DB.set('polls', polls);

            await pushNotification("Réponse à un Sondage", `${user.pseudo || user.username} a voté au sondage "${polls[pIdx].question}".`, "admin");

                    <option value="0">Bonne réponse : Option 1</option>
                    <option value="1">Bonne réponse : Option 2</option>
                    <option value="2">Bonne réponse : Option 3</option>
                    <option value="3">Bonne réponse : Option 4</option>
                </select>
            `;
            container.appendChild(div);
        }

        async function createQuiz(e) {
            e.preventDefault();
            let title = document.getElementById('qz-title').value;
            let qBlocks = document.querySelectorAll('#qz-questions-container > div');
            let questions = [];
            qBlocks.forEach(block => {
                let question = block.querySelector('.q-text').value;
                let options = [
                    block.querySelector('.q-opt-0').value,
                    block.querySelector('.q-opt-1').value,
                    block.querySelector('.q-opt-2').value,
                    block.querySelector('.q-opt-3').value
                ].filter(Boolean);
                let correct = block.querySelector('.q-correct').value;
                questions.push({ question, options, correct });
            });

            let quizzes = DB.get('quizzes') || [];
            quizzes.push({ id: Date.now(), title, questions });
            await DB.set('quizzes', quizzes);
            showToast("Succès", "Quiz publié !");
            await pushNotification("Nouveau Quiz Disponible !", `Le quiz "${title}" vient d'être publié.`);
            render();
        }

        function renderAdminDocs() {
            return `<div class="dyn-card border p-6 rounded-3xl space-y-4">
                <h3 class="font-bold text-amber-300">Publication de Fichiers & Fiches de Révision</h3>
                <form onsubmit="uploadDoc(event)" class="space-y-2">
                    <input type="text" id="rev-title" required placeholder="Titre..." class="w-full p-2 bg-stone-900 border rounded-xl text-white">
                    <input type="file" id="rev-file" accept=".pdf,image/*" class="w-full p-2 bg-stone-900 border rounded-xl text-xs text-white">
                    <button type="submit" class="dyn-btn w-full py-2 text-white font-bold rounded-xl">Publier et notifier</button>
                </form>
            </div>`;
        }

        async function uploadDoc(e) {
            e.preventDefault();
            let title = document.getElementById('rev-title').value;
            let file = document.getElementById('rev-file').files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = async (ev) => {
                    let list = DB.get('revision_sheets') || [];
                    list.push({ title, fileData: ev.target.result, fileType: file.type });
                    await DB.set('revision_sheets', list);
                    showToast("Succès", "Fiche publiée !");
                    await pushNotification("Nouveau Document Disponible !", `La fiche "${title}" a été publiée.`);
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderAdminTheme() {
            let t = DB.get('site_theme') || {};
            let countdown = DB.get('countdown') || { title: '', date: '' };
            let currentQr = DB.get('home_qr_image') || '';

            return `<div class="dyn-card border p-6 rounded-3xl space-y-6">
                <h3 class="font-bold text-amber-300">Personnalisation du Compte à rebours</h3>
                <form onsubmit="saveCountdownAdmin(event)" class="space-y-2">
                    <input type="text" id="cd-title" value="${countdown.title}" required placeholder="Titre..." class="w-full p-2 bg-stone-900 border rounded-xl text-white">
                    <input type="datetime-local" id="cd-date" value="${countdown.date}" required class="w-full p-2 bg-stone-900 border rounded-xl text-white">
                    <button type="submit" class="dyn-btn w-full py-2 text-white font-bold rounded-xl">Mettre à jour le compteur</button>
                </form>

                <div class="border-t border-amber-900/40 pt-4 space-y-3">
                    <h3 class="font-bold text-amber-300">Gestion du QR Code (Accueil)</h3>
                    ${currentQr ? `<img src="${currentQr}" width="80" class="rounded-lg"/>` : ''}
                    <div class="flex gap-2 items-center">
                        <input type="file" id="admin-home-qr-file" accept="image/*" class="p-2 bg-stone-900 border rounded-xl text-xs flex-1 text-white">
                        <button onclick="saveAdminHomeQr()" class="px-4 py-2 dyn-btn text-white rounded-xl font-bold">Mettre à jour</button>
                    </div>
                </div>

                <div class="border-t border-amber-900/40 pt-4 space-y-3">
                    <h3 class="font-bold text-amber-300">Thème & Décorations</h3>
                    <select id="theme-preset" onchange="saveThemePreset(this.value)" class="w-full p-2 bg-stone-900 border rounded-xl text-white">
                        <option value="standard" ${t.preset==='standard'?'selected':''}>Standard (Doré)</option>
                        <option value="noel" ${t.preset==='noel'?'selected':''}>🎄 Noël / Hiver</option>
                        <option value="halloween" ${t.preset==='halloween'?'selected':''}>🎃 Halloween</option>
                        <option value="ete" ${t.preset==='ete'?'selected':''}>☀️ Été / Soleil</option>
                    </select>
                </div>
            </div>`;
        }

        async function saveCountdownAdmin(e) {
            e.preventDefault();
            let title = document.getElementById('cd-title').value;
            let date = document.getElementById('cd-date').value;
            await DB.set('countdown', { title, date });
            showToast("Succès", "Compte à rebours mis à jour !");
            render();
        }

        async function saveThemePreset(preset) {
            let t = DB.get('site_theme') || {};
            t.preset = preset;
            await DB.set('site_theme', t);
            showToast("Thème mis à jour !", "");
            render();
        }

        async function saveAdminHomeQr() {
            let fileInput = document.getElementById('admin-home-qr-file');
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = async (ev) => {
                    await DB.set('home_qr_image', ev.target.result);
                    showToast("Succès", "QR code mis à jour !");
                    render();
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1) {
                if (user.role === 'admin') {
                    let newUsername = document.getElementById('s-username').value.trim();
                    if (newUsername) users[idx].username = newUsername;
                }
                users[idx].realName = document.getElementById('s-lastname').value;
                users[idx].birthDate = document.getElementById('s-birth').value;
                users[idx].password = document.getElementById('s-pass').value;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
