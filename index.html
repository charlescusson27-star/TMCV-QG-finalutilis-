<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans bg-cover bg-center bg-fixed relative overflow-hidden">

    <div id="custom-bg-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>

    <div id="app" class="h-full flex flex-col flex-1 bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-open-tab" href="#" target="_blank" class="px-3 py-1.5 bg-stone-900 text-amber-200 border rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-external-link-alt"></i> Ouvrir</a>
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div id="viewer-content-container" class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border flex items-center justify-center"></div>
        </div>
    </div>

    <!-- Toast Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAaGlYlurOipxv8oBtu618HxvjWwr9vj2s",
            authDomain: "leqg-lycee.firebaseapp.com",
            projectId: "leqg-lycee",
            storageBucket: "leqg-lycee.firebasestorage.app",
            messagingSenderId: "972048463578",
            appId: "1:972048463578:web:ef2af282ccefc5134e17e3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentGameId = null;
        let currentGameScore = 0;

        let cloudData = {
            users: [
                { username: 'Charlesadmin', password: 'tln20', role: 'admin', status: 'active', mustChangePass: true, email: 'charlescusson27@gmail.com', avatarSkin: '#fca5a5', avatarAccessory: '👑', avatarHair: '🧢', pseudo: 'Charles (Admin)', realName: 'Charles Cusson', birthDate: '2009-03-26' }
            ],
            messages: [],
            ideas_board: [],
            polls: [],
            quizzes: [],
            quiz_submissions: {},
            revision_sheets: [],
            exam_subjects: [],
            formations: [],
            tickets: [],
            appreciations: {},
            flashcards_decks: [],
            personal_notes: {},
            app_notifications: [],
            moods: {},
            home_qr_image: '',
            hidden_tabs: [],
            site_theme: { preset: 'standard', btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' },
            countdown: { title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' }
        };

        const DB = {
            get(k) { return cloudData[k] !== undefined ? cloudData[k] : null; },
            async set(k, val) {
                cloudData[k] = val;
                await db.collection("leqg_data").doc(k).set({ value: val });
                applyTheme();
                render();
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            gameFilter: 'all',
            activeDeckId: null,
            aiMessages: [{ sender: 'ai', text: 'Bonjour ! Je suis ton Tuteur IA spécialisé en Droit, Économie, Gestion et Commerce. Pose-moi tes questions de révision !' }]
        };

        const PLAYABLE_GAMES = [
            { id: 'chef_rayon', name: 'Chef de Rayon MCV', cat: 'ludo', icon: 'fa-boxes-packing', desc: 'Place les articles au bon niveau du linéaire.', rules: '<b>But :</b> Implanter les produits selon le merchandising.<br><b>Règle :</b> 1ers prix au sol, produits phares au niveau des yeux.', type: 'chef_rayon' },
            { id: 'quiz_droit', name: 'Le Démineur Juridique', cat: 'ludo', icon: 'fa-scale-balanced', desc: 'Identifie les clauses légales vs abusives.', rules: '<b>But :</b> Analyser des clauses de contrats de travail.<br><b>Règle :</b> Détermine si la clause respecte la loi.', type: 'quiz' },
            { id: 'juste_prix', name: 'Calculateur de Marge', cat: 'ludo', icon: 'fa-calculator', desc: 'Calcule les indicateurs commerciaux.', rules: '<b>But :</b> Maîtriser les prix TTC et marges.<br><b>Règle :</b> Choisis la bonne réponse mathématique.', type: 'quiz' },
            { id: 'marketing_4p', name: 'Mastermind Marketing Mix', cat: 'ludo', icon: 'fa-bullseye', desc: 'Associer les actions au bon P des 4P.', rules: '<b>But :</b> Classer dans les 4P.<br><b>Règle :</b> Associe l\'action au bon pilier.', type: 'quiz' },
            { id: 'vocab_anglais', name: 'English Commercial Quiz', cat: 'ludo', icon: 'fa-language', desc: 'Traduire les termes du e-commerce.', rules: '<b>But :</b> Valider le vocabulaire pro anglophone.<br><b>Règle :</b> Choisis la bonne traduction.', type: 'quiz' },
            { id: 'gestion_stock', name: 'Alerte Rupture de Stock', cat: 'ludo', icon: 'fa-warehouse', desc: 'Vérifie si le stock de sécurité est atteint.', rules: '<b>But :</b> Éviter les ruptures de stock.<br><b>Règle :</b> Décide si une réappro s\'impose.', type: 'quiz' },
            { id: 'relation_client', name: 'Simulateur d\'Objection', cat: 'ludo', icon: 'fa-comments', desc: 'Traiter les objections clients en magasin.', rules: '<b>But :</b> Décrocher la vente face à l\'hésitation.<br><b>Règle :</b> Choisis la bonne méthode de réfutation.', type: 'quiz' },
            { id: 'securite_mag', name: 'Auditeur Sécurité & Vol', cat: 'ludo', icon: 'fa-shield-halved', desc: 'Repérer les failles de démarque inconnue.', rules: '<b>But :</b> Réduire la démarque.<br><b>Règle :</b> Repère l\'erreur en rayon.', type: 'quiz' },
            { id: 'eco_inflation', name: 'Superviseur Pouvoir d\'Achat', cat: 'ludo', icon: 'fa-chart-line', desc: 'Régler l\'impact prix sur l\'inflation.', rules: '<b>But :</b> Comprendre le pouvoir d\'achat.<br><b>Règle :</b> Réponds aux questions éco.', type: 'quiz' },
            { id: 'code_travail', name: 'Expert Contrat de Travail', cat: 'ludo', icon: 'fa-file-signature', desc: 'Valider la conformité des contrats.', rules: '<b>But :</b> Valider les durées légales.<br><b>Règle :</b> Contrôle la conformité.', type: 'quiz' },
            { id: 'clicker_qg', name: 'Clicker du Vendeur', cat: 'chill', icon: 'fa-hand-pointer', desc: 'Clique le plus vite possible !', rules: '<b>But :</b> Encaisser un max d\'articles.<br><b>Règle :</b> Clique pour marquer des points.', type: 'clicker' },
            { id: 'test_reflexe', name: 'Chrono Réflexes Flash', cat: 'chill', icon: 'fa-bolt', desc: 'Clique quand la couleur passe au vert !', rules: '<b>But :</b> Tester ta vitesse de réaction.<br><b>Règle :</b> Clique dès que ça passe au vert.', type: 'reflex' },
            { id: 'memory_cards', name: 'Memory des Marques', cat: 'chill', icon: 'fa-clone', desc: 'Retrouve les cartes identiques.', rules: '<b>But :</b> Trouver les paires.<br><b>Règle :</b> Retourne les cartes 2 par 2.', type: 'memory' },
            { id: 'juste_nombre', name: 'Devine le Chiffre Mystère', cat: 'chill', icon: 'fa-hashtag', desc: 'Trouve le nombre caché entre 1 et 100.', rules: '<b>But :</b> Trouver le chiffre.<br><b>Règle :</b> Ajuste selon les indices.', type: 'guess' },
            { id: 'pierre_feuille', name: 'Chifoumi Tactique', cat: 'chill', icon: 'fa-hand-back-fist', desc: 'Bats l\'ordinateur à Pierre-Papier-Ciseaux.', rules: '<b>But :</b> Gagner le duel.<br><b>Règle :</b> Choisis ton coup.', type: 'chifoumi' },
            { id: 'des_chance', name: 'Lancer de Dés 777', cat: 'chill', icon: 'fa-dice', desc: 'Tente de faire un max de points.', rules: '<b>But :</b> Faire un double 6.<br><b>Règle :</b> Relance les dés.', type: 'dice' },
            { id: 'fast_calc', name: 'Calcul Rapidou', cat: 'chill', icon: 'fa-plus-minus', desc: 'Résous des calculs sous pression.', rules: '<b>But :</b> Calculer vite.<br><b>Règle :</b> Réponds aux opérations.', type: 'fast_math' },
            { id: 'pendu_mcv', name: 'Mot Mystère de Pause', cat: 'chill', icon: 'fa-font', desc: 'Devine le mot caché lettre par lettre.', rules: '<b>But :</b> Trouver le mot.<br><b>Règle :</b> Choisis les bonnes lettres.', type: 'pendu' },
            { id: 'pile_face', name: 'Pile ou Face Double', cat: 'chill', icon: 'fa-coins', desc: 'Parie sur la pièce.', rules: '<b>But :</b> Deviner la face.<br><b>Règle :</b> Choisis Pile ou Face.', type: 'coin' },
            { id: 'morpion_duo', name: 'Morpion de Pause', cat: 'chill', icon: 'fa-xmark', desc: 'Aligner 3 symboles.', rules: '<b>But :</b> Aligner 3 pions.<br><b>Règle :</b> Aligne tes symboles.', type: 'morpion' }
        ];

        async function init() {
            try {
                let userDoc = await db.collection("leqg_data").doc("users").get();
                if (!userDoc.exists || !userDoc.data().value || !userDoc.data().value.some(u => u.username === 'Charlesadmin')) {
                    for (let k of Object.keys(cloudData)) {
                        await db.collection("leqg_data").doc(k).set({ value: cloudData[k] });
                    }
                } else {
                    for (let k of Object.keys(cloudData)) {
                        let doc = await db.collection("leqg_data").doc(k).get();
                        if (doc.exists) cloudData[k] = doc.data().value;
                    }
                }
            } catch(e) {
                console.error("Erreur Firebase :", e);
            }
            applyTheme();
            checkBirthdays();
            render();
        }

        function checkBirthdays() {
            let users = DB.get('users') || [];
            let today = new Date().toISOString().slice(5, 10); // MM-DD
            let checkedKey = 'leqg_bday_checked_' + today;
            if (sessionStorage.getItem(checkedKey)) return;

            let adminUser = users.find(u => u.username === 'Charlesadmin');
            users.forEach(u => {
                if (u.birthDate && u.birthDate.slice(5, 10) === today) {
                    pushGlobalNotification("🎂 Anniversaire !", `C'est l'anniversaire de ${u.pseudo || u.username} aujourd'hui !`, adminUser ? adminUser.username : null);
                }
            });
            sessionStorage.setItem(checkedKey, 'true');
        }

        function applyTheme() {
            let t = DB.get('site_theme') || { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' };
            document.documentElement.style.setProperty('--custom-btn-bg', t.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', t.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', t.borderColor);
        }

        function getCurrentUser() { let u = sessionStorage.getItem('leqg_current_user'); return u ? JSON.parse(u) : null; }
        
        async function pushGlobalNotification(title, message, targetUsername = null) {
            let notifs = DB.get('app_notifications') || [];
            notifs.unshift({
                title, message,
                target: targetUsername || 'all',
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
            });
            await DB.set('app_notifications', notifs);
            showToast(title, message);
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 5000);
        }

        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

        function openFileViewer(title, url, type) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('viewer-download-btn').href = url;
            document.getElementById('viewer-open-tab').href = url;
            let c = document.getElementById('viewer-content-container');
            if (type && type.includes('pdf')) {
                c.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="100%" />`;
            } else {
                c.innerHTML = `<img src="${url}" class="max-h-full object-contain rounded-xl" />`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarBadge(user) {
            let skin = user.avatarSkin || '#fca5a5';
            let acc = user.avatarAccessory || '👤';
            let hair = user.avatarHair || '🧢';
            return `<div class="relative w-8 h-8 rounded-full border border-amber-400 flex items-center justify-center text-xs overflow-hidden" style="background-color: ${skin}">
                <span>${acc}</span>
                <span class="absolute -top-1 right-0 text-[10px]">${hair}</span>
            </div>`;
        }

        function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-xl font-bold text-red-400">Compte Suspendu</h1><button onclick="logout()" class="mt-4 px-4 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup(user);
            app.innerHTML = renderDashboard(user);
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl text-3xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                    <h1 class="text-2xl font-black text-white">LE QG - Connexion</h1>
                    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                        <input type="text" id="l-user" required placeholder="Identifiant..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <input type="password" id="l-pass" required placeholder="Mot de passe..." class="w-full px-4 py-3 bg-stone-900 border rounded-2xl text-xs text-amber-100 focus:outline-none">
                        <button type="submit" class="w-full py-3 dyn-btn text-xs text-white font-bold rounded-2xl">Se connecter</button>
                    </form>
                </div>
            </div>`;
        }

        function renderSetup(user) {
            return `<div class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-4 text-xs">
                    <h1 class="text-base font-bold text-amber-400">Première connexion - Sécurité Obligatoire</h1>
                    <p class="text-amber-200/70 text-[11px]">Veuillez modifier votre mot de passe provisoire et renseigner vos informations.</p>
                    <form onsubmit="saveSetup(event)" class="space-y-3">
                        <div><label class="block font-bold text-amber-300">Nom & Prénom réels *</label><input type="text" id="s-realname" value="${user.realName || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>
                        <div><label class="block font-bold text-amber-300">Nouveau Mot de passe *</label><input type="password" id="s-pass" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white" placeholder="Nouveau mot de passe"></div>
                        <div><label class="block font-bold text-amber-300">Date de naissance *</label><input type="date" id="s-bdate" value="${user.birthDate || ''}" required class="w-full p-2.5 bg-stone-900 border rounded-xl text-white"></div>
                        <div><label class="block font-bold text-amber-300">Adresse e-mail (facultative)</label><input type="email" id="s-email" value="${user.email || ''}" class="w-full p-2.5 bg-stone-900 border rounded-xl text-white" placeholder="votre.email@exemple.com"></div>
                        <button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl mt-2">Valider et Entrer sur LE QG</button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboard(user) {
            let canAccessAdmin = user.role === 'admin' || user.role === 'delegate';
            let hidden = DB.get('hidden_tabs') || [];
            let notifs = DB.get('app_notifications') || [];
            let unreadCount = notifs.filter(n => n.target === 'all' || n.target === user.username).length;

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2">
                            ${renderAvatarBadge(user)}
                            <div>
                                <div class="font-black text-amber-400 text-xs">${user.pseudo || user.username}</div>
                                <div class="text-[9px] text-amber-200/60">${user.realName || user.username}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="state.tab='notifs';render()" class="relative p-2 bg-stone-900 border border-amber-900/40 text-amber-400 rounded-xl hover:border-amber-500 transition">
                            <i class="fa-solid fa-bell text-sm"></i>
                            ${unreadCount > 0 ? `<span class="absolute -top-1 -right-1 bg-amber-500 text-stone-950 text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">${unreadCount}</span>` : ''}
                        </button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border">Déconnexion</button>
                    </div>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-64 bg-stone-950/95 border-r transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-4 pt-16 space-y-1 text-xs overflow-y-auto">
                        ${!hidden.includes('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                        ${!hidden.includes('mood') ? sbBtn('mood', 'Mur des Humeurs', 'face-smile') : ''}
                        ${!hidden.includes('notifs') ? sbBtn('notifs', 'Centre Notifications', 'bell') : ''}
                        ${!hidden.includes('polls') ? sbBtn('polls', 'Sondages en Direct', 'square-poll-vertical') : ''}
                        ${!hidden.includes('games') ? sbBtn('games', 'Espace Arcade & Jeux (20)', 'gamepad') : ''}
                        ${!hidden.includes('quizzes') ? sbBtn('quizzes', 'Quiz & Évaluations', 'brain') : ''}
                        ${!hidden.includes('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                        ${!hidden.includes('exams') ? sbBtn('exams', 'Sujets & Corrigés Bac', 'file-pdf') : ''}
                        ${!hidden.includes('formations') ? sbBtn('formations', 'Orientation & Post-Bac', 'graduation-cap') : ''}
                        ${!hidden.includes('ideas') ? sbBtn('ideas', 'Boîte à Idées (Vote 48h)', 'lightbulb') : ''}
                        ${!hidden.includes('flashcards') ? sbBtn('flashcards', 'Flashcards Mémoire', 'clone') : ''}
                        ${!hidden.includes('notes') ? sbBtn('notes', 'Traitement de Texte (Notes)', 'file-lines') : ''}
                        ${!hidden.includes('bac_sim') ? sbBtn('bac_sim', 'Simulateur Bac & Notes', 'calculator') : ''}
                        ${!hidden.includes('ai_tuteur') ? sbBtn('ai_tuteur', 'Tuteur IA', 'robot') : ''}
                        ${!hidden.includes('leaderboard') ? sbBtn('leaderboard', 'Classement Classe', 'trophy') : ''}
                        ${!hidden.includes('chat') ? sbBtn('chat', 'Messagerie & Canal', 'comments') : ''}
                        ${!hidden.includes('tickets') ? sbBtn('tickets', 'Support & Mails', 'envelope') : ''}
                        ${!hidden.includes('profile') ? sbBtn('profile', 'Mon Profil', 'user-astronaut') : ''}
                        ${canAccessAdmin ? sbBtn('admin', 'Espace Délégué / Admin', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 md:p-6">${renderContent(user)}</main>
                </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon} w-4"></i> ${label}</button>`;
        }

        function renderContent(user) {
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'mood') return renderMoodTab(user);
            if (state.tab === 'notifs') return renderNotifsSection(user);
            if (state.tab === 'polls') return renderPollsTab(user);
            if (state.tab === 'games') return renderGamesSection();
            if (state.tab === 'quizzes') return renderQuizzesTab(user);

        async function votePoll(pollIdx, optIdx) {
            let user = getCurrentUser();
            let polls = DB.get('polls') || [];
            if (!polls[pollIdx].voters) polls[pollIdx].voters = [];
            if (polls[pollIdx].voters.includes(user.username)) return;

            polls[pollIdx].voters.push(user.username);
            if (!polls[pollIdx].options[optIdx].votes) polls[pollIdx].options[optIdx].votes = 0;
            polls[pollIdx].options[optIdx].votes++;

            await DB.set('polls', polls);
            showToast("Vote enregistré !", "Merci d'avoir participé au sondage.");
        }

        function calculateBacAverage() {
            let notes = document.querySelectorAll('.sim-note');
            let sum = 0, count = 0;
            notes.forEach(n => {
                let val = parseFloat(n.value);
                if (!isNaN(val)) { sum += val; count++; }
            });
            if (count === 0) return;
            let avg = (sum / count).toFixed(2);
            let mention = avg >= 16 ? 'Très Bien 🏆' : avg >= 14 ? 'Bien 🌟' : avg >= 12 ? 'Assez Bien 👍' : avg >= 10 ? 'Admis (Sans mention) ✅' : 'Non Admis ❌';
            document.getElementById('sim-result').innerHTML = `Moyenne estimée : ${avg} / 20<br>Mention : ${mention}`;
        }

        function launchGame(gameId) {
            let game = PLAYABLE_GAMES.find(g => g.id === gameId);
            if (!game) return;
            currentGameId = gameId;
            currentGameScore = 0;

            document.getElementById('active-game-title').innerText = game.name;
            document.getElementById('active-game-icon').innerHTML = `<i class="fa-solid ${game.icon}"></i>`;
            document.getElementById('active-game-rules').innerHTML = game.rules;
            document.getElementById('active-game-score').innerText = currentGameScore;
            
            document.getElementById('game-stage').classList.remove('hidden');
            document.getElementById('game-stage').scrollIntoView({ behavior: 'smooth' });

            buildPlayableGameInterface(game);
        }

        function closeActiveGame() { document.getElementById('game-stage').classList.add('hidden'); render(); }

        function buildPlayableGameInterface(game) {
            let container = document.getElementById('active-game-content');
            if (game.type === 'clicker') {
                container.innerHTML = `<button onclick="currentGameScore+=5;document.getElementById('active-game-score').innerText=currentGameScore;" class="p-6 bg-amber-500 text-stone-950 font-black text-xs rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition">🛒 CLIQUER POUR ENCAISSER (+5 pts)</button>`;
            } else if (game.type === 'chef_rayon') {
                container.innerHTML = `
                    <p class="text-xs text-amber-100 font-bold mb-2">Où implanter un article "Premier Prix" ?</p>
                    <div class="grid grid-cols-3 gap-2 w-full max-w-sm">

                        <button onclick="checkGameAnswer(false, '❌ Non, pas au milieu.')" class="p-3 bg-stone-900 border rounded-xl text-xs font-bold text-amber-200">Niveau Mains</button>
                        <button onclick="checkGameAnswer(true, '✅ Exact ! Les 1ers prix vont tout en bas au sol.')" class="p-3 bg-stone-900 border rounded-xl text-xs font-bold text-green-300">Niveau Sol (Bas)</button>
                    </div>
                    <p id="game-feedback" class="text-xs font-bold mt-2"></p>
                `;
            } else {
                container.innerHTML = `
                    <p class="text-xs text-amber-100">Réponds correctement pour marquer des points :</p>
                    <div class="flex gap-3 mt-2">
                        <button onclick="checkGameAnswer(true, '✅ Bonne réponse ! (+10 pts)', 10)" class="px-4 py-2 bg-stone-900 border border-green-500/40 rounded-xl text-xs text-green-300 font-bold">Option Conforme (A)</button>
                        <button onclick="checkGameAnswer(false, '❌ Mauvaise réponse !', 0)" class="px-4 py-2 bg-stone-900 border border-red-500/40 rounded-xl text-xs text-red-300 font-bold">Option Abusive (B)</button>
                    </div>
                    <p id="game-feedback" class="text-xs font-bold mt-2"></p>
                `;
            }
        }

        function checkGameAnswer(isCorrect, msg, pts = 10) {
            let fb = document.getElementById('game-feedback');
            if (isCorrect) {
                currentGameScore += pts;
                document.getElementById('active-game-score').innerText = currentGameScore;
                fb.className = "text-xs text-green-400 font-bold mt-2";
            } else {
                fb.className = "text-xs text-red-400 font-bold mt-2";
            }
            if (fb) fb.innerText = msg;
        }

        // --- ESPACE ADMINISTRATEUR COMPLET & HISTORIQUES ---
        function renderAdmin() {
            let users = DB.get('users') || [];
            let hidden = DB.get('hidden_tabs') || [];
            let allMsgs = DB.get('messages') || [];
            let polls = DB.get('polls') || [];
            let ideas = DB.get('ideas_board') || [];
            let theme = DB.get('site_theme') || { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' };

            return `
                <div class="max-w-4xl mx-auto space-y-6 text-xs">
                    <div class="dyn-card border p-6 rounded-3xl space-y-2">
                        <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-user-gear mr-2"></i>Espace Délégué / Administration</h2>
                        <p class="text-amber-200/70">Gestion intégrale des comptes, sondages, publications, thèmes et historiques.</p>
                    </div>

                    <!-- 1. GESTION DES THÈMES & SAISONS -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-palette mr-2"></i>Thèmes & Saisons (Noël, Halloween, Standard...)</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <button onclick="setThemePreset('#d97706', 'rgba(10, 10, 10, 0.9)', 'rgba(245, 158, 11, 0.4)')" class="p-3 bg-stone-900 border rounded-xl font-bold text-amber-400">Standard QG</button>
                            <button onclick="setThemePreset('#dc2626', 'rgba(20, 10, 10, 0.9)', 'rgba(220, 38, 38, 0.4)')" class="p-3 bg-stone-900 border rounded-xl font-bold text-red-400">🎄 Noël</button>
                            <button onclick="setThemePreset('#ea580c', 'rgba(20, 10, 5, 0.9)', 'rgba(234, 88, 12, 0.4)')" class="p-3 bg-stone-900 border rounded-xl font-bold text-orange-400">🎃 Halloween</button>
                            <button onclick="setThemePreset('#16a34a', 'rgba(10, 20, 10, 0.9)', 'rgba(34, 197, 94, 0.4)')" class="p-3 bg-stone-900 border rounded-xl font-bold text-green-400">🌸 Printemps / Pâques</button>
                        </div>
                    </div>

                    <!-- 2. CRÉATION DE SONDAGES AVEC MINUTERIE -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-3">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Créer un Sondage Chrono</h3>
                        <form onsubmit="adminCreatePoll(event)" class="space-y-2">
                            <input type="text" id="poll-quest" required placeholder="Question du sondage..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="poll-opt1" required placeholder="Option 1" class="p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                                <input type="text" id="poll-opt2" required placeholder="Option 2" class="p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <input type="number" id="poll-days" placeholder="Jours" min="0" value="1" class="p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                                <input type="number" id="poll-hours" placeholder="Heures" min="0" max="23" value="0" class="p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                                <input type="number" id="poll-mins" placeholder="Minutes" min="0" max="59" value="0" class="p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            </div>
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Lancer le Sondage</button>
                        </form>
                    </div>

                    <!-- 3. PUBLICATION DE CONTENU (FICHIER OU URL) -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-3">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-book-open mr-2"></i>Publier une Fiche de Révision (Fichier ou Lien)</h3>
                        <form onsubmit="adminUploadRevision(event)" class="space-y-2">
                            <input type="text" id="rev-title" required placeholder="Titre de la fiche..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <input type="file" id="rev-file" class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100 text-xs">
                            <input type="url" id="rev-url" placeholder="Ou lien URL externe..." class="w-full p-2.5 bg-stone-900 border rounded-xl text-amber-100">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Publier & Notifier la Classe</button>
                        </form>
                    </div>

                    <!-- 4. GESTION DES COMPTES UTILISATEURS & MDP PROVISOIRES -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-users-gear mr-2"></i>Gestion des Comptes & Mots de Passe Provisoires</h3>
                        <form onsubmit="adminCreateUser(event)" class="p-4 bg-stone-900/80 rounded-2xl border space-y-2">
                            <h4 class="font-bold text-amber-200">Créer un nouveau compte (MDP provisoire)</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                <input type="text" id="uc-user" required placeholder="Identifiant..." class="p-2.5 bg-stone-950 border rounded-xl text-amber-100">
                                <input type="text" id="uc-pass" required placeholder="MDP provisoire..." class="p-2.5 bg-stone-950 border rounded-xl text-amber-100" value="qg2026">
                                <select id="uc-role" class="p-2.5 bg-stone-950 border rounded-xl text-amber-400 font-bold">
                                    <option value="student">Élève</option>
                                    <option value="delegate">Délégué</option>
                                    <option value="admin">Administrateur</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Créer le Compte</button>
                        </form>

                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${users.map(u => `
                                <div class="p-3 bg-stone-900/90 rounded-2xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                                    <div>
                                        <div class="font-bold text-amber-100">${u.pseudo || u.username} (${u.role})</div>
                                        <div class="text-[10px] text-amber-200/60">Identifiant : <b>${u.username}</b> | MDP actuel : <code class="text-amber-400 bg-stone-950 px-1.5 py-0.5 rounded font-bold">${u.password}</code> | Naissance : ${u.birthDate || 'Non renseignée'}</div>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <select onchange="adminChangeRole('${u.username}', this.value)" class="p-1.5 bg-stone-950 border rounded-lg text-amber-300 font-bold">
                                            <option value="student" ${u.role==='student'?'selected':''}>Élève</option>
                                            <option value="delegate" ${u.role==='delegate'?'selected':''}>Délégué</option>
                                            <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                                        </select>
                                        <button onclick="adminResetPassword('${u.username}')" class="px-2 py-1 bg-stone-800 text-amber-200 border rounded-lg">Réinit.</button>
                                        <button onclick="adminToggleSuspend('${u.username}')" class="px-2 py-1 ${u.status==='masked'?'bg-green-900 text-green-300':'bg-red-900 text-red-300'} border rounded-lg">${u.status==='masked'?'Activer':'Suspendre'}</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 5. HISTORIQUES ADMIN (SONDAGES & IDÉES) -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Historique Admin (Sondages & Boîte à Idées)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <h4 class="font-bold text-amber-200">Historique des Sondages</h4>
                                <div class="max-h-36 overflow-y-auto space-y-1 p-2 bg-stone-950 rounded-xl border">
                                    ${polls.map(p => `<div class="p-2 bg-stone-900 rounded border text-[11px]"><b>${p.question}</b><br>Expire le : ${new Date(p.expiresAt).toLocaleString()}</div>`).join('')}
                                </div>
                            </div>
                            <div class="space-y-2">
                                <h4 class="font-bold text-amber-200">Historique Boîte à Idées</h4>
                                <div class="max-h-36 overflow-y-auto space-y-1 p-2 bg-stone-950 rounded-xl border">
                                    ${ideas.map(i => `<div class="p-2 bg-stone-900 rounded border text-[11px]"><b>${i.title}</b> (Par ${i.author})<br>👍 ${i.forVotes || 0} | 👎 ${i.againstVotes || 0}</div>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 6. UPLOAD QR CODE & VISIBILITÉ ONGLETS -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-3">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-qrcode mr-2"></i>Uploader le QR Code de l'Accueil</h3>
                        <form onsubmit="saveHomeQRCode(event)" class="space-y-2">
                            <input type="file" id="adm-qrcode-file" accept="image/*" required class="w-full p-2 bg-stone-900 border rounded-xl text-amber-100 text-xs">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl">Mettre à jour le QR Code</button>
                        </form>
                    </div>

                    <!-- 7. SURVEILLANCE SECRÈTE DES MESSAGES -->
                    <div class="dyn-card border p-6 rounded-3xl space-y-3">
                        <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-user-secret mr-2"></i>Modération & Surveillance des Mails / MP</h3>
                        <div class="max-h-36 overflow-y-auto space-y-2 p-3 bg-stone-950 rounded-2xl border">
                            ${allMsgs.filter(m => m.type === 'private').length === 0 ? '<p class="text-amber-200/50 italic">Aucun message privé échangé.</p>' : ''}
                            ${allMsgs.filter(m => m.type === 'private').map(m => `
                                <div class="p-2 bg-stone-900 rounded-xl flex justify-between border">
                                    <span><b>${m.sender}</b> vers <b>${m.recipient}</b> : ${m.text}</span>
                                    <span class="text-amber-400/60">${m.time}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function setThemePreset(btnColor, cardBg, borderColor) {
            await DB.set('site_theme', { btnColor, cardBg, borderColor });
            showToast("Thème appliqué !", "Le nouveau thème visuel est actif.");
        }

        async function adminCreatePoll(e) {
            e.preventDefault();
            let question = document.getElementById('poll-quest').value;
            let opt1 = document.getElementById('poll-opt1').value;
            let opt2 = document.getElementById('poll-opt2').value;
            let days = parseInt(document.getElementById('poll-days').value) || 0;
            let hours = parseInt(document.getElementById('poll-hours').value) || 0;
            let mins = parseInt(document.getElementById('poll-mins').value) || 0;

            let durationMs = (days * 24 * 3600 + hours * 3600 + mins * 60) * 1000;
            if (durationMs <= 0) durationMs = 3600 * 1000; // 1h min

            let polls = DB.get('polls') || [];
            polls.unshift({
                question,
                options: [{ text: opt1, votes: 0 }, { text: opt2, votes: 0 }],
                expiresAt: new Date(Date.now() + durationMs).toISOString(),
                voters: []
            });

            await DB.set('polls', polls);
            await pushGlobalNotification("Nouveau Sondage !", `Un nouveau sondage vient d'être publié : "${question}".`);
            showToast("Sondage lancé !", "Le sondage est en direct.");
        }

        async function adminUploadRevision(e) {
            e.preventDefault();
            let title = document.getElementById('rev-title').value;
            let file = document.getElementById('rev-file').files[0];
            let url = document.getElementById('rev-url').value;

            let fileData = url;
            if (file) {
                fileData = await new Promise(res => { let r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
            }

            let sheets = DB.get('revision_sheets') || [];
            sheets.push({ title, fileData, fileType: file ? file.type : 'url' });
            await DB.set('revision_sheets', sheets);

            await pushGlobalNotification("Nouvelle Fiche de Révision", `La fiche "${title}" est disponible dans l'onglet Fiches !`);
        }

        async function adminCreateUser(e) {
            e.preventDefault();
            let username = document.getElementById('uc-user').value.trim();
            let password = document.getElementById('uc-pass').value.trim();
            let role = document.getElementById('uc-role').value;

            let users = DB.get('users') || [];
            if (users.some(u => u.username === username)) return alert("Cet identifiant existe déjà !");

            users.push({ username, password, role, status: 'active', mustChangePass: true, realName: username, pseudo: username, birthDate: '2009-01-01' });
            await DB.set('users', users);
            showToast("Compte créé !", `Le compte ${username} a été créé avec un MDP provisoire.`);
        }

        async function adminChangeRole(username, newRole) {
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.role = newRole; await DB.set('users', users); showToast("Rôle mis à jour", `${username} est désormais ${newRole}.`); }
        }

        async function adminResetPassword(username) {
            let newPass = prompt("Nouveau mot de passe provisoire pour " + username + " :");
            if (!newPass) return;
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.password = newPass; u.mustChangePass = true; await DB.set('users', users); showToast("Mot de passe réinitialisé", `Le nouveau MDP provisoire est ${newPass}`); }
        }

        async function adminToggleSuspend(username) {
            let users = DB.get('users') || [];
            let u = users.find(x => x.username === username);
            if (u) { u.status = u.status === 'masked' ? 'active' : 'masked'; await DB.set('users', users); render(); }
        }

        async function saveHomeQRCode(e) {
            e.preventDefault();
            let file = document.getElementById('adm-qrcode-file').files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = async function(ev) {
                await DB.set('home_qr_image', ev.target.result);
                showToast("QR Code mis à jour !", "Affiché sur la page d'accueil.");
            };
            reader.readAsDataURL(file);
        }

        // --- COMPOSANTS SECONDAIRES ---
        function renderMoodTab(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-2xl mx-auto"><h2 class="text-xl font-bold text-amber-400">Mur des Humeurs</h2></div>`; }
        function renderNotifsSection(u) {
            let notifs = DB.get('app_notifications') || [];
            return `<div class="dyn-card border p-6 rounded-3xl max-w-3xl mx-auto space-y-3">
                <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-bell mr-2"></i>Centre des Notifications</h2>
                <div class="space-y-2">
                    ${notifs.map(n => `<div class="p-3 bg-stone-900 rounded-xl border text-xs"><b class="text-amber-300">${n.title}</b> (${n.date})<p class="text-amber-100 mt-1">${n.message}</p></div>`).join('')}
                </div>
            </div>`;
        }
        function renderQuizzesTab(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-2xl mx-auto"><h2 class="text-xl font-bold text-amber-400">Quiz & Évaluations</h2></div>`; }
        function renderDocPage(t, items) {
            return `<div class="max-w-3xl mx-auto space-y-4 text-xs">
                <div class="dyn-card border p-6 rounded-3xl"><h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-book-open mr-2"></i>${t}</h2></div>
                <div class="space-y-3">
                    ${items.map(i => `<div class="dyn-card border p-4 rounded-2xl flex justify-between items-center"><span class="font-bold text-amber-100">${i.title}</span><button onclick="openFileViewer('${i.title}', '${i.fileData}', '${i.fileType}')" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold">Consulter</button></div>`).join('')}
                </div>
            </div>`;
        }
        function renderExamsTab() { return `<div class="dyn-card border p-6 rounded-3xl max-w-3xl mx-auto"><h3 class="font-bold text-amber-400">Sujets Bac</h3></div>`; }
        function renderIdeasPage(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-2xl mx-auto"><h2 class="text-xl font-bold text-amber-400">Boîte à Idées (Vote 48h)</h2></div>`; }
        function renderLeaderboardSection(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-3xl mx-auto"><h3 class="font-bold text-amber-400">Classement Classe</h3></div>`; }
        function renderChat(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-3xl mx-auto"><h3 class="font-bold text-amber-400">Messagerie</h3></div>`; }
        function renderTicketsTab(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-3xl mx-auto"><h3 class="font-bold text-amber-400">Support & Mails</h3></div>`; }
        function renderProfileTab(u) { return `<div class="dyn-card border p-6 rounded-3xl max-w-2xl mx-auto"><h3 class="font-bold text-amber-400">Profil de ${u.username}</h3></div>`; }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();
            let user = (DB.get('users') || []).find(x => x.username === u && x.password === p);
            if (user) { sessionStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); }
            else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let user = getCurrentUser(), users = DB.get('users') || [], idx = users.findIndex(u => u.username === user.username);
            if (idx !== -1) {
                users[idx].realName = document.getElementById('s-realname').value;
                users[idx].password = document.getElementById('s-pass').value;
                users[idx].birthDate = document.getElementById('s-bdate').value;
                users[idx].email = document.getElementById('s-email').value;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                sessionStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() { sessionStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
